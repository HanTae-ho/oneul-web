name: Apply V8.2.68 reminder and music audit patch
on:
  push:
    branches: [fix-v8.2.68-reminder-music-audit]
    paths: ['.github/workflows/v8268-web-patch.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal web patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 anchor, got {n}')
              s=s.replace(old,new,1)

          once("const BUILD = 'V8.2.67';", "const BUILD = 'V8.2.68';", 'BUILD')

          old='''function save(){\n  try{ localStorage.setItem(KEY, JSON.stringify(S)); }\n  catch(e){ toast('저장 공간이 부족합니다. 내 정보에서 오래된 기록을 내보내주세요.'); }\n}\n'''
          new='''let nativeReminderSyncReady = false;\nlet nativeReminderLastSig = '';\nlet nativeReminderSyncTimer = 0;\nfunction save(){\n  try{ localStorage.setItem(KEY, JSON.stringify(S)); }\n  catch(e){ toast('저장 공간이 부족합니다. 내 정보에서 오래된 기록을 내보내주세요.'); }\n  if(nativeReminderSyncReady) queueNativeReminderSync();\n}\n'''
          once(old,new,'save sync state')

          old='''function openNativeReminderSettings(){\n  const p = nativeReminderPayload();\n  const q = new URLSearchParams();\n  Object.keys(p).forEach(k => q.set(k, p[k]));\n  /* package를 명시해 다른 앱이 oneul 스킴을 가로채지 못하게 합니다. */\n  const u = 'intent://reminders?' + q.toString() +\n    '#Intent;scheme=oneul;package=io.github.hantae_ho.twa;end';\n  location.href = u;\n}\n'''
          new='''function nativeReminderSignature(){\n  const p = nativeReminderPayload();\n  return JSON.stringify({risk:p.risk, meds:p.meds, eats:p.eats, bed:p.bed, habits:p.habits, visit:p.visit, visitInterval:p.visitInterval});\n}\nfunction nativeReminderIntent(extra){\n  const p = nativeReminderPayload();\n  const q = new URLSearchParams();\n  Object.keys(p).forEach(k => q.set(k, p[k]));\n  Object.keys(extra || {}).forEach(k => q.set(k, String(extra[k])));\n  /* package를 명시해 다른 앱이 oneul 스킴을 가로채지 못하게 합니다. */\n  return 'intent://reminders?' + q.toString() +\n    '#Intent;scheme=oneul;package=io.github.hantae_ho.twa;end';\n}\nfunction openNativeReminderSettings(){\n  location.href = nativeReminderIntent();\n}\nfunction applyNativeReminderSync(){\n  if(!nativeAndroidApp()) return;\n  location.href = nativeReminderIntent({apply:1});\n}\nfunction clearNativeReminders(){\n  if(!nativeAndroidApp()) return;\n  location.href = nativeReminderIntent({clear:1});\n}\nfunction queueNativeReminderSync(){\n  if(!nativeReminderSyncReady || !nativeAndroidApp()) return;\n  let sig = '';\n  try{ sig = nativeReminderSignature(); }catch(e){ return; }\n  if(sig === nativeReminderLastSig) return;\n  nativeReminderLastSig = sig;\n  clearTimeout(nativeReminderSyncTimer);\n  nativeReminderSyncTimer = setTimeout(applyNativeReminderSync, 300);\n}\nwindow.addEventListener('load', () => {\n  try{ nativeReminderLastSig = nativeReminderSignature(); }catch(e){ nativeReminderLastSig = ''; }\n  nativeReminderSyncReady = true;\n}, {once:true});\n'''
          once(old,new,'native sync helpers')

          old="""      S = migrate(Object.assign(JSON.parse(JSON.stringify(BLANK)), j));\n      save();\n      applyTheme();\n      toast('불러왔습니다.');\n      go('home');"""
          new="""      S = migrate(Object.assign(JSON.parse(JSON.stringify(BLANK)), j));\n      save();  /* V8.2.68: 알림 관련 값이 달라졌으면 Android 예약도 자동 교체합니다. */\n      applyTheme();\n      toast('불러왔습니다.');\n      go('home');"""
          once(old,new,'backup import comment')

          old="""    localStorage.removeItem(KEY);\n    S = JSON.parse(JSON.stringify(BLANK));\n    closeModal();\n    obTypes = []; obDates = {};\n    drawIntro();\n    go('intro');"""
          new="""    localStorage.removeItem(KEY);\n    S = JSON.parse(JSON.stringify(BLANK));\n    /* 웹 기록만 비우고 Android AlarmManager 예약이 남는 일을 막습니다. */\n    try{ nativeReminderLastSig = nativeReminderSignature(); }catch(e){ nativeReminderLastSig = ''; }\n    closeModal();\n    obTypes = []; obDates = {};\n    drawIntro();\n    go('intro');\n    setTimeout(clearNativeReminders, 80);"""
          once(old,new,'wipe native clear')

          old="""    const lab = c.l ? '음원 출처 · ' + c.l : '음원 출처';"""
          new="""    const lab = c.l ? '현재 재생 음원 · ' + c.l : '현재 재생 음원';"""
          once(old,new,'audio meta label')

          old="""    (x.a ? '<span>' + esc(x.a) + '</span>' : '') +"""
          new="""    (x.a ? '<span>추천 연주 예시 · ' + esc(x.a) + '</span>' : '') +"""
          once(old,new,'recommended performer label')
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s2=s.replace("const APP_VERSION = 'V8.2.67';","const APP_VERSION = 'V8.2.68';",1).replace("const V = 'ohg-v8267-legal';","const V = 'ohg-v8268-reminder-music';",1)
          if s2==s or s2.count("V8.2.68")<1: raise SystemExit('sw version anchors')
          p.write_text(s2,encoding='utf-8')

          p=Path('legal.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('V8.2.67','V8.2.68')
          css='.lictable{width:100%;border-collapse:collapse;margin:12px 0;font-size:12.5px}.lictable th,.lictable td{border-top:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}.lictable th{font-size:12px;color:var(--dim)}'
          anchor='@media(max-width:520px){.nav{flex-direction:column}}'
          if s.count(anchor)!=1: raise SystemExit('legal css anchor')
          s=s.replace(anchor,css+anchor,1)
          anchor='<p class="small">이 페이지의 통합 표시는 개별 음원 라이선스가 요구하는 조건을 대체하거나 완화하지 않습니다. 원본 파일 페이지의 조건이 가장 우선합니다.</p>'
          table='''<p><b>현재 직접재생에 사용되는 Creative Commons 음원</b></p>\n<table class="lictable"><thead><tr><th>번호</th><th>실제 재생 파일의 연주·제작 크레딧</th><th>라이선스</th></tr></thead><tbody>\n<tr><td>6</td><td><a href="https://commons.wikimedia.org/wiki/File:Chopin_op10_No_12.ogg" target="_blank" rel="noopener">Bernd Krueger</a></td><td>CC BY-SA 3.0 DE</td></tr>\n<tr><td>8</td><td><a href="https://commons.wikimedia.org/wiki/File:Maurice_Ravel_-_Th%C3%A9r%C3%A8se_Dussaut_-_Pavane_pour_une_infante_d%C3%A9funte.ogg" target="_blank" rel="noopener">Thérèse Dussaut 연주 · Glenn White 녹음</a></td><td>CC BY-SA 2.0</td></tr>\n<tr><td>16</td><td><a href="https://commons.wikimedia.org/wiki/File:Ravel%27s_Jeux_d%27eau,_M._30_-_Anna_Sutyagina.ogg" target="_blank" rel="noopener">Anna Sutyagina</a> / <a href="https://commons.wikimedia.org/wiki/File:Ravel%27s_Jeux_d%27eau,_M._30_-_Bernd_Krueger.ogg" target="_blank" rel="noopener">Bernd Krueger(대체)</a></td><td>CC BY 3.0 / CC BY-SA 3.0 DE</td></tr>\n<tr><td>19</td><td><a href="https://commons.wikimedia.org/wiki/File:JOHN_MICHEL_CELLO-DVORAK_CELLO_CONCERTO_in_B_Minor_2nd.ogg" target="_blank" rel="noopener">John Michel, cello</a></td><td>CC BY-SA 3.0</td></tr>\n<tr><td>20</td><td><a href="https://commons.wikimedia.org/wiki/File:Jesu,_Joy_of_Man%27s_Desiring.ogg" target="_blank" rel="noopener">Commons 파일 페이지 크레딧</a> / <a href="https://commons.wikimedia.org/wiki/File:Jesu,_Joy_of_Man%27s_Desiring2.ogg" target="_blank" rel="noopener">Incompetech 제공 대체 파일</a></td><td>CC BY-SA 2.5 / CC BY 2.0</td></tr>\n<tr><td>21</td><td><a href="https://commons.wikimedia.org/wiki/File:Schubert_-_Arpeggione_Sonata_-_1._Allegro_Moderato.ogg" target="_blank" rel="noopener">Hans Goldstein, cello · Clinton Adams, piano</a></td><td>CC BY-SA 2.0</td></tr>\n<tr><td>25</td><td><a href="https://commons.wikimedia.org/wiki/File:Bach_-_Flute_Sonata_E_flat_Maj_-_2._Siciliana.ogg" target="_blank" rel="noopener">Alex Murray, traverso · Martha Goldstein, harpsichord</a></td><td>CC BY-SA 2.0</td></tr>\n<tr><td>26</td><td><a href="https://commons.wikimedia.org/wiki/File:Franz_Liszt_-_Consolation_No._3,_Lento_placido.ogg" target="_blank" rel="noopener">Benedict Kramer, piano · Tobias Lohner, recording</a></td><td>CC BY-SA 4.0</td></tr>\n<tr><td>28</td><td><a href="https://commons.wikimedia.org/wiki/File:Harpsichord_Concerto_no._5_in_F_minor,_BWV_1056_-_II._Largo.ogg" target="_blank" rel="noopener">Michel Rondeau, performer · Musopen source</a></td><td>CC BY-SA 3.0</td></tr>\n</tbody></table>\n<p class="small">앱은 위 파일을 편집·변형하거나 자체 음원으로 재배포하지 않고 Wikimedia Commons의 원본 직접재생 주소를 연결합니다. 운영 자원시트의 <code>direct_audio</code> 항목만 재생하며, 권리 또는 직접 URL이 보류된 10·11·13·17·22·23·24·27·29번은 자동재생에서 제외합니다.</p>\n'''+anchor
          if s.count(anchor)!=1: raise SystemExit('legal music anchor')
          s=s.replace(anchor,table,1)
          p.write_text(s,encoding='utf-8')

          p=Path('privacy.html'); s=p.read_text(encoding='utf-8').replace('V8.2.67','V8.2.68')
          p.write_text(s,encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          head='''## V8.2.68 — 기록 초기화·Android 알림 동기화 · 음원 라이선스 정합성\n- `기록 관리 → 전체 지우기`가 `ohg.v1`만 삭제하고 Android AlarmManager 예약을 남기던 문제를 수정합니다. Android V8.2.68에서는 일반·습관·외래 예약 저장소를 모두 비우고 기존 PendingIntent를 취소합니다.\n- 백업 불러오기와 복약·식사·잠·습관·외래·위험시간 변경은 알림 관련 상태가 실제로 달라진 경우에만 Android 예약에 조용히 동기화합니다. 감정·HALT·일지처럼 알림과 무관한 저장은 네이티브 동기화를 실행하지 않습니다.\n- 외래 알림에서 3일 전·1일 전·당일을 모두 끈 설정을 다시 열었을 때 기본값으로 되살리던 경계조건도 수정합니다.\n- 운영 자원시트 `[음악]`의 30행을 실제 Apps Script 응답으로 검증했습니다. `direct_audio`만 재생하고 Primary → Backup1 → Backup2 순서를 유지하며, 권리/직접 URL 보류 10·11·13·17·22·23·24·27·29번은 자동재생에서 계속 제외합니다.\n- 듣는 글의 기존 연주자 표기는 `추천 연주 예시`로 명확히 바꾸고, 실제 재생되는 CC 음원은 `저작권 · 출처 · 라이선스`에 연주·제작자, Commons 원본 페이지, 라이선스를 별도로 표시합니다.\n- `DATA_SCHEMA=6`, 저장키 `ohg.v1`, 정확알림 스케줄러, 부팅 재예약, 마음프로 TTS·이완 TTS, 회복기록 구조는 변경하지 않습니다.\n\n'''
          if s.startswith('## V8.2.68'): raise SystemExit('README already patched')
          p.write_text(head+s,encoding='utf-8')
          PY
      - name: Syntax and regression simulations
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import re, json, urllib.request
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const BUILD = 'V8.2.68';" in s
          assert "const DATA_SCHEMA = 6;" in s
          assert "const KEY = 'ohg.v1';" in s
          assert 'setTimeout(clearNativeReminders, 80)' in s
          assert 'nativeReminderIntent({apply:1})' in s
          assert 'nativeReminderIntent({clear:1})' in s
          assert 'if(sig === nativeReminderLastSig) return;' in s
          assert "추천 연주 예시 · " in s
          assert "현재 재생 음원 · " in s
          # unrelated save simulation: identical signature must be a no-op; changed reminder state must sync.
          def sig(p): return json.dumps({k:p.get(k,'') for k in ['risk','meds','eats','bed','habits','visit','visitInterval']},sort_keys=True)
          base={'risk':'21','meds':'am@08:00','eats':'am@08:00','bed':'23:00','habits':'h1@20:00@2026-09-09@21@0123456','visit':'','visitInterval':''}
          assert sig(base)==sig({**base,'mood':'bad','note':'changed'})
          assert sig(base)!=sig({**base,'meds':''})
          assert sig(base)!=sig({**base,'eats':'noon@12:30'})
          assert sig(base)!=sig({**base,'visit':'2026-09-30','visitInterval':'30'})
          # live resource invariants
          m=re.search(r"const SHEET_URL = '([^']+)'",s); assert m
          with urllib.request.urlopen(m.group(1),timeout=60) as r: d=json.load(r)
          music=d.get('music',[]); assert len(music)==30
          hold={'10','11','13','17','22','23','24','27','29'}
          for row in music:
              direct=[]
              for a,t in [('p','pt'),('b1','b1t'),('b2','b2t')]:
                  if row.get(t)=='direct_audio' and str(row.get(a,'')).startswith(('http://','https://')): direct.append(row[a])
              if str(row.get('n')) in hold: assert not direct, row.get('n')
              # source/search rows must never count as direct playback.
              for t in ('pt','b1t','b2t'):
                  assert row.get(t) in ('direct_audio','source_page','audio_search','none','')
          print('V8.2.68 state/music simulations PASS')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check sw.js
          grep -F "const APP_VERSION = 'V8.2.68';" sw.js
          grep -F "const V = 'ohg-v8268-reminder-music';" sw.js
          grep -F 'admin@maumpro.com' legal.html
          grep -F 'CC BY-SA 4.0' legal.html
      - name: Commit patched files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js legal.html privacy.html README.md
          git commit -m 'fix: sync native reminders and clarify audio licenses'
          git push
