name: V8.1.1 treatment hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v811-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply minimal V8.1.1 fix
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "  drawMed();\n  drawBody();"
          assert s.count(old) == 1, f'unexpected drawMed call count: {s.count(old)}'
          assert s.count("const BUILD = 'V8.1';") == 1
          s = s.replace(old, "  /* V8.1.1: 복약 설정은 치료관리 화면에서만 그립니다. */\n  drawBody();", 1)
          s = s.replace("const BUILD = 'V8.1';", "const BUILD = 'V8.1.1';", 1)
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          assert s.count("const APP_VERSION = 'V8.1';") == 1
          assert s.count("const V = 'ohg-v810-treatment';") == 1
          s = s.replace("const APP_VERSION = 'V8.1';", "const APP_VERSION = 'V8.1.1';", 1)
          s = s.replace("const V = 'ohg-v810-treatment';", "const V = 'ohg-v811-treatment';", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate hotfix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const BUILD = 'V8.1.1';" in s
          assert "const APP_VERSION = 'V8.1.1';" in sw
          assert "const V = 'ohg-v811-treatment';" in sw
          assert "  drawMed();\n  drawBody();" not in s
          assert 'id="me-med-cnt"' not in s
          assert 'id="treat-med-cnt"' in s
          assert 'function drawTreatment()' in s
          assert 'function drawBody()' in s
          assert 'function drawNotify()' in s
          print('V8.1.1 treatment DOM hotfix validation: PASS')
          PY
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'Fix V8.1 treatment legacy medication renderer'
          git push origin main
