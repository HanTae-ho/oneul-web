name: Harden and validate V9.0 social

on:
  push:
    branches: [v9.0-social-stage1]
    paths:
      - '.github/workflows/harden-v90-social.yml'

permissions:
  contents: write

jobs:
  harden-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0-social-stage1
          fetch-depth: 0

      - name: Apply auth deletion privacy hardening
        run: python3 scripts/harden_v90_social.py

      - name: Verify authenticated feed and profile deletion
        run: |
          set -euo pipefail
          grep -F "if(action === 'feed') return json_(feed_(body));" social-apps-script.gs
          grep -F "if(action === 'profileDelete') return json_(profileDelete_(body));" social-apps-script.gs
          ! grep -F "if(a === 'feed')" social-apps-script.gs
          grep -F "const me = auth_(p.userId,p.token); if(!me.ok) return me;" social-apps-script.gs
          grep -F "function profileDelete_(b)" social-apps-script.gs
          grep -F "function cleanupReports_()" social-apps-script.gs
          grep -F "365*24*60*60*1000" social-apps-script.gs
          grep -F "socialWrite('feed',Object.assign({sort:socialState.sort},socialAuth()))" index.html
          grep -F "social-profile-delete" index.html
          grep -F "socialWrite('profileDelete',socialAuth())" index.html
          grep -F '소셜 신고:</b> 안전·운영 확인을 위해 최대 1년' privacy.html
          grep -F '앱 기준 V9.0</footer>' privacy.html

      - name: Verify recovery/social separation remains intact
        run: |
          set -euo pipefail
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          a=s.index('const SOCIAL_REPORT_REASONS')
          b=s.index('/* ══════════ 모임 찾기 ══════════',a)
          block=s[a:b]
          for bad in ['S.urges','S.halts','S.relapses','S.screenings','S.meds','S.medLog','S.aiChat','S.dates','S.types']:
              if bad in block: raise SystemExit('social reads recovery data: '+bad)
          print('social/recovery separation PASS')
          PY
          ! grep -Eq 'S\.(urges|halts|relapses|screenings|meds|dates|types)' social-apps-script.gs

      - name: Syntax and diff checks
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
          open('/tmp/index-inline.js','w',encoding='utf-8').write('\n;\n'.join(blocks))
          PY
          node --check /tmp/index-inline.js
          cp social-apps-script.gs /tmp/social-apps-script.js
          node --check /tmp/social-apps-script.js
          git diff --check
          git diff --stat

      - name: Commit hardened V9.0
        run: |
          set -euo pipefail
          rm .github/workflows/harden-v90-social.yml scripts/harden_v90_social.py
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add index.html privacy.html README.md SOCIAL_SETUP.md social-apps-script.gs \
            .github/workflows/harden-v90-social.yml scripts/harden_v90_social.py
          git commit -m 'V9.0 소셜 피드 인증 · 프로필 삭제 강화'
          git push origin HEAD:v9.0-social-stage1
