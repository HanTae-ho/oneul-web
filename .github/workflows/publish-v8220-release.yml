name: Publish V8.2.20 test release

on:
  push:
    branches: [android-v8.2.20-smart-balance-pie]
    paths:
      - '.github/workflows/publish-v8220-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.20 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34011676751 -n oneul-v8.2.20-smart-balance-pie-apk -D dist-apk
          gh run download 34011676751 -n oneul-v8.2.20-smart-balance-pie-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.20.apk
          cp dist-aab/*.aab oneul-v8.2.20.aab
          test -s oneul-v8.2.20.apk
          test -s oneul-v8.2.20.aab
      - name: Publish V8.2.20 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.20-test --yes --cleanup-tag || true
          gh release create v8.2.20-test oneul-v8.2.20.apk oneul-v8.2.20.aab \
            --target android-v8.2.20-smart-balance-pie \
            --title '오늘 한 걸음 V8.2.20 SMART 라이프스타일 밸런스 파이 테스트' \
            --notes 'SMART Recovery 번역본 Point 4의 Lifestyle Balance Pie를 추가했습니다. 가족·친구·영성·연애/관계·건강·일·여가/레크리에이션·재정 등 삶의 영역을 선택하고 각 영역의 현재 만족도를 0~10으로 기록하여 원형 밸런스 파이로 확인할 수 있습니다. 화면은 1 삶의 영역과 만족도, 2 완성된 파이 돌아보기, 3 먼저 돌볼 영역과 작은 변화의 아코디언 흐름으로 구성했습니다. 번역본의 돌아보기 질문 전체는 기본 접힘 상태로 보존해 필요할 때 펼쳐볼 수 있습니다. 다른 삶의 영역을 직접 추가하거나 불필요한 영역을 뺄 수 있고, 먼저 돌볼 영역·막히는 점·작은 행동·시작일을 기록합니다. 기록은 기존 smartWorks에 기기 내부 저장되며 보기·수정·삭제가 가능합니다. 가족모드는 상대를 평가하지 않고 가족 자신의 삶의 균형을 점검합니다. DATA_SCHEMA 6, 기존 SMART Point 1~3, 홈 일정, Android 습관·생활·치료·외래 정확알림 엔진은 변경하지 않았습니다.' \
            --prerelease
