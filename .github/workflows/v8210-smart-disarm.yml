name: V8.2.10 SMART DISARM

on:
  push:
    branches: [v8.2.10-smart-disarm]
    paths:
      - 'v8210-smart-disarm.py'
      - '.github/workflows/v8210-smart-disarm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.10-smart-disarm
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SMART DISARM patch
        run: python v8210-smart-disarm.py
      - name: Verify product changes
        run: |
          grep -q "const BUILD = 'V8.2.10'" index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q 'id="p-smart-disarm"' index.html
          grep -q 'function drawSmartDisarm' index.html
          grep -q "type === 'smart-disarm'" index.html
          grep -q 'Destructive Images and Self-talk Awareness and Refusal Method' index.html
          grep -q '이름을 붙이는 것은 <b>선택</b>' index.html
          grep -q "urgeUseCope('DISARM · 자기대화 거부·대체')" index.html
          grep -q '가족이 상대의 생각을 분석하거나 논박하고, 충동을 감시·통제하는 용도로 사용하지 않습니다' index.html
          grep -q '"type": "smart-disarm"' learning-data.js
          grep -q '"label": "DISARM 충동의 목소리 다루기"' learning-data.js
          grep -q "const APP_VERSION = 'V8.2.10'" sw.js
          grep -q "ohg-v8210-smart-disarm" sw.js
          node --check learning-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html learning-data.js sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.10 add SMART Recovery DISARM tool' || true
          git push
