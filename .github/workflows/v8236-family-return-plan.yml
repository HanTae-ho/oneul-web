name: Validate V8.2.36 family return plan

on:
  push:
    branches: [v8.2.36-family-return-plan]
    paths:
      - 'v8236-family-return-plan.py'
      - '.github/workflows/v8236-family-return-plan.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.36-family-return-plan
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V8.2.36 patch
        run: python v8236-family-return-plan.py
      - name: Validate syntax and invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          checks=[
            ("const BUILD = 'V8.2.36';",'build'),
            ("const DATA_SCHEMA = 6;",'schema6'),
            ('id="p-family-return-plan"','page'),
            ("tool:'family-return-plan',role:'family'",'storage'),
            ("a:'family-return-plan', al:'내 대응계획 정리하기'",'guide action'),
            ("if(action==='family-return-plan'){ go('family-return-plan'); return; }",'route'),
            ("if(p === 'family-return-plan') drawFamilyReturnPlan();",'dispatch'),
            ('상대의 재발일·사용량을 기록하거나 평가하는 화면이 아닙니다.','non-monitoring'),
            ('가족 위기 안내 보기','safety link'),
            ("tool==='family-conversation'",'conversation preserved'),
            ("tool==='family-boundary'",'boundary preserved'),
            ('가족은 충동·재발을 기록하지 않습니다.','family no relapse record'),
            ('PowerManager.PARTIAL_WAKE_LOCK','tts marker'),
          ]
          # TTS marker exists in generated Android scripts, not index, so validate web/native-facing markers separately below.
          for text,label in checks[:-1]:
            assert text in s, label
          assert "const APP_VERSION = 'V8.2.36';" in Path('sw.js').read_text(encoding='utf-8')
          assert "ohg-v8236-family-return-plan" in Path('sw.js').read_text(encoding='utf-8')
          # No new family use-event storage: the new tool must stay inside smartWorks and must not write S.relapses.
          a=s.index('function familyReturnPlanRows()')
          b=s.index('function familyConversationRows()',a)
          block=s[a:b]
          assert 'S.smartWorks' in block
          assert 'S.relapses' not in block
          assert 'S.dates' not in block
          # Syntax-check each inline script separately.
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
            Path(f'/tmp/inline_{i}.js').write_text(js,encoding='utf-8')
          print('inline scripts',len(scripts))
          PY
          for f in /tmp/inline_*.js; do node --check "$f"; done
          node --check sw.js
      - name: Verify scope
        run: |
          git diff --name-only
          python - <<'PY'
          import subprocess
          allowed={'README.md','index.html','sw.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed, changed
          PY
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html sw.js
          git commit -m 'V8.2.36 family return response plan'
          git push origin HEAD:v8.2.36-family-return-plan
