name: Publish V8.2.2 test release

on:
  push:
    branches: [android-v8.2.2-urge-diary]
    paths:
      - '.github/workflows/publish-v822-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.2 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33929933159 -n oneul-v8.2.2-urge-diary-apk -D dist-apk
          gh run download 33929933159 -n oneul-v8.2.2-urge-diary-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.2.apk
          cp dist-aab/*.aab oneul-v8.2.2.aab
          test -s oneul-v8.2.2.apk
          test -s oneul-v8.2.2.aab
      - name: Publish V8.2.2 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.2-test --yes --cleanup-tag || true
          gh release create v8.2.2-test oneul-v8.2.2.apk oneul-v8.2.2.aab \
            --target android-v8.2.2-urge-diary \
            --title '오늘 한 걸음 V8.2.2 충동일기 테스트' \
            --notes 'SMART Recovery 충동일지의 시간·강도·지속·촉발·대처 구조를 참고해 회복도구에 충동일기를 추가했습니다. 위기 대응에서 고른 장소·동행·촉발요인은 자동 임시저장되어 중간에 나가도 이어쓸 수 있고, 대응을 마치면 충동일기에 저장됩니다. 직접 충동 기록도 작성할 수 있으며 생각·감정·대처·대체행동·메모를 남길 수 있습니다. 2건 이상 쌓이면 반복되는 시간·장소·촉발을 간단히 보여줍니다. 정확한 위치정보는 저장하지 않습니다. 몸이 이상해요 설명은 더 짧게 다듬었고 기존 Android 습관·생활·치료 예약알림 엔진은 변경하지 않았습니다.' \
            --prerelease
