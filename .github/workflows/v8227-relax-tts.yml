name: Validate V8.2.27 relaxation TTS

on:
  push:
    branches: [v8.2.27-relax-tts]
    paths:
      - 'v8227-relax-tts.py'
      - '.github/workflows/v8227-relax-tts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.27-relax-tts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V8.2.27 patch
        run: python v8227-relax-tts.py
      - name: Validate TTS structure and preserved behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          w=Path('sw.js').read_text(encoding='utf-8')
          checks={
            'build': "const BUILD = 'V8.2.27';" in s,
            'schema6': 'const DATA_SCHEMA = 6;' in s,
            'sw-version': "const APP_VERSION = 'V8.2.27';" in w,
            'sw-cache': "const V = 'ohg-v8227-relax-tts';" in w,
            'voice-card': 'id="smart-relax-voice-card"' in s,
            'voice-select': 'id="smart-relax-voice"' in s,
            'preview': 'id="smart-relax-voice-preview"' in s,
            'player': 'id="smart-relax-player"' in s,
            'pause': 'id="smart-relax-player-pause"' in s and 'window.speechSynthesis.pause()' in s,
            'resume': 'window.speechSynthesis.resume()' in s,
            'stop': 'window.speechSynthesis.cancel()' in s,
            'tts-api': 'SpeechSynthesisUtterance' in s and '.getVoices()' in s,
            'voiceschanged': "'voiceschanged'" in s,
            'korean-filter': "/^ko([_-]|$)/i" in s,
            'soft-rate': 'const RELAX_TTS_RATE=.88;' in s,
            'separate-setting': "const RELAX_TTS_VOICE_KEY='ohg.relaxVoice.v1';" in s,
            'pmr-button': s.count('data-relax-guide="pmr"')==1,
            'visual-button': s.count('data-relax-guide="visual"')==1,
            'meditation-button': s.count('data-relax-guide="meditation"')==1,
            'pmr-5sec': "['먼저 이마에 천천히 힘을 줍니다.',5000]" in s,
            'guided-pauses': '20000' in s and '15000' in s and '12000' in s,
            'stop-on-leave': "prev === 'smart-relax' && p !== 'smart-relax'" in s,
            'old-breath': '4초 들이쉬기 · 6초 내쉬기' in s,
            'balance': '라이프스타일 밸런스 파이' in s,
            'vaci': 'VACI · 활력 넘치는 창의적 관심사' in s,
            'smart-goal': 'SMART 목표 설정' in s,
            'habit-link': '이 실행을 습관으로 추가' in s,
          }
          bad=[k for k,v in checks.items() if not v]
          if bad: raise SystemExit('failed checks: '+', '.join(bad))
          if '번역본' in s: raise SystemExit('disallowed user-facing wording found in index.html')
          print('structure checks PASS')
          PY
      - name: JavaScript syntax checks
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          if not blocks: raise SystemExit('no inline scripts')
          for i,b in enumerate(blocks):
              Path(f'/tmp/inline-{i}.js').write_text(b,encoding='utf-8')
          print(len(blocks))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          node --check sw.js
      - name: Validate product diff scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit validated product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.27 add guided TTS for relaxation'
          git push origin HEAD:v8.2.27-relax-tts
