name: Publish V8.2.32 test release

on:
  push:
    branches: [android-v8.2.32-family-integration]
    paths:
      - '.github/workflows/publish-v8232-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.32 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34070038449 -n oneul-v8.2.32-family-integration-apk -D dist-apk
          gh run download 34070038449 -n oneul-v8.2.32-family-integration-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.32.apk
          cp dist-aab/*.aab oneul-v8.2.32.aab
          test -s oneul-v8.2.32.apk
          test -s oneul-v8.2.32.aab
      - name: Publish V8.2.32 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.32-test --yes --cleanup-tag || true
          gh release create v8.2.32-test oneul-v8.2.32.apk oneul-v8.2.32.aab \
            --target android-v8.2.32-family-integration \
            --title '오늘 한 걸음 V8.2.32 가족모드 통합 정합성 테스트' \
            --notes '가족 SMART를 별도 Family & Friends 프로그램으로 재편하지 않고 오늘 한 걸음의 독자적인 가족모드 원칙을 유지했습니다. 가족모드 SMART 학습에서는 가족 자신의 삶과 반응을 중심으로 사용한다는 안내를 추가하고, Point 2의 충동대응은 당사자의 회복을 이해하기 위한 참고 영역으로 분리하여 가족에게 충동대응·DEADS·DISARM·충동일지 실행 버튼을 제공하지 않습니다. 가족 안내 18편 중 연결 가치가 높은 글은 새 워크시트를 만들지 않고 기존 CBA·ABC·밸런스 파이·건강회복·가족모임·헬프로 이어지도록 했습니다. DATA_SCHEMA 6과 기존 가족 기록·SMART·12단계 가족 점검은 그대로 유지하며 Android 네이티브 이완 TTS, 화면 OFF 지속 재생, 0.7/0.8/0.9/1.0 속도 선택, 정확알림 엔진과 부팅 후 재예약도 그대로 유지했습니다.' \
            --prerelease
