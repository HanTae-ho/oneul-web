name: Apply V8.2.60 MindPro consent

on:
  push:
    branches: [v8.2.60-mindpro-ai-consent]
    paths:
      - '.tmp_v8260_mindpro_consent.py'
      - '.github/workflows/v8260-mindpro-consent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.60-mindpro-ai-consent
      - name: Apply exact MindPro consent patch
        run: python .tmp_v8260_mindpro_consent.py
      - name: Verify consent gate and protected data
        run: |
          grep -Fq "const BUILD = 'V8.2.60';" index.html
          grep -Fq "const KEY = 'ohg.v1';" index.html
          grep -Fq "const DATA_SCHEMA = 6;" index.html
          grep -Fq "const AI_CONSENT_VERSION = 1;" index.html
          grep -Fq "if(!isLocal && !aiEnsureExternalConsent(text, topic)) return;" index.html
          grep -Fq "S.aiConsent = AI_CONSENT_VERSION" index.html
          grep -Fq "S.aiConsent = 0; save();" index.html
          grep -Fq "동의하고 계속" index.html
          grep -Fq "개인정보처리방침 보기" index.html
          grep -Fq "최근 일반 AI 대화 최대 8개" index.html
          grep -Fq "내 발자취 · 자가점검 점수 · 12단계 · 회복 실천도구 · 복약" index.html
          grep -Fq "V8.2.60" privacy.html
          grep -Fq "명시적 동의" privacy.html
          grep -Fq "동의를 철회" privacy.html
          grep -Fq "const APP_VERSION = 'V8.2.60';" sw.js
          grep -Fq "const V = 'ohg-v8260-mindpro-consent';" sw.js
      - name: Verify consent happens before external chat history is created
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          start=s.index('async function aiSend(text, topic)')
          end=s.index("$('#ai-guide-toggle').onclick", start)
          f=s[start:end]
          assert f.index('if(!isLocal && !aiEnsureExternalConsent(text, topic)) return;') < f.index("const prior = (Array.isArray(S.aiChat)")
          assert "if(!aiEndpoint()) return true;" in s
          assert "if(!isLocal" in f
          print('consent order and local bypass: PASS')
          PY
      - name: Check JavaScript and HTML basics
        run: |
          node --check sw.js
          node --check learning-data.js
          node --check qa-data.js
          node --check screening-data.js
          node --check workbook-data.js
          python - <<'PY'
          import re, pathlib, subprocess
          for html in ['index.html','privacy.html']:
              s=pathlib.Path(html).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
              for i,js in enumerate(scripts):
                  if not js.strip(): continue
                  p=f'/tmp/{html.replace(".","-")}-{i}.js'
                  pathlib.Path(p).write_text(js,encoding='utf-8')
                  subprocess.run(['node','--check',p],check=True)
          print('inline JavaScript: PASS')
          PY
      - name: Diff guard
        run: |
          git diff --check
          git status --short
          git diff -- README.md index.html privacy.html sw.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "README.md index.html privacy.html sw.js "
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html privacy.html sw.js
          git diff --cached --check
          git commit -m 'V8.2.60 마음프로 AI 외부 전송 고지 동의'
          git push
