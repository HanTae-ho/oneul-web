name: Fix V9.0.8 patch workflow trigger

on:
  push:
    branches: [v9.0.8-social-ui]
    paths:
      - '.github/workflows/fix-patch-v908-workflow.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.8-social-ui
      - name: Remove invalid job condition
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/patch-v908-social.yml')
          s=p.read_text(encoding='utf-8')
          old="    if: ${{ !contains(github.event.head_commit.message, '[v908-social-patched]') }}\n"
          if old not in s: raise SystemExit('target condition not found')
          p.write_text(s.replace(old,'',1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/patch-v908-social.yml
          git commit -m 'Fix V9.0.8 patch workflow condition'
          git push origin HEAD:v9.0.8-social-ui
