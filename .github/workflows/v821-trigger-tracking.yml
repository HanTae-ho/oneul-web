name: Apply V8.2.1 Trigger Tracking V2

on:
  push:
    branches: [v8.2.1-trigger-tracking]
    paths:
      - 'v821-trigger-tracking.py'
      - '.github/workflows/v821-trigger-tracking.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.1-trigger-tracking
          fetch-depth: 0
      - name: Apply V8.2.1 patch
        run: python v821-trigger-tracking.py
      - name: Verify JavaScript and trigger tracking
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          if not blocks: raise SystemExit('no inline scripts')
          js=max(blocks,key=len)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); name=f.name
          subprocess.run(['node','--check',name],check=True)
          required=[
            "const BUILD = 'V8.2.1'",
            'const DATA_SCHEMA = 4;',
            'URGE_CONTEXTS', 'URGE_TRIGGERS',
            "ctx: urge.contexts.slice()", "trg: urge.triggers.slice()",
            '상황·촉발 기록 (선택)',
            '정확한 위치는 저장하지 않습니다.',
            '손떨림·식은땀·경련·환각은 응급상황일 수 있습니다'
          ]
          for x in required:
              if x not in s: raise SystemExit('missing '+x)
          if '손떨림·식은땀·경련·환각이 있다면 응급 상황입니다' in s:
              raise SystemExit('old urgent copy remains')
          sw=Path('sw.js').read_text(encoding='utf-8')
          if "const APP_VERSION = 'V8.2.1'" not in sw or "ohg-v821-trigger-tracking" not in sw:
              raise SystemExit('service worker version mismatch')
          print('V8.2.1 JS/UI verification PASS')
          PY
      - name: Verify limited scope
        run: |
          git diff --check
          files=$(git diff --name-only | sort | tr '\n' ' ')
          test "$files" = "index.html sw.js "
      - name: Commit V8.2.1 web files
        run: |
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.1 trigger tracking V2 and urgent copy polish'
          git push origin v8.2.1-trigger-tracking
