name: Build V8.2.67 Legal Release Android

on:
  push:
    branches: [android-v8.2.67-legal-release]
    paths:
      - 'android-v8.2.67-legal-release.sh'
      - '.github/workflows/build-android-v8267-legal-release.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-v8.2.67-legal-release
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8
      - name: Apply V8.2.67 version-only patch
        run: bash android-v8.2.67-legal-release.sh
      - name: Verify preserved native stack
        run: |
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          MAN=android-v8/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.WAKE_LOCK' "$MAN"
          grep -q 'android.permission.SCHEDULE_EXACT_ALARM' "$MAN"
          grep -q 'android:name=".MindProVoiceService"' "$MAN"
          grep -q 'android:name=".MindProVoiceBridgeActivity"' "$MAN"
          grep -q 'android:scheme="oneul" android:host="mindpro-voice"' "$MAN"
          grep -q 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"
          grep -q 'speech_rate_tenths' "$PKG/MindProVoiceService.java"
          grep -q 'voice_name' "$PKG/MindProVoiceService.java"
          grep -q 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -q 'HabitReminderStore.count' "$PKG/NotificationSettingsActivity.java"
          grep -q '외래 알림 시간' "$PKG/NotificationSettingsActivity.java"
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"
      - name: Verify signing certificate
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: keytool -list -v -keystore "$GITHUB_WORKSPACE/android-v8/signing.keystore" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'
      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build release APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease
      - name: Verify APK version, permissions and preserved engines
        run: |
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          test -n "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "versionCode='887' versionName='8.2.67'"
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -F 'mindpro-voice'
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          grep -q 'HabitReminderScheduler.scheduleAll' "$PKG/BootReceiver.java"
          grep -q 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -q 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -q 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -q 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v8.2.67-legal-release-apk
          path: android-v8/app/build/outputs/apk/release/*.apk
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v8.2.67-legal-release-aab
          path: android-v8/app/build/outputs/bundle/release/*.aab
