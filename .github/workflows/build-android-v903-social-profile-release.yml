name: Build and publish V9.0.3 Android prerelease

on:
  push:
    branches: [android-v9.0.3-social-profile-release]
    paths:
      - 'android-v9.0.3-social-profile-release.sh'
      - '.github/workflows/build-android-v903-social-profile-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify exact web main sync
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "0b8a2af2b8cb3fcc32e3068e43fca46edadfc0a2"
          for f in README.md SOCIAL_SETUP.md icon-180.png icon-192.png icon-32.png icon-512.png index.html install.html learning-data.js legal.html manifest.json music-audio-data.js native.html privacy.html qa-data.js screening-data.js social-apps-script.gs sw.js test.js verify.js workbook-data.js; do
            git show FETCH_HEAD:"$f" > /tmp/main-file
            cmp -s "$f" /tmp/main-file || { echo "main sync mismatch: $f"; exit 1; }
          done
          echo 'web main 0b8a2af sync PASS'

      - name: Verify V9.0.3 web and social
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          node --check verify.js
          node --check test.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          grep -F "const BUILD='V9.0.3';" index.html
          grep -F "const APP_VERSION = 'V9.0.3';" sw.js
          grep -F "const V = 'ohg-v903-social-profile-r1';" sw.js
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          ! grep -F 'HALTS.find' index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.3-social-1';" social-apps-script.gs
          grep -F 'function profileActivity_' social-apps-script.gs
          grep -F 'function feedPublicSnapshot_' social-apps-script.gs
          grep -F "if(p === 'social-profile') drawSocialProfile();" index.html
          grep -F '닉네임은 가입 후 고정됩니다' index.html
          ! grep -F "w.onclick=()=>go('workbook-list');" index.html
          node verify.js

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.3 package revision
        run: bash android-v9.0.3-social-profile-release.sh

      - name: Verify preserved reminder and TTS engines
        run: |
          set -euo pipefail
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          ACT="$PKG/NotificationSettingsActivity.java"
          grep -F 'ReminderStore.importSchedule(this, "", "", "", "", val(u, "build"))' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, "")' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, "", "", TreatmentReminderStore.time(this), 0)' "$ACT"
          grep -F 'String visitAlerts = TreatmentReminderStore.alertsPacked(this)' "$ACT"
          grep -F 'String visitTime = TreatmentReminderStore.time(this)' "$ACT"
          grep -F 'ReminderStore.importSchedule(this, pendingRisk, pendingMeds, pendingEats, pendingBed, pendingBuild)' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, pendingHabits)' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, pendingVisit, visitAlerts, visitTime, pendingVisitInterval)' "$ACT"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify APK version permissions and package
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='898' versionName='9.0.3'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          cp "$APK" oneul-v9.0.3.apk
          cp "$AAB" oneul-v9.0.3.aab
          sha256sum oneul-v9.0.3.apk oneul-v9.0.3.aab | tee SHA256SUMS.txt

      - name: Upload release files artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.3-release-files
          path: |
            oneul-v9.0.3.apk
            oneul-v9.0.3.aab
            SHA256SUMS.txt

      - name: Publish V9.0.3 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v9.0.3-test --yes --cleanup-tag || true
          gh release create v9.0.3-test oneul-v9.0.3.apk oneul-v9.0.3.aab SHA256SUMS.txt \
            --target android-v9.0.3-social-profile-release \
            --title '오늘 한 걸음 V9.0.3 소셜 프로필 테스트 릴리즈' \
            --notes 'V9.0.3 테스트 릴리즈입니다. 내 소셜 프로필 별도 화면에서 내 게시물·댓글을 확인하고 수정·삭제할 수 있도록 했고, 내부 소셜 ID는 숨겼습니다. 가입 후 닉네임은 고정되며 변경하려면 소셜 탈퇴 후 새 프로필을 만들어야 합니다. 소셜 탈퇴는 별도 영역과 2차 확인으로 분리했습니다. 소셜 서버 소스는 V9.0.3-social-1이며 profileActivity API와 짧은 피드/응원/스키마 캐시를 추가해 조회 부담을 줄였습니다. 회복학습의 중복 12단계 점검 진입은 제거하고 회복도구→실천하기→12단계 점검으로 일원화했으며 사용설명서/FAQ를 함께 현행화했습니다. 개인 회복기록 DATA_SCHEMA=6 / ohg.v1, 소셜 로컬 키 ohg.social.v1은 유지합니다. Android는 기존 검증된 네이티브 알림/TTS 스택을 변경하지 않고 versionCode 898 / versionName 9.0.3만 적용하며 정확알림, 화면 OFF 알림, 부팅 후 재예약, 복약·외래·생활·습관 알림, silent reminder apply/clear, 마음프로 네이티브 음성, 이완 TTS 엔진을 빌드에서 정적 검증합니다. 웹 main SHA: 0b8a2af2b8cb3fcc32e3068e43fca46edadfc0a2. Google Apps Script 실제 V9.0.3-social-1 배포는 GitHub 릴리즈와 별도이며 실기기 최종 확인 전이므로 prerelease를 유지합니다.' \
            --prerelease
