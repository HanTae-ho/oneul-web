name: V8.2.9 SMART DEADS

on:
  push:
    branches: [v8.2.9-smart-deads]
    paths:
      - 'v829-smart-deads.py'
      - '.github/workflows/v829-smart-deads.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.9-smart-deads
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SMART DEADS patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('v829-smart-deads.py')
          s=p.read_text(encoding='utf-8')
          old="nav=\"p === 'smart-hov' || p === 'smart-cba' || p === 'smart-change-plan' || p === 'smart-three-questions'\""
          new="nav=\"p === 'smart-hov' || p === 'smart-cba'\""
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python v829-smart-deads.py
          git checkout -- v829-smart-deads.py
      - name: Verify product changes
        run: |
          grep -q "const BUILD = 'V8.2.9'" index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q 'id="p-smart-deads"' index.html
          grep -q 'function drawSmartDeads' index.html
          grep -q "type === 'smart-deads'" index.html
          grep -q "urgeUseCope('DEADS · '" index.html
          grep -q '가족이 상대의 충동을 감시하거나 통제하는 용도로 사용하지 않습니다' index.html
          grep -q '원자료의 Attack은 사람을 공격한다는 뜻이 아니라' index.html
          grep -q '"type": "smart-deads"' learning-data.js
          grep -q '"label": "DEADS 대처계획·실행하기"' learning-data.js
          grep -q "const APP_VERSION = 'V8.2.9'" sw.js
          grep -q "ohg-v829-smart-deads" sw.js
          node --check learning-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html learning-data.js sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.9 add SMART Recovery DEADS tool' || true
          git push
