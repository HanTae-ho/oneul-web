name: Apply V8.0.4 Native Bridge Fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/v804-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/v804_patch.py
      - name: Verify patch
        run: |
          grep -Fq "const BUILD = 'V8.0.4';" index.html
          grep -Fq "location.hash" index.html
          grep -Fq "const APP_VERSION = 'V8.0.4';" sw.js
          grep -Fq "const V = 'ohg-v804';" sw.js
          git diff --check
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Fix V8.0.4 Android native bridge detection"
          git push origin main
