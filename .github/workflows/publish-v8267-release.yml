name: Publish V8.2.67 test release

on:
  push:
    branches: [android-v8.2.67-legal-release]
    paths:
      - '.github/workflows/publish-v8267-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.67 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34291864103 -n oneul-v8.2.67-legal-release-apk -D dist-apk
          gh run download 34291864103 -n oneul-v8.2.67-legal-release-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.67.apk
          cp dist-aab/*.aab oneul-v8.2.67.aab
          test -s oneul-v8.2.67.apk
          test -s oneul-v8.2.67.aab
          sha256sum oneul-v8.2.67.apk oneul-v8.2.67.aab | tee SHA256SUMS.txt
      - name: Publish V8.2.67 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.67-test --yes --cleanup-tag || true
          gh release create v8.2.67-test oneul-v8.2.67.apk oneul-v8.2.67.aab SHA256SUMS.txt \
            --target android-v8.2.67-legal-release \
            --title '오늘 한 걸음 V8.2.67 저작권·출처·라이선스 통합 안내 테스트' \
            --notes '저작권·출처·라이선스 통합 안내 페이지를 추가하고, 중독 200문답 Q1~Q200의 개발자 직접 작성 원자료 기반임을 명시했습니다. 12단계·SMART Recovery·선별도구·문헌·음원·외부기관/링크·오픈소스 관련 안내를 한곳에 통합하고, 저작권 문의 admin@maumpro.com을 추가했습니다. 개인정보처리방침에는 Wikimedia Commons 외부 서비스 및 개인정보처리방침 링크를 보완했습니다. V8.2.67에서는 index BUILD, 서비스워커 APP_VERSION/cache key, privacy/legal 버전 표기를 일치시키고 legal.html을 오프라인 셸에 포함했습니다. DATA_SCHEMA=6, ohg.v1, 기존 회복기록 구조, 선별도구 문항·채점, 음원 재생 로직은 변경하지 않았습니다. Android는 검증된 V8.2.66 네이티브 스택을 그대로 사용하고 versionCode 887 / versionName 8.2.67만 적용했습니다. 정확알림·화면 OFF 알림·부팅 재예약·복약/외래/생활/습관 알림·마음프로 네이티브 음성·이완 TTS를 자동 검증했습니다. 웹 main SHA는 daa42495aab2f0deee966b03c041c8d45da3c8ed 입니다. 실기기 확인 전이므로 prerelease입니다.' \
            --prerelease
