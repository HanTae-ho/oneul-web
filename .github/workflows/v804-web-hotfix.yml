name: V8.0.4 Web Native Bridge Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v804-web-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch V8.0.4 native detection and service worker version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_build = "const BUILD = 'V8.0';"
          if s.count(old_build) != 1:
              raise SystemExit(f'Expected exactly one BUILD marker, found {s.count(old_build)}')
          s = s.replace(old_build, "const BUILD = 'V8.0.4';", 1)

          pattern = re.compile(r"function\s+nativeAndroidApp\(\)\s*\{\s*const\s+p\s*=\s*new\s+URLSearchParams\(location\.search\);\s*return\s+p\.get\('native'\)\s*===\s*'1';\s*\}", re.S)
          replacement = """function nativeAndroidApp(){
    const p=new URLSearchParams(location.search);
    if(p.get('native')==='1') return true;
    const h=new URLSearchParams((location.hash||'').replace(/^#/,''));
    return h.get('native')==='1';
  }"""
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Expected exactly one legacy nativeAndroidApp function, found {n}')
          p.write_text(s, encoding='utf-8')

          p = Path('sw.js')
          s = p.read_text(encoding='utf-8')
          old_ver = "const APP_VERSION = 'V8.0';"
          old_cache = "const V = 'ohg-v800';"
          if s.count(old_ver) != 1 or s.count(old_cache) != 1:
              raise SystemExit('Unexpected service-worker version markers')
          s = s.replace(old_ver, "const APP_VERSION = 'V8.0.4';", 1)
          s = s.replace(old_cache, "const V = 'ohg-v804';", 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify only intended runtime changes
        run: |
          grep -Fq "const BUILD = 'V8.0.4';" index.html
          grep -Fq "new URLSearchParams((location.hash||'').replace(/^#/,''))" index.html
          grep -Fq "const APP_VERSION = 'V8.0.4';" sw.js
          grep -Fq "const V = 'ohg-v804';" sw.js
          git diff --check
          CHANGED="$(git diff --name-only | sort)"
          test "$CHANGED" = $'index.html\nsw.js'
          git diff -- index.html sw.js
      - name: Commit V8.0.4 web bridge fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          git commit -m "Fix V8.0.4 Android native bridge detection"
          git push origin main
