name: V8.2.11 SMART Tools Runtime Fix

on:
  push:
    branches: [v8.2.11-smart-tools-hub]
    paths:
      - 'v8211-smart-tools-runtime-fix.py'
      - '.github/workflows/v8211-smart-tools-runtime-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.11-smart-tools-hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply runtime icon refresh fix
        run: python v8211-smart-tools-runtime-fix.py
      - name: Verify runtime fix
        run: |
          ! grep -q 'hydrateIcons(box);' index.html
          grep -q 'refreshIcons();' index.html
          grep -q 'function drawSmartTools' index.html
          grep -q "const BUILD = 'V8.2.11'" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Commit runtime fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V8.2.11 fix SMART hub icon refresh' || true
          git push
