name: Apply V9.0.2 version consistency fix

on:
  push:
    branches: [v9.0.2-version-consistency-fix]
    paths:
      - 'scripts/apply-v902-version-consistency.py'
      - '.github/workflows/apply-v902-version-consistency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply version consistency patch
        run: python scripts/apply-v902-version-consistency.py
      - name: Verify version markers and syntax
        run: |
          set -euo pipefail
          grep -E "const BUILD\s*=\s*'V9\.0\.2';" index.html
          grep -E "const APP_VERSION\s*=\s*'V9\.0\.2';" sw.js
          grep -E "const V\s*=\s*'ohg-v902[^']*';" sw.js
          grep -F "const EXPECTED_APP_VERSION = 'V9.0.2';" verify.js
          node --check verify.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
      - name: Run legacy verify suite for report
        run: |
          set +e
          node verify.js > /tmp/verify.txt 2>&1
          code=$?
          cat /tmp/verify.txt
          echo "VERIFY_EXIT=$code"
          exit 0
      - name: Commit product changes only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/apply-v902-version-consistency.py \
            .github/workflows/apply-v902-version-consistency.yml \
            .github/workflows/audit-verify-v902.yml
          git add verify.js .github/workflows/check-web-runtime.yml
          git diff --cached --stat
          git commit -m 'V9.0.2 판 표기·검증 기준 일치'
          git push
