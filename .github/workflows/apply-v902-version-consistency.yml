name: Apply V9.0.2 version consistency fix

on:
  push:
    branches: [v9.0.2-version-consistency-fix]
    paths:
      - 'scripts/apply-v902-version-consistency.py'
      - '.github/workflows/apply-v902-version-consistency.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verify repair
        run: python scripts/apply-v902-version-consistency.py
      - name: Verify version markers and syntax
        run: |
          set -euo pipefail
          grep -E "const BUILD\s*=\s*'V9\.0\.2';" index.html
          grep -E "const APP_VERSION\s*=\s*'V9\.0\.2';" sw.js
          grep -E "const V\s*=\s*'ohg-v902[^']*';" sw.js
          grep -F "const build=(index.match" verify.js
          grep -F "readIf=f=>fs.existsSync" verify.js
          node --check verify.js
          node --check test.js
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
      - name: Run repaired verify suite
        run: node verify.js
      - name: Commit verify repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add verify.js test.js
          git diff --cached --stat
          git commit -m 'V9.0.2 검증 기준·회귀테스트 현행화'
          git push
