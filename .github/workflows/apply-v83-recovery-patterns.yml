name: Apply V8.3 recovery pattern patch

on:
  push:
    branches: [feature-v8.3-recovery-patterns]
    paths:
      - '.github/workflows/apply-v83-recovery-patterns.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v8.3-recovery-patterns
      - name: Apply patch
        run: python3 .github/v83_patch.py
      - name: Verify V8.3 invariants and JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const BUILD='V8.3';" in s
          assert "const KEY = 'ohg.v1';" in s
          assert 'const DATA_SCHEMA = 6;' in s
          assert "{v:'stat',l:'통계 · 패턴'}" in s
          assert 'function recPattern(){' in s
          assert 'function recStatCore(){' in s
          assert '기록 통계' in s and '내 회복 패턴' in s
          assert '자가점검 점수는 이 계산에 섞지 않습니다' in s
          assert "const APP_VERSION = 'V8.3';" in sw
          assert "const V = 'ohg-v830-recovery-patterns';" in sw
          part=s.split('function recPattern(){',1)[1].split('function recStatCore(){',1)[0]
          assert 'fetch(' not in part and 'save()' not in part and 'localStorage' not in part
          scripts=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): scripts.append(m.group(2))
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('V8.3 static invariants PASS')
          PY
          node --check /tmp/inline.js
          git diff --check
      - name: Commit V8.3 files
        run: |
          rm -f .github/v83_patch.py .github/workflows/apply-v83-recovery-patterns.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js README.md privacy.html legal.html .github
          git diff --cached --check
          git commit -m 'V8.3 내 회복 패턴 분석 추가'
          git push origin HEAD:feature-v8.3-recovery-patterns
