name: V8.2.21 SMART Return Path

on:
  push:
    branches: [v8.2.21-smart-return-path]
    paths:
      - 'v8221-smart-return-path.py'
      - '.github/workflows/v8221-smart-return-path.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.21-smart-return-path
      - name: Apply return-path patch
        run: python v8221-smart-return-path.py
      - name: Verify route-aware back behavior
        run: |
          grep -q 'function appBack(fallback)' index.html
          grep -q 'if(navDepth()>0){ history.back(); return; }' index.html
          grep -q 'data-back-default="tools" data-back-label="회복도구"' index.html
          grep -q "'tools':'회복도구'" index.html
          grep -q "'learn-topic':'SMART Recovery'" index.html
          grep -q "let learnState = { topic:'', returnSection:'' };" index.html
          grep -q 'data-learn-section=' index.html
          grep -q 'learningAction(b.dataset.learnAct,b.dataset.learnSection)' index.html
          grep -q "if(sectionId && learnState.topic==='smart-recovery') learnState.returnSection=String(sectionId);" index.html
          grep -q "if(p === 'learn-topic') drawLearnTopic(!!opt.fromHistory);" index.html
          grep -q 'const returnId=fromHistory?String(learnState.returnSection' index.html
          grep -q 'setTimeout(()=>openLearnSection(topic,target),0)' index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          grep -q "const APP_VERSION = 'V8.2.21';" sw.js
          grep -q "ohg-v8221-smart-return-path" sw.js
          git diff --check
      - name: Verify all SMART tool back buttons and learning links
        run: |
          for id in smart-hov smart-cba smart-change-plan smart-three-questions smart-deads smart-disarm smart-abc smart-dibs smart-thinking-styles smart-problem-solving smart-balance-pie; do
            grep -q "id=\"p-$id\"" index.html
          done
          test "$(grep -o 'data-smart-back' index.html | wc -l)" -ge 12
          for type in smart-hov smart-three-questions smart-change-plan smart-cba smart-deads smart-disarm smart-abc smart-dibs smart-thinking-styles smart-problem-solving smart-balance-pie; do
            grep -q "if(type === '$type')" index.html
          done
          grep -q "if(type === 'urge-diary')" index.html
      - name: JavaScript syntax sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check learning-data.js
          node --check sw.js
      - name: Verify unchanged critical engines
        run: |
          grep -q 'notify-schedule' index.html
          grep -q 'treatment' index.html
          grep -q "kind:'problem-solving'" index.html
          grep -q "kind:'lifestyle-balance-pie'" index.html
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.21 restore exact SMART learning return path'
          git push
