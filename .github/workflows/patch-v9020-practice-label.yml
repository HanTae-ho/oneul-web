name: Patch V9.0.20 practice label

on:
  push:
    branches: [v9.0.20-restore-practice-label]
    paths:
      - '.github/workflows/patch-v9020-practice-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.20-restore-practice-label
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify V9.0.20
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          reps={
            "const BUILD='V9.0.19';":"const BUILD='V9.0.20';",
            '<span class="ic" data-ico="check"></span><b>필요한 도구</b>':'<span class="ic" data-ico="check"></span><b>회복 실천도구</b>',
            '<summary>필요한 도구는 어떻게 사용하나요?</summary>':'<summary>회복 실천도구는 어떻게 사용하나요?</summary>',
            '>필요한 도구 열기</button>':'>회복 실천도구 열기</button>',
            '12단계 점검, 필요한 도구, 충동일기':'12단계 점검, 회복 실천도구, 충동일기'
          }
          for a,b in reps.items():
            if a not in s:
              raise SystemExit('index target missing: '+a)
            s=s.replace(a,b)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const APP_VERSION = 'V9.0.19';","const APP_VERSION = 'V9.0.20';")
          s=s.replace("const V = 'ohg-v9019-compact-grid-r1';","const V = 'ohg-v9020-practice-label-r1';")
          p.write_text(s,encoding='utf-8')

          p=Path('latest-release.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          d.update({
            'version':'V9.0.20',
            'versionCode':915,
            'apk':'https://github.com/HanTae-ho/oneul-web/releases/download/v9.0.20-test/oneul-v9.0.20.apk',
            'release':'https://github.com/HanTae-ho/oneul-web/releases/tag/v9.0.20-test'
          })
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          p=Path('verify.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("/<b>의미점검 보기<\\/b>/.test(practiceSection)&&/<b>필요한 도구<\\/b>/.test(practiceSection)","/<b>의미점검 보기<\\/b>/.test(practiceSection)&&/<b>회복 실천도구<\\/b>/.test(practiceSection)")
          s=s.replace("const BUILD='V9.0.19';","const BUILD='V9.0.20';")
          s=s.replace("V9.0.19 BUILD 불일치","V9.0.20 BUILD 불일치")
          p.write_text(s,encoding='utf-8')
          PY

          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks.append(Path('meaning-feature.js').read_text(encoding='utf-8'))
          blocks.append(Path('meaning-check-feature.js').read_text(encoding='utf-8'))
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          sec=(s.split('<h2>실천하기</h2>',1)[1].split('<div class="toolsec">',1)[0])
          assert '<b>회복 실천도구</b>' in sec
          assert '<b>필요한 도구</b>' not in sec
          assert '<summary>회복 실천도구는 어떻게 사용하나요?</summary>' in s
          assert '회복 실천도구 열기' in s
          assert '12단계 점검, 회복 실천도구, 충동일기' in s
          assert '.learnmini .minitool{min-height:100px' in s
          assert "const DATA_SCHEMA = 6;" in s
          assert "const KEY = 'ohg.v1';" in s
          assert "const SOCIAL_KEY = 'ohg.social.v1';" in s
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          node --check meaning-feature.js
          node --check meaning-check-feature.js
          node --check verify-meaning.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
          node verify-meaning.js
          EXPECTED_APP_VERSION=V9.0.20 node release-version-check.js
          grep -F "verifiedVersion:'V9.0.15'" install.html
          git diff --check
      - name: Commit final patch and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/patch-v9020-practice-label.yml
          git add -A
          git commit -m 'V9.0.20 restore recovery practice tools label'
          git push origin HEAD:v9.0.20-restore-practice-label
