name: V9.0.2 temporary browser regression

on:
  push:
    branches: [v9.0.2-version-consistency-fix]
    paths:
      - '.github/workflows/browser-regression-v902-temp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Browser regression
        run: node test.js
