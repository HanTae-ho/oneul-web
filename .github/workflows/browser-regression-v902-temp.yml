name: V9.0.2 temporary browser regression

on:
  push:
    branches: [v9.0.2-version-consistency-fix]
    paths:
      - '.github/workflows/browser-regression-v902-temp.yml'
      - 'scripts/patch-test-kst.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply current regression-test repairs
        run: python scripts/patch-test-kst.py
      - name: Install Playwright package
        run: npm install --no-save playwright@1.55.0
      - name: Browser regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          test -x "$CHROMIUM_PATH"
          node test.js
