name: Publish V8.2.49 test release

on:
  push:
    branches: [android-v8.2.49-mindpro-guide-voice]
    paths:
      - '.github/workflows/publish-v8249-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.49 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34168509876 -n oneul-v8.2.49-mindpro-guide-voice-apk -D dist-apk
          gh run download 34168509876 -n oneul-v8.2.49-mindpro-guide-voice-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.49.apk
          cp dist-aab/*.aab oneul-v8.2.49.aab
          test -s oneul-v8.2.49.apk
          test -s oneul-v8.2.49.aab
          sha256sum oneul-v8.2.49.apk oneul-v8.2.49.aab
      - name: Publish V8.2.49 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.49-test --yes --cleanup-tag || true
          gh release create v8.2.49-test oneul-v8.2.49.apk oneul-v8.2.49.aab \
            --target android-v8.2.49-mindpro-guide-voice \
            --title '오늘 한 걸음 V8.2.49 마음프로 안내·앱지식·음성 테스트' \
            --notes 'V8.2.48 정상본을 기준으로 마음프로를 정리했습니다. 별도의 확인하고 시작 화면 없이 바로 대화하고, 안전·개인정보 안내는 처음 잠깐 펼쳐졌다 자동으로 접히며 다시 열 수 있습니다. 12단계·SMART Recovery와 복약·외래 알림·일정·습관·자가점검 등 앱 기능 질문은 앱 내부 내용을 먼저 사용하고 실제 화면으로 연결합니다. Android 앱에서는 마음프로 새 답변 자동 읽기 기본설정을 사용할 수 있고, 현재 대화에서 계속 읽어줘/그만 읽어 명령으로 설정과 별개로 제어합니다. 일반 웹/PWA에는 음성 기능을 추가하지 않았습니다. 개인 회복기록 자동전송 금지, DATA_SCHEMA=6, ohg.v1을 유지합니다. Android 네이티브 코드는 V8.2.48 검증 스택을 그대로 사용하고 versionCode 869 / versionName 8.2.49만 적용했으며 정확알림·화면 OFF 알림·부팅 재예약·외래 반복예약·기존 이완 TTS를 보존했습니다.' \
            --prerelease
