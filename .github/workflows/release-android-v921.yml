name: Release Android V9.2.1

# V9.2.1 정식 릴리스는 전용 one-shot marker가 main에 추가될 때 한 번 실행합니다.
# 이후 일반 소스 수정이나 workflow 수정만으로는 자동 재실행되지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - '.release/v9.2.1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-v9.2.1
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V9.2.1 web release metadata
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          node release-version-check.js
          grep -F "const BUILD='V9.2.1';" index.html
          grep -F "const APP_VERSION = 'V9.2.1';" sw.js
          grep -F "const V = 'ohg-v921-help-lines-r1';" sw.js
          grep -F '"version": "V9.2.1"' latest-release.json
          grep -F '"versionCode": 922' latest-release.json
          grep -F 'releases/download/v9.2.1/oneul-v9.2.1.apk' latest-release.json
          grep -F "verifiedVersion:'V9.2.1'" install.html
          grep -F '헬프콜에는 어떤 전화가 보이나요?' index.html
          grep -F "const wantedPhones=['15770199','129'];" index.html
          grep -F "selectedTypes.includes('gambling')" index.html
          grep -F "selectedTypes.includes('drug')" index.html
          node verify.js
          node verify-meaning.js
          echo "RELEASE_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin refs/tags/v9.2.1 >/dev/null 2>&1; then
            echo 'v9.2.1 tag already exists; refusing duplicate release' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install pinned Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore pinned proven Android source tree
        env:
          ARCHIVE_SHA: c79a2957e47818550444abeb83e1fafafd9bd572
        run: |
          set -euo pipefail
          git fetch origin "$ARCHIVE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ARCHIVE_SHA"
          test "$(git rev-parse "$ARCHIVE_SHA:android-v8-source.zip")" = "627c56a3a557cc2fc1be2e3d00b693b7e0aa99ab"
          test "$(git rev-parse "$ARCHIVE_SHA:android-v9.0.20-restore-practice-label-release.sh")" = "d611514a0c4bf784c64a3155fa81a925621ccc33"
          git checkout --detach "$ARCHIVE_SHA"
          chmod +x android-v*.sh
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8
          bash android-v9.0.20-restore-practice-label-release.sh

      - name: Advance Android metadata only to V9.2.1
        run: |
          set -euo pipefail
          GRADLE=android-v8/app/build.gradle
          sed -i "s/versionCode 915/versionCode 922/; s/versionName '9.0.20'/versionName '9.2.1'/" "$GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-v8/app/src/main')
          old='https://hantae-ho.github.io/oneul-web/native.html?appv=9.0.20'
          new='https://hantae-ho.github.io/oneul-web/native.html?appv=9.2.1'
          changed=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.java','.xml'}:
                  continue
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('V9.0.20 appv marker not found')
          print('updated appv marker:', *changed, sep='\n')
          PY
          grep -F "versionCode 922" "$GRADLE"
          grep -F "versionName '9.2.1'" "$GRADLE"
          grep -R -F 'native.html?appv=9.2.1' android-v8/app/src/main

      - name: Restore existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"
          test -s "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create release signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed V9.2.1 APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify package, permissions and preserved native engines
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"; test -s "$AAB"
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"
          echo "BUILT_AAB=$AAB" >> "$GITHUB_ENV"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='922' versionName='9.2.1'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          grep -F 'handleSilentSync(getIntent())' "$PKG/NotificationSettingsActivity.java"
          grep -F '"1".equals(val(u, "clear"))' "$PKG/NotificationSettingsActivity.java"
          grep -F '"1".equals(val(u, "apply"))' "$PKG/NotificationSettingsActivity.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Verify signer continuity with V9.2.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download v9.2.0 --pattern 'oneul-v9.2.0.apk' --dir published
          echo 'aa2103bdc75e1ce273d5e27a014109cabb6d80d537ff6dae6429e36030791f13  published/oneul-v9.2.0.apk' | sha256sum -c -
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT_APK" | tee /tmp/new-certs.txt
          "$APKSIGNER" verify --print-certs published/oneul-v9.2.0.apk | tee /tmp/old-certs.txt
          grep 'Signer #1 certificate SHA-256 digest:' /tmp/new-certs.txt | sed 's/.*digest: //' > /tmp/new.sha
          grep 'Signer #1 certificate SHA-256 digest:' /tmp/old-certs.txt | sed 's/.*digest: //' > /tmp/old.sha
          diff -u /tmp/old.sha /tmp/new.sha
          jarsigner -verify "$BUILT_AAB"
          echo 'V9.2.1 signer continuity PASS'

      - name: Prepare release assets and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$BUILT_APK" dist/oneul-v9.2.1.apk
          cp "$BUILT_AAB" dist/oneul-v9.2.1.aab
          (cd dist && sha256sum oneul-v9.2.1.apk oneul-v9.2.1.aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.2.1-verified
          path: dist/*
          if-no-files-found: error

      - name: Publish V9.2.1 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 오늘 한 걸음 V9.2.1
          - 헬프 상단의 응급 신고 119·자살예방 상담전화 109는 설명문 없이 번호와 전화 버튼만 표시합니다.
          - 헬프콜은 기본으로 정신건강 상담전화 1577-0199·보건복지상담센터 129를 표시하고, 도박 영역에는 1336, 약물 영역에는 1342를 추가합니다.
          - 여러 회복영역을 선택하면 해당 상담전화를 중복 없이 함께 표시합니다.
          - 내 주변에서 찾기의 중복 설명문을 제거하고 앱 내 사용설명서·FAQ도 같은 규칙으로 현행화했습니다.
          - JavaScript syntax, no-undef, 앱 셸, 버전 일관성, 전체 불변식, Playwright 브라우저 회귀검증을 통과한 소스에서 빌드합니다.
          - DATA_SCHEMA=6, ohg.v1, ohg.social.v1, package io.github.hantae_ho.twa는 유지합니다.
          - Android exact alarm·화면 OFF 알림·부팅 재등록·치료관리 알림·Relax TTS·MindPro Voice TTS 엔진은 기존 계보를 그대로 유지합니다.
          - Android: versionCode 922 / versionName 9.2.1
          EOF
          gh release create v9.2.1 dist/oneul-v9.2.1.apk dist/oneul-v9.2.1.aab dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SOURCE_SHA" \
            --title '오늘 한 걸음 V9.2.1' --notes-file /tmp/release-notes.md --latest

      - name: Verify published V9.2.1 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v9.2.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url
          mkdir -p released
          gh release download v9.2.1 --repo "$GITHUB_REPOSITORY" --pattern 'oneul-v9.2.1.apk' --dir released
          sha256sum dist/oneul-v9.2.1.apk released/oneul-v9.2.1.apk
          test "$(sha256sum dist/oneul-v9.2.1.apk | awk '{print $1}')" = "$(sha256sum released/oneul-v9.2.1.apk | awk '{print $1}')"
          echo 'ANDROID_V9_2_0_RELEASE_PASS'
