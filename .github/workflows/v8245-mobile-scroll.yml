name: Apply V8.2.45 mobile scroll UX

on:
  push:
    branches:
      - v8.2.45-mobile-scroll

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.45-mobile-scroll
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/v8245_patch.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "const BUILD = 'V8.2.45';" index.html
          grep -F "const APP_VERSION = 'V8.2.45';" sw.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "data-ls-tag" index.html
          grep -F "details.ws-sec" index.html
          grep -F "data-vaci-view-item" index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check sw.js

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v8245-mobile-scroll.yml tools/v8245_patch.py
          git add index.html sw.js README.md
          git diff --cached --check
          git commit -m "V8.2.45 reduce mobile scroll pressure [skip ci]"
          git push origin HEAD:v8.2.45-mobile-scroll
