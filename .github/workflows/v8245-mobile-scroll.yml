name: Apply V8.2.45 mobile scroll UX

on:
  push:
    branches: [v8.2.45-mobile-scroll]
    paths: [.github/workflows/v8245-mobile-scroll.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.45-mobile-scroll
          fetch-depth: 0

      - name: Apply minimal UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          assert "const BUILD = 'V8.2.44';" in s
          assert "const DATA_SCHEMA = 6;" in s
          assert "const KEY = 'ohg.v1';" in s
          s = s.replace("const BUILD = 'V8.2.44';", "const BUILD = 'V8.2.45';", 1)

          # 1) 12단계 검토: sibling details are single-open and newly opened section is brought near top.
          anchor = "  box.innerHTML=h;\n  $$('#wb-body textarea[data-ws-sec]').forEach(inp=>{"
          assert s.count(anchor) == 1, s.count(anchor)
          ws_bind = """  box.innerHTML=h;
  /* V8.2.45 · 모바일에서는 긴 검토 묶음을 한 번에 하나만 펼칩니다.
     details를 닫아도 DOM/초안 데이터는 그대로이므로 작성 내용은 사라지지 않습니다. */
  box.querySelectorAll('details.ws-sec').forEach(sec=>{
    sec.addEventListener('toggle',()=>{
      if(!sec.open) return;
      box.querySelectorAll('details.ws-sec').forEach(other=>{ if(other!==sec && other.open) other.open=false; });
      setTimeout(()=>{
        const v=$('#view'); if(!v) return;
        v.scrollTo({top:Math.max(0,v.scrollTop+sec.getBoundingClientRect().top-66),behavior:'smooth'});
      },30);
    });
  });
  $$('#wb-body textarea[data-ws-sec]').forEach(inp=>{"""
          s = s.replace(anchor, ws_bind, 1)

          # 2) 듣는 글: 30편 전체 나열 대신 범주 칩 하나만 펼칩니다.
          assert "let ls = { i: -1, back: 'panic' };" in s
          s = s.replace("let ls = { i: -1, back: 'panic' };", "let ls = { i: -1, back: 'panic', tag: '' };", 1)
          open_anchor = "  ls.i = -1;                       /* 목록부터 */\n  go('listen');"
          assert s.count(open_anchor) == 1
          s = s.replace(open_anchor, "  ls.i = -1;                       /* 목록부터 */\n  ls.tag = '';                      /* 범주도 닫힌 상태에서 시작 */\n  go('listen');", 1)

          m = re.search(r"function drawListen\(\)\{.*?\n\}\n\n\$\('#ls-next'\)", s, re.S)
          assert m, 'drawListen block not found'
          block = m.group(0)
          list_pat = re.compile(r"  if\(!one\)\{.*?\n    return;\n  \}\n\n  if\(ls\.i < 0\)", re.S)
          assert len(list_pat.findall(block)) == 1, len(list_pat.findall(block))
          list_new = """  if(!one){
    /* V8.2.45 · 범주 칩은 단일 아코디언처럼 동작합니다.
       다른 범주를 누르면 이전 목록은 사라지고 새 범주의 글만 보입니다. */
    let h = '<p class=\"muted\" style=\"margin:-4px 0 12px\">' +
      '지금 상태에 가까운 범주를 고르세요. 한 번에 한 범주의 글만 보여드립니다.</p>';
    h += '<div class=\"opts\" id=\"ls-tags\" style=\"margin-bottom:12px\">' +
      LTAG.map(t=>'<button class=\"opt'+(ls.tag===t.k?' on':'')+'\" data-ls-tag=\"'+esc(t.k)+'\" aria-pressed=\"'+(ls.tag===t.k?'true':'false')+'\">'+esc(t.l)+'</button>').join('') + '</div>';
    if(ls.tag){
      const tag=LTAG.find(t=>t.k===ls.tag);
      const list=LISTEN.filter(x=>x.g===ls.tag);
      h += '<div class=\"sp\" style=\"margin:2px 1px 9px\"><b>' + esc(tag?tag.l:'듣는 글') + '</b><span class=\"tiny\">' + list.length + '편</span></div>';
      list.forEach(x=>{
        h += '<button class=\"help\" style=\"width:100%;text-align:left\" data-ls=\"' + x.n + '\">' +
          '<span class=\"b\"><b>' + esc(x.t) + '</b></span>' +
          '<span class=\"acts\"><span class=\"go\">읽기</span></span></button>';
      });
    }else{
      h += '<div class=\"empty\">범주를 누르면 해당 듣는 글만 보입니다.</div>';
    }
    $('#ls-list').innerHTML=h;
    $('#ls-list').querySelectorAll('[data-ls-tag]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.lsTag||'';
      ls.tag=ls.tag===k?'':k;
      drawListen();
    });
    $('#ls-list').querySelectorAll('[data-ls]').forEach(b=>b.onclick=()=>{
      ls.i=LISTEN.findIndex(x=>x.n===+b.dataset.ls);
      drawListen(); rdTop();
    });
    return;
  }

  if(ls.i < 0)"""
          block = list_pat.sub(list_new, block, count=1)

          nav_old = """  $('#ls-pos').textContent = (ls.i + 1) + ' / ' + LISTEN.length;
  $('#ls-prev').disabled = ls.i === 0;
  $('#ls-next').disabled = ls.i >= LISTEN.length - 1;
  $('#ls-next').textContent = ls.i >= LISTEN.length - 1 ? '마지막 글입니다' : '다음 글 →';"""
          assert block.count(nav_old) == 1
          nav_new = """  const scope=LISTEN.map((x,i)=>({x,i})).filter(v=>!ls.tag||v.x.g===ls.tag).map(v=>v.i);
  const pos=scope.indexOf(ls.i);
  $('#ls-pos').textContent = (pos >= 0 ? pos + 1 : 1) + ' / ' + scope.length;
  $('#ls-prev').disabled = pos <= 0;
  $('#ls-next').disabled = pos < 0 || pos >= scope.length - 1;
  $('#ls-next').textContent = pos < 0 || pos >= scope.length - 1 ? '마지막 글입니다' : '다음 글 →';"""
          block = block.replace(nav_old, nav_new, 1)
          s = s[:m.start()] + block + s[m.end():]

          handlers_old = """$('#ls-next').onclick    = () => { ls.i++; drawListen(); rdTop(); };
$('#ls-prev').onclick    = () => { ls.i--; drawListen(); rdTop(); };
$('#ls-tolist').onclick  = () => { ls.i = -1; drawListen(); rdTop(); };
$('#ls-back').onclick    = () => { if(ls.i >= 0){ ls.i = -1; drawListen(); rdTop(); } else appBack(ls.back); };"""
          assert s.count(handlers_old) == 1
          handlers_new = """function listenMove(delta){
  const scope=LISTEN.map((x,i)=>({x,i})).filter(v=>!ls.tag||v.x.g===ls.tag).map(v=>v.i);
  const pos=scope.indexOf(ls.i), next=pos+delta;
  if(pos<0 || next<0 || next>=scope.length) return;
  ls.i=scope[next]; drawListen(); rdTop();
}
$('#ls-next').onclick    = () => listenMove(1);
$('#ls-prev').onclick    = () => listenMove(-1);
$('#ls-tolist').onclick  = () => { ls.i = -1; drawListen(); rdTop(); };
$('#ls-back').onclick    = () => { if(ls.i >= 0){ ls.i = -1; drawListen(); rdTop(); } else appBack(ls.back); };"""
          s = s.replace(handlers_old, handlers_new, 1)

          # 3) VACI 저장기록의 여러 관심사도 동시에 펼쳐지지 않게 합니다.
          vm = re.search(r"function openSmartVaciView\(id\)\{.*?\n\}\n\n/\* ══════════ SMART Recovery · SMART 목표 설정", s, re.S)
          assert vm, 'VACI view block not found'
          vb = vm.group(0)
          assert vb.count("<details class=\"card tight\">") >= 1
          vb = vb.replace("<details class=\"card tight\">", "<details class=\"card tight\" data-vaci-view-item>")
          vaci_anchor = " $('#vaci-edit').onclick=()=>openSmartVaciEditor(r);"
          assert vb.count(vaci_anchor) == 1
          vaci_bind = """ $$('[data-vaci-view-item]').forEach(d=>d.ontoggle=()=>{
   if(!d.open)return;
   $$('[data-vaci-view-item]').forEach(other=>{if(other!==d&&other.open)other.open=false;});
   setTimeout(()=>{const v=$('#view');if(v)v.scrollTo({top:Math.max(0,v.scrollTop+d.getBoundingClientRect().top-66),behavior:'smooth'});},30);
 });
 $('#vaci-edit').onclick=()=>openSmartVaciEditor(r);"""
          vb = vb.replace(vaci_anchor, vaci_bind, 1)
          s = s[:vm.start()] + vb + s[vm.end():]

          p.write_text(s,encoding='utf-8')

          sw = Path('sw.js')
          t = sw.read_text(encoding='utf-8')
          assert "const APP_VERSION = 'V8.2.44';" in t
          assert "const V = 'ohg-v8244-native-notify-direct';" in t
          t=t.replace("const APP_VERSION = 'V8.2.44';","const APP_VERSION = 'V8.2.45';",1)
          t=t.replace("const V = 'ohg-v8244-native-notify-direct';","const V = 'ohg-v8245-mobile-scroll';",1)
          sw.write_text(t,encoding='utf-8')

          readme=Path('README.md')
          r=readme.read_text(encoding='utf-8')
          head="""# V8.2.45 — 모바일 스크롤 압박 정리

- `12단계 점검`의 세부 검토 묶음은 한 번에 하나만 펼칩니다. 다른 묶음을 열면 이전 묶음은 자동으로 닫히며, 작성 중인 초안은 그대로 유지됩니다.
- `듣는 글` 30편은 `충동 / 무너진 뒤 / 가라앉을 때 / 사람 / 막막할 때 / 몸 / 괜찮을 때` 범주 칩으로 나누고 한 범주만 표시합니다. 글 안의 이전·다음 이동도 선택한 범주 안에서 동작합니다.
- VACI 저장기록의 관심사 상세도 여러 개를 동시에 펼치지 않도록 단일 아코디언으로 맞췄습니다.
- SMART Point, SMART 목표, 문제해결, 삶의 균형, 이완, 가족도구처럼 이미 단일 아코디언인 화면은 변경하지 않았습니다. 비교·동시입력이 필요한 화면도 그대로 둡니다.
- `DATA_SCHEMA=6`, `ohg.v1`, 기존 기록 저장형식, Android 정확알림·화면 OFF·부팅 재예약·이완 TTS는 변경하지 않습니다.

"""
          assert not r.startswith('# V8.2.45')
          readme.write_text(head+r,encoding='utf-8')
          PY

      - name: Validate only changed surface
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F "const BUILD = 'V8.2.45';" index.html
          grep -F "const APP_VERSION = 'V8.2.45';" sw.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "data-ls-tag" index.html
          grep -F "details.ws-sec" index.html
          grep -F "data-vaci-view-item" index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(parts),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check sw.js

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v8245-mobile-scroll.yml
          git add index.html sw.js README.md
          git diff --cached --check
          git commit -m "V8.2.45 reduce mobile scroll pressure [skip ci]"
          git push origin HEAD:v8.2.45-mobile-scroll
