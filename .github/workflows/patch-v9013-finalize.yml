name: Finalize V9.0.13 meaning urge review

on:
  push:
    branches: [v9.0.13-meaning-urge-entry]
    paths:
      - '.github/workflows/patch-v9013-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.13-meaning-urge-entry
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Finalize version references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="const BUILD='V9.0.12';"; new="const BUILD='V9.0.13';"
          if s.count(old)!=1: raise SystemExit(f'index BUILD anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          p=Path('verify.js'); s=p.read_text(encoding='utf-8')
          old="if(!index.includes(\"const BUILD='V9.0.12';\")) throw new Error('V9.0.11 BUILD 불일치');"
          new="if(!index.includes(\"const BUILD='V9.0.13';\")) throw new Error('V9.0.13 BUILD 불일치');"
          if s.count(old)!=1: raise SystemExit(f'verify BUILD anchor count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate V9.0.13
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks.append(Path('meaning-feature.js').read_text(encoding='utf-8'))
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social-apps-script.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check meaning-data.js
          node --check meaning-feature.js
          node --check verify-meaning.js
          node --check verify.js
          node --check sw.js
          node --check /tmp/social-apps-script.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
          node verify-meaning.js
          EXPECTED_APP_VERSION=V9.0.13 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';" social-apps-script.gs
          grep -F "verifiedVersion:'V9.0.7'" install.html
          grep -F "function wbTodayUrges(d)" meaning-feature.js
          grep -F "function drawMeaningHistorySummary()" meaning-feature.js
          grep -F "기존 기록 수정하기" meaning-feature.js
          grep -F "처음부터 다시 작성" meaning-feature.js
          git diff --check
      - name: Commit finalized version files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html verify.js
          git commit -m 'Finalize V9.0.13 version references'
          git push origin HEAD:v9.0.13-meaning-urge-entry
