name: Publish V8.2.60 test release

on:
  push:
    branches: [android-v8.2.60-mindpro-ai-consent]
    paths:
      - '.github/workflows/publish-v8260-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.60 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34207213471 -n oneul-v8.2.60-mindpro-consent-apk -D dist-apk
          gh run download 34207213471 -n oneul-v8.2.60-mindpro-consent-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.60.apk
          cp dist-aab/*.aab oneul-v8.2.60.aab
          test -s oneul-v8.2.60.apk
          test -s oneul-v8.2.60.aab
          sha256sum oneul-v8.2.60.apk oneul-v8.2.60.aab
      - name: Publish V8.2.60 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.60-test --yes --cleanup-tag || true
          gh release create v8.2.60-test oneul-v8.2.60.apk oneul-v8.2.60.aab \
            --target android-v8.2.60-mindpro-ai-consent \
            --title '오늘 한 걸음 V8.2.60 마음프로 AI 전송 동의 테스트' \
            --notes '마음프로의 타이머·도움글·모임·센터·병원·헬프콜·앱 안내 등 로컬 기능은 기존처럼 기기에서 먼저 처리합니다. 일반 AI 대화를 외부 서버로 보내기 직전에만 현재 메시지, 최근 일반 AI 대화 최대 8개, 익명형 식별값, 대화 주제와 앱 버전이 Google Apps Script를 거쳐 OpenAI API로 전송되고 글로벌 인프라에서 국외 처리될 수 있음을 안내한 뒤 명시적 동의를 받습니다. 내 발자취·자가점검·12단계·회복 실천도구·복약 등 저장된 회복기록은 자동 첨부되지 않습니다. 마음프로 안내에서 동의 상태를 확인하고 동의를 철회할 수 있으며, 철회 후 다음 일반 AI 전송 시 다시 동의를 요청합니다. DATA_SCHEMA=6, ohg.v1, 기존 회복기록 구조는 변경하지 않았습니다. Android는 V8.2.59에서 검증한 정확알림·화면 OFF 알림·부팅 재예약·복약/외래/생활/습관 알림·마음프로 네이티브 TTS·이완 TTS 스택을 그대로 사용하고 versionCode 880 / versionName 8.2.60만 적용했습니다. 웹 main SHA는 2cd106d15d5de11112e371c58abd26d6bb1d89f4 입니다.' \
            --prerelease
