name: Release Android V9.2.3

# V9.2.3 정식 릴리스는 전용 one-shot marker가 main에 추가될 때 한 번 실행합니다.
# 이후 일반 소스 수정이나 workflow 수정만으로는 자동 재실행되지 않습니다.
on:
  push:
    branches: [main]
    paths:
      - '.release/v9.2.3'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-v9.2.3
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V9.2.3 web release metadata
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          node release-version-check.js
          grep -F "const BUILD='V9.2.3';" index.html
          grep -F "const APP_VERSION = 'V9.2.3';" sw.js
          grep -F "const V = 'ohg-v923-family-meaning-r1';" sw.js
          grep -F '"version": "V9.2.3"' latest-release.json
          grep -F '"versionCode": 924' latest-release.json
          grep -F 'releases/download/v9.2.3/oneul-v9.2.3.apk' latest-release.json
          grep -F "verifiedVersion:'V9.2.3'" install.html
          grep -F 'familyWbDays: {}' index.html
          grep -F 'familyMeaningChecks: [], familyMeaningCheckDraft: null' index.html
          grep -F '오늘 내 마음, 경계, 자기돌봄' meaning-feature.js
          grep -F '가족의 변화 여부가 아니라' meaning-check-feature.js
          grep -F '당사자와 가족·보호자는 같은 화면을 사용하지만' index.html
          node verify.js
          node verify-meaning.js
          echo "RELEASE_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin refs/tags/v9.2.3 >/dev/null 2>&1; then
            echo 'v9.2.3 tag already exists; refusing duplicate release' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install pinned Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore pinned proven Android source tree
        env:
          ARCHIVE_SHA: c79a2957e47818550444abeb83e1fafafd9bd572
        run: |
          set -euo pipefail
          git fetch origin "$ARCHIVE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ARCHIVE_SHA"
          test "$(git rev-parse "$ARCHIVE_SHA:android-v8-source.zip")" = "627c56a3a557cc2fc1be2e3d00b693b7e0aa99ab"
          test "$(git rev-parse "$ARCHIVE_SHA:android-v9.0.20-restore-practice-label-release.sh")" = "d611514a0c4bf784c64a3155fa81a925621ccc33"
          git checkout --detach "$ARCHIVE_SHA"
          chmod +x android-v*.sh
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8
          bash android-v9.0.20-restore-practice-label-release.sh

      - name: Advance Android metadata only to V9.2.3
        run: |
          set -euo pipefail
          GRADLE=android-v8/app/build.gradle
          sed -i "s/versionCode 915/versionCode 924/; s/versionName '9.0.20'/versionName '9.2.3'/" "$GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-v8/app/src/main')
          old='https://hantae-ho.github.io/oneul-web/native.html?appv=9.0.20'
          new='https://hantae-ho.github.io/oneul-web/native.html?appv=9.2.3'
          changed=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.java','.xml'}:
                  continue
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('V9.0.20 appv marker not found')
          print('updated appv marker:', *changed, sep='\n')
          PY
          grep -F "versionCode 924" "$GRADLE"
          grep -F "versionName '9.2.3'" "$GRADLE"
          grep -R -F 'native.html?appv=9.2.3' android-v8/app/src/main

      - name: Restore existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"
          test -s "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create release signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed V9.2.3 APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify package, permissions and preserved native engines
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"; test -s "$AAB"
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"
          echo "BUILT_AAB=$AAB" >> "$GITHUB_ENV"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='924' versionName='9.2.3'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          grep -F 'handleSilentSync(getIntent())' "$PKG/NotificationSettingsActivity.java"
          grep -F '"1".equals(val(u, "clear"))' "$PKG/NotificationSettingsActivity.java"
          grep -F '"1".equals(val(u, "apply"))' "$PKG/NotificationSettingsActivity.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Verify signer continuity with V9.2.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download v9.2.2 --pattern 'oneul-v9.2.2.apk' --dir published
          echo '5e60a4cb18f017911388999adac9a124aaec4840bcb65f5baa44c45d54bfadf8  published/oneul-v9.2.2.apk' | sha256sum -c -
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT_APK" | tee /tmp/new-certs.txt
          "$APKSIGNER" verify --print-certs published/oneul-v9.2.2.apk | tee /tmp/old-certs.txt
          grep 'Signer #1 certificate SHA-256 digest:' /tmp/new-certs.txt | sed 's/.*digest: //' > /tmp/new.sha
          grep 'Signer #1 certificate SHA-256 digest:' /tmp/old-certs.txt | sed 's/.*digest: //' > /tmp/old.sha
          diff -u /tmp/old.sha /tmp/new.sha
          jarsigner -verify "$BUILT_AAB"
          echo 'V9.2.3 signer continuity PASS'

      - name: Prepare release assets and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$BUILT_APK" dist/oneul-v9.2.3.apk
          cp "$BUILT_AAB" dist/oneul-v9.2.3.aab
          (cd dist && sha256sum oneul-v9.2.3.apk oneul-v9.2.3.aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.2.3-verified
          path: dist/*
          if-no-files-found: error

      - name: Publish V9.2.3 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 오늘 한 걸음 V9.2.3
          - 가족·보호자 모드에서도 당사자와 같은 의미 돌아보기·지난 기록·의미점검 UI 틀을 사용할 수 있습니다.
          - 가족용 문항은 상대의 중독상태를 대신 평가하지 않고 내 마음·경계·자기돌봄·생활과 삶의 방향을 돌아보도록 별도로 구성했습니다.
          - 당사자 의미기록과 가족 의미기록은 별도 로컬 저장소에 저장하며 역할을 바꿔도 서로 섞이지 않습니다.
          - 가족 의미 돌아보기에는 당사자의 충동기록을 참고자료로 노출하지 않고 가족용 선택문항·오늘의 문장을 사용합니다.
          - 내 발자취의 의미 필터는 현재 역할의 의미 돌아보기·의미점검 완료기록만 표시합니다.
          - 기존 당사자 기록 구조와 의미점검 계산은 유지하고 구버전 데이터에는 가족용 빈 저장소만 안전 초기화합니다.
          - V9.2.1은 실제 Android 기기 검증 완료 기준본으로 유지하며 V9.2.3 실기기 확인은 릴리스 후 별도로 진행합니다.
          - JavaScript syntax, no-undef, 앱 셸, 버전 일관성, 전체 불변식, Playwright 브라우저 회귀검증을 통과한 소스에서 빌드합니다.
          - DATA_SCHEMA=6, ohg.v1, ohg.social.v1, package io.github.hantae_ho.twa는 유지합니다.
          - Android exact alarm·화면 OFF 알림·부팅 재등록·치료관리 알림·Relax TTS·MindPro Voice TTS 엔진은 기존 계보를 그대로 유지합니다.
          - Android: versionCode 924 / versionName 9.2.3
          EOF
          gh release create v9.2.3 dist/oneul-v9.2.3.apk dist/oneul-v9.2.3.aab dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SOURCE_SHA" \
            --title '오늘 한 걸음 V9.2.3' --notes-file /tmp/release-notes.md --latest

      - name: Verify published V9.2.3 release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v9.2.3 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url
          mkdir -p released
          gh release download v9.2.3 --repo "$GITHUB_REPOSITORY" --pattern 'oneul-v9.2.3.apk' --dir released
          sha256sum dist/oneul-v9.2.3.apk released/oneul-v9.2.3.apk
          test "$(sha256sum dist/oneul-v9.2.3.apk | awk '{print $1}')" = "$(sha256sum released/oneul-v9.2.3.apk | awk '{print $1}')"
          echo 'ANDROID_V9_2_3_RELEASE_PASS'
