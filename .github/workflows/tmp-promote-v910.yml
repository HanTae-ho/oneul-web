name: Temp promote V9.1.0

on:
  push:
    branches: [v9.1-ux-consolidation]
    paths:
      - '.github/workflows/tmp-promote-v910.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.1-ux-consolidation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python .github/scripts/promote_v910.py
      - run: node release-version-check.js
      - run: node verify.js
      - run: node verify-meaning.js
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html sw.js latest-release.json install.html privacy.html verify.js README.md
          git commit -m "V9.1.0: promote release metadata and cache"
          git push origin HEAD:v9.1-ux-consolidation
