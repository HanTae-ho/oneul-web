name: Temp apply V9.1 UX consolidation

on:
  push:
    branches:
      - v9.1-ux-consolidation
    paths:
      - .github/workflows/tmp-v91-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.1-ux-consolidation
          fetch-depth: 0
      - run: python .github/scripts/apply_v91.py
      - run: |
          git diff --check
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "<b>의미점검</b>" index.html
          grep -F "<b>자가점검 기록</b>" index.html
          grep -F "{v:'meaning',l:'의미'}" index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html test.js
          git commit -m "V9.1: consolidate meaning records in My Trail"
          git push origin HEAD:v9.1-ux-consolidation
