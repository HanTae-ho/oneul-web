name: Publish V8.2.40 test release

on:
  push:
    branches: [android-v8.2.40-copy-cleanup]
    paths:
      - '.github/workflows/publish-v8240-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.40 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34108145849 -n oneul-v8.2.40-copy-cleanup-apk -D dist-apk
          gh run download 34108145849 -n oneul-v8.2.40-copy-cleanup-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.40.apk
          cp dist-aab/*.aab oneul-v8.2.40.aab
          test -s oneul-v8.2.40.apk
          test -s oneul-v8.2.40.aab
          sha256sum oneul-v8.2.40.apk oneul-v8.2.40.aab
      - name: Publish V8.2.40 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.40-test --yes --cleanup-tag || true
          gh release create v8.2.40-test oneul-v8.2.40.apk oneul-v8.2.40.aab \
            --target android-v8.2.40-copy-cleanup \
            --title '오늘 한 걸음 V8.2.40 사용자 문구 다이어트 테스트' \
            --notes 'V8.2.39 기능과 저장구조를 유지하면서 사용자 화면에 남아 있던 내부 설계·표시 로직·기존 위치·저장 구현 설명을 정리했습니다. 가족도구의 기존 위치 안내와 가족 자가점검의 불필요한 모드 설명을 제거했고, SMART 전체 도구 더 보기 버튼을 강조했습니다. 내 발자취 실천기록의 기존 저장방식 설명은 대체 문구 없이 삭제했습니다. SMART 개별도구의 반복적인 구현 설명도 목적과 사용법 중심으로 축약했습니다. DATA_SCHEMA=6과 ohg.v1을 유지하며 Android 네이티브 코드는 변경하지 않고 versionCode 860 / versionName 8.2.40만 적용했습니다. 정확알림·화면 OFF 알림·부팅 후 재예약·이완 TTS·화면 OFF 재생을 그대로 보존했습니다.' \
            --prerelease
