name: Apply and validate V8.4 relationship context

on:
  push:
    branches: [v8.4-relationship-context]
    paths:
      - 'scripts/apply-v84.py'
      - '.github/workflows/apply-v84-relationship-context.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply V8.4 patch
        run: python3 scripts/apply-v84.py

      - name: Verify V8.4 invariants
        run: |
          set -euo pipefail
          grep -F "const BUILD='V8.4';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const APP_VERSION = 'V8.4';" sw.js
          grep -F "ohg-v840-relationship-context" sw.js
          grep -F "const URGE_COMPANY = ['혼자','배우자·연인','가족','친구','직장·학교 사람','과거 중독 관련 관계','회복 동료·자조모임 사람','그 밖의 사람'];" index.html
          grep -F 'id="rl-with"' index.html
          grep -F "with: rl.with || ''" index.html
          grep -F '관계 · 충동에서 반복된 맥락' index.html
          grep -F '관계 · 함께 기록된 촉발' index.html
          grep -F '관계 · 같은 날 반복된 HALT' index.html
          grep -F '다시 시작 때 반복된 관계' index.html
          grep -F '특정 사람이 원인이라고 판단하지 않습니다' index.html
          grep -F '>V8.4</span>' privacy.html
          grep -F '>V8.4</span>' legal.html

      - name: Verify urge order is preserved
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<section class="pg" id="p-urge">')
          b=s.index('</section>',a)
          x=s[a:b]
          marks=['지금 충동이 얼마나 센가요?','어떤 생각이 드나요?','5분만 같이 버텨보기','지금 상황 남기기 (선택)']
          pos=[x.index(m) for m in marks]
          assert pos==sorted(pos), (marks,pos)
          print('urge flow order PASS', pos)
          PY

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/oneul-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          print('script blocks',len(blocks))
          PY
          node --check /tmp/oneul-inline.js

      - name: Verify pattern analysis stays local and non-predictive
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('function recPattern(){')
          b=s.index('\nfunction recStatCore(){',a)
          x=s[a:b]
          for bad in ('fetch(', 'aiSend(', 'nativeReminderIntent(', 'save();'):
            assert bad not in x, bad
          assert '재발 예측이 아니며' in x
          assert '특정 사람이 원인이라고 판단하지 않습니다' in x
          print('local/non-predictive pattern PASS')
          PY

      - name: Diff check
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git diff -- index.html sw.js README.md privacy.html legal.html

      - name: Remove temporary patch workflow and commit result
        run: |
          set -euo pipefail
          rm -f scripts/apply-v84.py .github/workflows/apply-v84-relationship-context.yml
          rmdir scripts 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'V8.4 관계 맥락과 회복 패턴 연결'
          git push origin HEAD:v8.4-relationship-context
