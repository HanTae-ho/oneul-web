name: Publish V8.2.3 test release

on:
  push:
    branches: [android-v8.2.3-smart-learning]
    paths:
      - '.github/workflows/publish-v823-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.3 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33931890724 -n oneul-v8.2.3-smart-learning-apk -D dist-apk
          gh run download 33931890724 -n oneul-v8.2.3-smart-learning-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.3.apk
          cp dist-aab/*.aab oneul-v8.2.3.aab
          test -s oneul-v8.2.3.apk
          test -s oneul-v8.2.3.aab
      - name: Publish V8.2.3 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.3-test --yes --cleanup-tag || true
          gh release create v8.2.3-test oneul-v8.2.3.apk oneul-v8.2.3.aab \
            --target android-v8.2.3-smart-learning \
            --title '오늘 한 걸음 V8.2.3 SMART Recovery 회복학습 테스트' \
            --notes '회복도구 → 회복학습에 SMART Recovery를 추가했습니다. 사용자 번역 SMART Recovery 핸드북의 4-Point Program 구조를 바탕으로 ① 동기 부여 및 유지 ② 충동에 대처하기 ③ 생각·감정·행동 관리하기 ④ 균형 잡힌 삶 살기를 앱용으로 요약·재구성했습니다. Point 2에서는 기존 충동일기를 바로 열 수 있습니다. 이번 판은 읽고 이해하는 1차 학습이며 HOV·CBA·ABC·DEADS 등 작성형 워크시트는 다음 단계에서 하나씩 추가합니다. 기존 12단계, 충동일기 데이터, 위기대응 타이머와 Android 습관·생활·치료 예약알림 엔진은 변경하지 않았습니다.' \
            --prerelease
