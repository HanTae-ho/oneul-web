name: V8.2.19 SMART Problem Numbering

on:
  push:
    branches: [v8.2.19-smart-problem-numbering]
    paths:
      - 'v8219-smart-problem-numbering.py'
      - '.github/workflows/v8219-smart-problem-numbering.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.19-smart-problem-numbering
      - name: Apply numbering patch
        run: python v8219-smart-problem-numbering.py
      - name: Verify scope and invariants
        run: |
          grep -q "const BUILD = 'V8.2.19';" index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          grep -q "1-1 · 언제 발생하나요?" index.html
          grep -q "1-2 · 누가 관련되어 있나요?" index.html
          grep -q "1-3 · 무슨 일이 일어나나요?" index.html
          grep -q "1-4 · 생각과 감정" index.html
          grep -q "const APP_VERSION = 'V8.2.19';" sw.js
          grep -q "ohg-v8219-smart-problem-numbering" sw.js
          git diff --check
      - name: JavaScript syntax sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check sw.js
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.19 clarify problem definition numbering'
          git push
