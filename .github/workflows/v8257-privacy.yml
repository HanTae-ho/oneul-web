name: Apply V8.2.57 privacy policy

on:
  push:
    branches: [v8.2.57-privacy-policy]
    paths:
      - '.tmp_v8257_privacy.py'
      - '.github/workflows/v8257-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.57-privacy-policy
      - name: Apply exact privacy patch
        run: python .tmp_v8257_privacy.py
      - name: Verify protected constants and policy links
        run: |
          grep -Fq "const BUILD = 'V8.2.57';" index.html
          grep -Fq "const KEY = 'ohg.v1';" index.html
          grep -Fq "const DATA_SCHEMA = 6;" index.html
          grep -Fq 'href="./privacy.html"' index.html
          grep -Fq '개인정보처리방침' index.html
          grep -Fq "const APP_VERSION = 'V8.2.57';" sw.js
          grep -Fq "const V = 'ohg-v8257-privacy-policy';" sw.js
          grep -Fq "'./privacy.html'" sw.js
          grep -Fq '최근 일반 AI 대화 최대 8개' privacy.html
          grep -Fq '문항별 원문 응답은 저장하지 않습니다' privacy.html
          grep -Fq '원래 GPS 위도·경도는 저장하지 않으며' privacy.html
          grep -Fq 'OpenAI API' privacy.html
          grep -Fq 'Google Apps Script' privacy.html
      - name: Check JavaScript syntax and HTML basics
        run: |
          node --check sw.js
          node --check learning-data.js
          node --check qa-data.js
          node --check screening-data.js
          node --check workbook-data.js
          python - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              p=f'/tmp/inline-{i}.js'
              pathlib.Path(p).write_text(js,encoding='utf-8')
              subprocess.run(['node','--check',p],check=True)
          p=pathlib.Path('privacy.html').read_text(encoding='utf-8')
          assert '<html lang="ko">' in p and '</html>' in p and '<title>개인정보처리방침 · 오늘 한 걸음</title>' in p
          print('inline scripts:',len(scripts),'privacy bytes:',len(p.encode()))
          PY
      - name: Guard no unexpected tracking or protected schema change
        run: |
          ! grep -Eqi 'gtag\(|google-analytics|firebase analytics|sentry' index.html privacy.html
          grep -Fq "const KEY = 'ohg.v1';" index.html
          grep -Fq "const DATA_SCHEMA = 6;" index.html
      - name: Diff guard
        run: |
          git diff --check
          git status --short
          git diff -- README.md index.html sw.js privacy.html
      - name: Commit app changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html sw.js
          git diff --cached --check
          git commit -m 'V8.2.57 개인정보처리방침 연결'
          git push
