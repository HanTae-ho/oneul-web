name: Build and publish V9.0.7 Android prerelease

on:
  push:
    branches: [android-v9.0.7-version-parser-release]
    paths:
      - 'android-v9.0.7-version-parser-release.sh'
      - '.github/workflows/build-android-v906-social-speed-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Load exact current main web baseline
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "06beee32ac2b001c8a2582b68d0fc5830063549f"
          for f in index.html sw.js verify.js install.html latest-release.json; do
            git show FETCH_HEAD:"$f" > "$f"
          done
          grep -F "const BUILD='V9.0.6';" index.html
          grep -F "const APP_VERSION = 'V9.0.6';" sw.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          echo 'main baseline 06beee32 loaded'

      - name: Apply and verify V9.0.7 version parser fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=r"([vV]\d+(?:\.\d+)?)"
          new=r"([vV]\d+(?:\.\d+){1,2})"
          if s.count(old) != 1:
              raise SystemExit('APP_VERSION parser target count='+str(s.count(old)))
          s=s.replace(old,new,1)
          if s.count("const BUILD='V9.0.6';") != 1:
              raise SystemExit('V9.0.6 BUILD target not unique')
          s=s.replace("const BUILD='V9.0.6';","const BUILD='V9.0.7';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js')
          s=p.read_text(encoding='utf-8')
          if s.count("const APP_VERSION = 'V9.0.6';") != 1:
              raise SystemExit('sw APP_VERSION target not unique')
          s=s.replace("const APP_VERSION = 'V9.0.6';","const APP_VERSION = 'V9.0.7';",1)
          if s.count("const V = 'ohg-v906-social-speed-r1';") != 1:
              raise SystemExit('sw cache target not unique')
          s=s.replace("const V = 'ohg-v906-social-speed-r1';","const V = 'ohg-v907-version-parser-r1';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('verify.js')
          s=p.read_text(encoding='utf-8')
          if s.count('V9.0.6') != 4:
              raise SystemExit('verify V9.0.6 target count='+str(s.count('V9.0.6')))
          s=s.replace('V9.0.6','V9.0.7')
          p.write_text(s,encoding='utf-8')

          p=Path('install.html')
          s=p.read_text(encoding='utf-8')
          for old,new in [
              ("verifiedVersion:'V9.0.6'","verifiedVersion:'V9.0.7'"),
              ('/v9.0.6-test/oneul-v9.0.6.apk','/v9.0.7-test/oneul-v9.0.7.apk'),
              ('/tag/v9.0.6-test','/tag/v9.0.7-test')]:
              if old not in s:
                  raise SystemExit('install target missing: '+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY

          grep -F "const BUILD='V9.0.7';" index.html
          grep -F "const APP_VERSION = 'V9.0.7';" sw.js
          grep -F "const V = 'ohg-v907-version-parser-r1';" sw.js
          grep -F "([vV]\\d+(?:\\.\\d+){1,2})" index.html
          ! grep -F "([vV]\\d+(?:\\.\\d+)?)" index.html
          grep -F "const BUILD='V9.0.7';" verify.js
          grep -F "verifiedVersion:'V9.0.7'" install.html
          grep -F 'v9.0.7-test/oneul-v9.0.7.apk' install.html
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.6-social-1';" social-apps-script.gs

          node - <<'NODE'
          const rx=/const\s+APP_VERSION\s*=\s*['"]([vV]\d+(?:\.\d+){1,2})['"]/;
          for(const [src,want] of [
            ["const APP_VERSION = 'V9.0';",'V9.0'],
            ["const APP_VERSION = 'V9.0.7';",'V9.0.7'],
            ["const APP_VERSION = 'V10.2.15';",'V10.2.15']
          ]){
            const m=src.match(rx);
            if(!m || m[1]!==want) throw new Error('version parser failed: '+src);
          }
          if("const APP_VERSION = 'V9';".match(rx)) throw new Error('V9 must not be accepted');
          console.log('APP_VERSION parser semantic tests PASS');
          NODE

          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/index-all.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)),encoding='utf-8')
          n=Path('native.html').read_text(encoding='utf-8')
          Path('/tmp/native.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',n,re.S)),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/native.js
          node --check /tmp/social.js
          node --check sw.js
          node --check verify.js
          node --check test.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.7 package revision
        run: bash android-v9.0.7-version-parser-release.sh

      - name: Verify preserved reminder and TTS engines
        run: |
          set -euo pipefail
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          ACT="$PKG/NotificationSettingsActivity.java"
          grep -F 'ReminderStore.importSchedule(this, "", "", "", "", val(u, "build"))' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, "")' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, "", "", TreatmentReminderStore.time(this), 0)' "$ACT"
          grep -F 'String visitAlerts = TreatmentReminderStore.alertsPacked(this)' "$ACT"
          grep -F 'String visitTime = TreatmentReminderStore.time(this)' "$ACT"
          grep -F 'ReminderStore.importSchedule(this, pendingRisk, pendingMeds, pendingEats, pendingBed, pendingBuild)' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, pendingHabits)' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, pendingVisit, visitAlerts, visitTime, pendingVisitInterval)' "$ACT"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify APK version permissions package and native marker
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='902' versionName='9.0.7'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          grep -R -Fq 'https://hantae-ho.github.io/oneul-web/native.html?appv=9.0.7' android-v8/app/src/main
          cp "$APK" oneul-v9.0.7.apk
          cp "$AAB" oneul-v9.0.7.aab
          sha256sum oneul-v9.0.7.apk oneul-v9.0.7.aab | tee SHA256SUMS.txt

      - name: Upload release files artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.7-release-files
          path: |
            oneul-v9.0.7.apk
            oneul-v9.0.7.aab
            SHA256SUMS.txt

      - name: Publish V9.0.7 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v9.0.7-test --yes --cleanup-tag || true
          gh release create v9.0.7-test oneul-v9.0.7.apk oneul-v9.0.7.aab SHA256SUMS.txt \
            --target android-v9.0.7-version-parser-release \
            --title '오늘 한 걸음 V9.0.7 테스트 릴리즈' \
            --notes 'V9.0.7은 서비스워커 APP_VERSION 파서를 Vx.y 및 Vx.y.z 전체 버전을 정확히 읽도록 수정한 최소 유지보수 릴리즈입니다. 앱 기능/UI·DATA_SCHEMA=6·ohg.v1·ohg.social.v1·V9.0.6-social-1 서버 로직은 변경하지 않았습니다. Android는 versionCode 902 / versionName 9.0.7만 올리고 기존 정확알림, 화면 OFF 알림, 부팅 후 재예약, 복약·외래·생활·습관 알림, silent reminder bridge, 마음프로 네이티브 음성, 이완 TTS 엔진을 보존 검증했습니다. prerelease이지만 사용자의 명시적 요청에 따라 최신 설치 안내도 V9.0.7로 연결합니다.' \
            --prerelease

      - name: Promote V9.0.7 web latest pointer and install on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CURRENT=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$CURRENT" = "06beee32ac2b001c8a2582b68d0fc5830063549f"

          cat > latest-release.json <<'EOF'
          {
            "version": "V9.0.7",
            "versionCode": 902,
            "apk": "https://github.com/HanTae-ho/oneul-web/releases/download/v9.0.7-test/oneul-v9.0.7.apk",
            "release": "https://github.com/HanTae-ho/oneul-web/releases/tag/v9.0.7-test"
          }
          EOF

          put_main_file() {
            path="$1"
            file="$2"
            msg="$3"
            sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=main" --jq .sha)
            python3 - "$file" "$sha" "$msg" <<'PY'
          import base64, json, sys
          file, sha, msg = sys.argv[1:4]
          with open(file,'rb') as f:
              content=base64.b64encode(f.read()).decode('ascii')
          with open('/tmp/put.json','w',encoding='utf-8') as f:
              json.dump({'message':msg,'content':content,'sha':sha,'branch':'main'},f,ensure_ascii=False)
          PY
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input /tmp/put.json >/tmp/put-result.json
          }

          put_main_file index.html index.html 'V9.0.7: parse full APP_VERSION'
          put_main_file sw.js sw.js 'V9.0.7: advance service worker version'
          put_main_file verify.js verify.js 'V9.0.7: align regression version checks'
          put_main_file latest-release.json latest-release.json 'Point latest Android release to V9.0.7'
          put_main_file install.html install.html 'Promote install target to V9.0.7'

          gh api "repos/$GITHUB_REPOSITORY/contents/index.html?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/main-index.html
          gh api "repos/$GITHUB_REPOSITORY/contents/sw.js?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/main-sw.js
          gh api "repos/$GITHUB_REPOSITORY/contents/verify.js?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/main-verify.js
          gh api "repos/$GITHUB_REPOSITORY/contents/latest-release.json?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/main-latest.json
          gh api "repos/$GITHUB_REPOSITORY/contents/install.html?ref=main" --jq .content | tr -d '\n' | base64 -d > /tmp/main-install.html
          grep -F "const BUILD='V9.0.7';" /tmp/main-index.html
          grep -F "([vV]\\d+(?:\\.\\d+){1,2})" /tmp/main-index.html
          grep -F "const DATA_SCHEMA = 6;" /tmp/main-index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" /tmp/main-index.html
          grep -F "const APP_VERSION = 'V9.0.7';" /tmp/main-sw.js
          grep -F "const V = 'ohg-v907-version-parser-r1';" /tmp/main-sw.js
          grep -F "const BUILD='V9.0.7';" /tmp/main-verify.js
          grep -F '"version": "V9.0.7"' /tmp/main-latest.json
          grep -F '"versionCode": 902' /tmp/main-latest.json
          grep -F "verifiedVersion:'V9.0.7'" /tmp/main-install.html
          grep -F 'v9.0.7-test/oneul-v9.0.7.apk' /tmp/main-install.html
          echo 'V9.0.7 main + latest-release + install promotion PASS'
