name: Validate V8.2.28 native relaxation routing

on:
  push:
    branches: [v8.2.28-native-relax-tts]
    paths:
      - 'v8228-native-relax-web.py'
      - '.github/workflows/v8228-native-relax-web.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.28-native-relax-tts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V8.2.28 web patch
        run: python v8228-native-relax-web.py
      - name: Validate V8.2.28 routing and preserved behavior
        run: |
          grep -q "const BUILD = 'V8.2.28'" index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q "const RELAX_TTS_RATE=.80" index.html
          ! grep -q "const RELAX_TTS_RATE=.88" index.html
          grep -q "ohg.native.app" index.html
          grep -q "oneul://relax/" index.html
          grep -q "smart-relax-native-note" index.html
          grep -q "Android 앱에서는 화면이 꺼져도 이어집니다" index.html
          grep -q "data-relax-guide=\"pmr\"" index.html
          grep -q "data-relax-guide=\"visual\"" index.html
          grep -q "data-relax-guide=\"meditation\"" index.html
          grep -q "4초 들이쉬기 · 6초 내쉬기" index.html
          grep -q "const APP_VERSION = 'V8.2.28'" sw.js
          grep -q "ohg-v8228-native-relax-tts" sw.js
      - name: JavaScript syntax checks
        run: |
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          open('/tmp/index-inline.js','w',encoding='utf-8').write('\n'.join(parts))
          PY
          node --check /tmp/index-inline.js
          node --check sw.js
      - name: Validate diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).split())
          assert files <= {'index.html','sw.js'}, files
          PY
      - name: Commit validated product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.28 route Android relaxation guides to native player'
          git push
