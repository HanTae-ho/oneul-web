name: Remove V9.0.8 patch job condition

on:
  push:
    branches: [v9.0.8-social-ui]
    paths:
      - '.github/workflows/fix-patch-v908-workflow-2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.8-social-ui
      - name: Remove job-level if line
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/patch-v908-social.yml')
          lines=p.read_text(encoding='utf-8').splitlines(True)
          out=[]; removed=False
          for line in lines:
            if not removed and line.startswith('    if:'):
              removed=True
              continue
            out.append(line)
          if not removed: raise SystemExit('job if line not found')
          p.write_text(''.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/patch-v908-social.yml
          git commit -m 'Remove invalid V9.0.8 patch job condition'
          git push origin HEAD:v9.0.8-social-ui
