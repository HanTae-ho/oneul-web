name: Apply V8.2.65 reclaim move

on:
  push:
    branches: [v8.2.65-reclaim-to-my]
    paths:
      - 'v8265-move-reclaim.py'
      - '.github/workflows/v8265-move-reclaim.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.65-reclaim-to-my
          fetch-depth: 0
      - name: Apply minimal move
        run: python v8265-move-reclaim.py
      - name: Verify scope and JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="rec-reclaim"') == 1
          my=s[s.index('<section class="pg" id="p-my">'):s.index('<!-- ══════════ 내 정보 ══════════ -->')]
          rec=s[s.index('<section class="pg" id="p-rec">'):s.index('<!-- ══════════ 모임 찾기 ══════════ -->')]
          assert 'id="rec-reclaim"' in my and 'id="rec-reclaim"' not in rec
          assert my.index('id="rec-reclaim"') < my.index('id="my-trail"')
          assert "if(p === 'my'){ drawReclaim(); drawFeedbackStatus(); drawAdmin(); }" in s
          assert 'function drawRec(){\n  drawReclaim();' not in s
          assert "save(); closeModal(); drawReclaim(); toast('기준을 저장했습니다.');" in s
          assert "const BUILD = 'V8.2.65';" in s
          assert "const DATA_SCHEMA = 6" in s or "const DATA_SCHEMA=6" in s
          assert "const KEY = 'ohg.v1'" in s or "const KEY='ohg.v1'" in s
          # direct SVG icon policy remains intact
          assert "clock:" in s and "wallet:" in s and "sprout:" in s
          scripts=[]
          for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S|re.I): scripts.append(m.group(1))
          Path('/tmp/inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/inline.js
          grep -F "const APP_VERSION = 'V8.2.65';" sw.js
          grep -F "const V = 'ohg-v8265-reclaim-to-my';" sw.js
          grep -F 'V8.2.65' privacy.html
          git diff --name-only | sort | tee /tmp/changed
          diff -u <(printf 'README.md\nindex.html\nprivacy.html\nsw.js\n') /tmp/changed
      - name: Commit target files and remove temporary patch files
        run: |
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add README.md index.html privacy.html sw.js
          git rm v8265-move-reclaim.py .github/workflows/v8265-move-reclaim.yml
          git commit -m 'V8.2.65 move reclaimed summary to My'
          git push origin HEAD:v8.2.65-reclaim-to-my
