name: Publish V8.2.61 test release

on:
  push:
    branches: [android-v8.2.61-onboarding-ai-setting]
    paths:
      - '.github/workflows/publish-v8261-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.61 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34214388712 -n oneul-v8.2.61-onboarding-ai-apk -D dist-apk
          gh run download 34214388712 -n oneul-v8.2.61-onboarding-ai-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.61.apk
          cp dist-aab/*.aab oneul-v8.2.61.aab
          test -s oneul-v8.2.61.apk
          test -s oneul-v8.2.61.aab
          sha256sum oneul-v8.2.61.apk oneul-v8.2.61.aab
      - name: Publish V8.2.61 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.61-test --yes --cleanup-tag || true
          gh release create v8.2.61-test oneul-v8.2.61.apk oneul-v8.2.61.aab \
            --target android-v8.2.61-onboarding-ai-setting \
            --title '오늘 한 걸음 V8.2.61 최초 설정 · 마음프로 AI 기본 사용 테스트' \
            --notes '최초 설정의 시작하기 바로 위에 개인정보처리방침 확인(필수)과 마음프로 AI 사용(기본 ON, 해제 가능)을 배치했습니다. 마음프로 안의 기존 동의하고 계속/취소 전송 팝업과 동의 상태·철회 표시는 제거했으며, 마음프로 AI 사용 여부는 내 정보 · 설정 → 앱에서 언제든 켜거나 끌 수 있습니다. AI가 꺼져도 타이머·도움글·모임·센터·병원·헬프콜·기록 등 Local-first 기능은 계속 사용할 수 있습니다. AI 서버 전송 구조는 변경하지 않아 AI 답변이 필요한 경우 익명형 clientId·현재 메시지·주제·앱 버전·최근 AI 대화 최대 8개를 기존과 같이 Google Apps Script를 거쳐 OpenAI API로 전송하며, 저장된 회복기록은 자동 첨부하지 않습니다. DATA_SCHEMA=6, ohg.v1, 기존 회복기록 구조는 변경하지 않았습니다. Android는 V8.2.60에서 검증한 정확알림·화면 OFF 알림·부팅 재예약·복약/외래/생활/습관 알림·마음프로 네이티브 TTS·이완 TTS 스택을 그대로 사용하고 versionCode 881 / versionName 8.2.61만 적용했습니다. 웹 main SHA는 aeb1541279f1f81a3349bf1011ec492f611ef155 입니다.' \
            --prerelease
