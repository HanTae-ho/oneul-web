name: Apply V8.1.9 Habit Recommendation Collapse

on:
  push:
    branches: [v8.1.9-habit-recommend-collapse]
    paths:
      - 'v819-habit-recommend-collapse.py'
      - '.github/workflows/v819-habit-recommend-collapse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.9-habit-recommend-collapse
      - name: Apply V8.1.9 habit UI patch
        run: python v819-habit-recommend-collapse.py
      - name: Verify JavaScript and collapsed recommendation UI
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=[b for b in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s) if b.strip()]
          assert blocks
          for i,b in enumerate(blocks): Path(f'/tmp/app-{i}.js').write_text(b,encoding='utf-8')
          assert "const BUILD = 'V8.1.9';" in s
          assert 'id="habit-template-toggle"' in s
          assert 'id="habit-templates" class="hide"' in s
          assert 'let habitTemplatesOpen = false;' in s
          assert "tmp.classList.toggle('hide',!habitTemplatesOpen)" in s
          assert "habitTemplatesOpen=!habitTemplatesOpen" in s
          assert 'id="habit-new"' in s
          assert s.index('id="habit-new"') < s.index('id="habit-template-toggle"')
          assert 'data-template-use' in s and 'data-template-edit' in s
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
          grep -q "const APP_VERSION = 'V8.1.9'" sw.js
          grep -q "ohg-v819-habit-collapse" sw.js
      - name: Verify limited scope
        run: |
          git diff -- index.html sw.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit V8.1.9 web files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.1.9 collapse recommended habits by default'
          git push
