name: Build and publish V9.0.2 Android prerelease

on:
  push:
    branches: [android-v9.0.2-social-comments-release]
    paths:
      - 'android-v9.0.2-social-comments-release.sh'
      - '.github/workflows/build-android-v902-social-comments-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.2 version-only patch
        run: bash android-v9.0.2-social-comments-release.sh

      - name: Verify preserved reminder and TTS engines
        run: |
          set -euo pipefail
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          ACT="$PKG/NotificationSettingsActivity.java"
          grep -F 'ReminderStore.importSchedule(this, "", "", "", "", val(u, "build"))' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, "")' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, "", "", TreatmentReminderStore.time(this), 0)' "$ACT"
          grep -F 'String visitAlerts = TreatmentReminderStore.alertsPacked(this)' "$ACT"
          grep -F 'String visitTime = TreatmentReminderStore.time(this)' "$ACT"
          grep -F 'ReminderStore.importSchedule(this, pendingRisk, pendingMeds, pendingEats, pendingBed, pendingBuild)' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, pendingHabits)' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, pendingVisit, visitAlerts, visitTime, pendingVisitInterval)' "$ACT"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Verify V9.0.2 web/social invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          grep -F "const BUILD='V9.0.2';" index.html
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.2-social-1';" social-apps-script.gs
          grep -F 'function commentCreate_' social-apps-script.gs
          grep -F 'function commentReport_' social-apps-script.gs
          grep -F 'function SOCIAL_REVIEW_CHECK' social-apps-script.gs

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify APK version permissions and package
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='896' versionName='9.0.2'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          cp "$APK" oneul-v9.0.2.apk
          cp "$AAB" oneul-v9.0.2.aab
          sha256sum oneul-v9.0.2.apk oneul-v9.0.2.aab | tee SHA256SUMS.txt

      - name: Upload release files artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.2-release-files
          path: |
            oneul-v9.0.2.apk
            oneul-v9.0.2.aab
            SHA256SUMS.txt

      - name: Publish V9.0.2 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v9.0.2-test --yes --cleanup-tag || true
          gh release create v9.0.2-test oneul-v9.0.2.apk oneul-v9.0.2.aab SHA256SUMS.txt \
            --target android-v9.0.2-social-comments-release \
            --title '오늘 한 걸음 V9.0.2 소셜 댓글 테스트 릴리즈' \
            --notes 'V9.0.2 테스트 릴리즈입니다. 소셜 2단계로 게시물 댓글 작성·댓글 수·내 댓글 삭제·댓글 신고·댓글 작성자 기기 내 차단·운영 검토와 프로필의 받은 응원/게시물/댓글 요약을 추가했습니다. Message·DM·친구/팔로우·답글·그룹·하이브는 추가하지 않았습니다. 소셜 서버 소스는 V9.0.2-social-1이며 Comments/CommentReports와 SOCIAL_REVIEW_CHECK를 포함하지만, 실제 Apps Script 배포는 사용자가 별도로 해야 합니다. 또한 자원서버 config.SOCIAL_URL 전달 수정은 보류 중이므로 댓글 E2E 실기기 확인은 아직 완료되지 않았습니다. 개인 회복기록은 DATA_SCHEMA=6 / ohg.v1, 소셜 로컬 키는 ohg.social.v1을 유지합니다. Android는 기존 검증된 V9.0.1/V8.5 네이티브 알림·TTS 스택을 변경하지 않고 versionCode 896 / versionName 9.0.2만 적용합니다. 정확알림, 화면 OFF 알림, 부팅 후 재예약, 복약·외래·생활·습관 알림, silent reminder apply/clear, 마음프로 네이티브 음성, 이완 TTS 엔진을 빌드에서 정적 검증합니다. 웹 main SHA: e6736f8a95d7f98d81eba7483fc76551c5eb3808. 실기기 확인 전이므로 prerelease이며 추천 설치 버전은 아직 승격하지 않습니다.' \
            --prerelease
