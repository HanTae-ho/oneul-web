name: V8.2.8 SMART Three Questions

on:
  push:
    branches: [v8.2.8-smart-three-questions]
    paths:
      - 'v828-smart-three-questions.py'
      - '.github/workflows/v828-smart-three-questions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.8-smart-three-questions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply My Three Questions patch
        run: python v828-smart-three-questions.py
      - name: Verify product changes
        run: |
          grep -q "const BUILD = 'V8.2.8'" index.html
          grep -q 'id="p-smart-three-questions"' index.html
          grep -q 'function drawSmartThreeQuestions' index.html
          grep -q "type === 'smart-three-questions'" index.html
          grep -q '이 답을 바탕으로 변화 계획 작성하기' index.html
          grep -q 'openSmartChangePlanEditor(null,{change:' index.html
          grep -q '"type": "smart-three-questions"' learning-data.js
          grep -q '"label": "나의 3가지 질문 작성하기"' learning-data.js
          grep -q "const APP_VERSION = 'V8.2.8'" sw.js
          grep -q "ohg-v828-smart-three-questions" sw.js
          node --check learning-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify source order and scope
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('learning-data.js').read_text(encoding='utf-8')
          a=s.index('"type": "smart-hov"')
          b=s.index('"type": "smart-three-questions"')
          c=s.index('"type": "smart-change-plan"')
          d=s.index('"type": "smart-cba"')
          assert a < b < c < d
          PY
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html learning-data.js sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.8 add SMART My Three Questions worksheet' || true
          git push
