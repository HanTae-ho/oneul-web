name: Apply and validate V9.0 MindPro simulation fixes

on:
  push:
    branches: [v9.0-ai-simulation-fixes]
    paths:
      - '.github/workflows/apply-v90-ai-simulation-fixes.yml'

permissions:
  contents: write

jobs:
  patch-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0-ai-simulation-fixes
          fetch-depth: 0

      - name: Apply six focused fixes
        run: |
          set -euo pipefail
          python3 -B scripts/v90_fix6.py

      - name: Verify invariants and syntax
        run: |
          set -euo pipefail
          grep -F "const BUILD='V9.0';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const V = 'ohg-v900-ai-simulation-fixes';" sw.js
          grep -F "TEMPORARY','UPSTREAM_BUSY" index.html
          grep -F "어제는" index.html
          grep -F "모레는" index.html
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
          open('/tmp/index-inline.js','w',encoding='utf-8').write('\n;\n'.join(blocks))
          PY
          node --check /tmp/index-inline.js
          node --check sw.js

      - name: Run regression scenarios and expanded simulation
        run: |
          set -euo pipefail
          python3 -B scripts/v90_simulate.py

      - name: Verify diff scope
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          allowed={'index.html','sw.js'}
          bad=[x for x in files if x not in allowed]
          if bad: raise SystemExit('unexpected modified files: '+', '.join(bad))
          print('DIFF_SCOPE_PASS',files)
          PY
          git diff --stat

      - name: Commit validated fixes
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v90-ai-simulation-fixes.yml scripts/v90_fix6.py scripts/v90_simulate.py
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add -A
          git commit -m 'V9.0 마음프로 시뮬레이션 6개 오류 보정'
          git push origin HEAD:v9.0-ai-simulation-fixes
