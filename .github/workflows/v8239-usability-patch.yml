name: Apply V8.2.39 usability patch

on:
  push:
    branches:
      - v8.2.39-usability-consolidation

permissions:
  contents: write

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[v8239-applied]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.39-usability-consolidation
      - name: Apply patch
        run: python .github/scripts/v8239_patch.py
      - name: Static validation
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const BUILD = 'V8.2.39';" in s
          assert "const DATA_SCHEMA = 6;" in s
          assert "const KEY = 'ohg.v1';" in s
          assert 'id="p-my"' in s
          assert 'id="schedule-habit"' in s
          assert 'id="go-ai-home"' not in s
          assert 'id="tool-habit"' not in s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/oneul-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/oneul-inline.js
          node --check sw.js
      - name: Commit patched files
        shell: bash
        run: |
          rm -f .github/scripts/v8239_patch.py .github/workflows/v8239-usability-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md .github
          git commit -m "V8.2.39 사용성 2차 정리 [v8239-applied]"
          git push origin HEAD:v8.2.39-usability-consolidation
