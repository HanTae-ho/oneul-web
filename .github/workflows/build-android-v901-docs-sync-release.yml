name: Build and publish V9.0.1 docs-sync prerelease

on:
  push:
    branches: [android-v9.0.1-docs-sync-release]
    paths:
      - 'android-v9.0.1-ai-social-release.sh'
      - '.github/workflows/build-android-v901-docs-sync-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify current web main and inline JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          MAIN_SHA=$(git rev-parse origin/main)
          test "$MAIN_SHA" = "040e2522903cc37d3b3d78f645984f868247e9e7"
          git show origin/main:index.html > /tmp/index-main.html
          git show origin/main:README.md > /tmp/README-main.md
          grep -F '홈 · 회복도구 · 헬프 · 마음프로 · 소셜' /tmp/index-main.html
          grep -F '## V9.0.1 — 마음프로 역할·모임조회·소셜 연결 안내' /tmp/README-main.md
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('/tmp/index-main.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script\b([^>]*)>(.*?)</script\s*>', html, flags=re.I | re.S)
          out = Path('/tmp/inline-js')
          out.mkdir(exist_ok=True)
          count = 0
          for attrs, body in scripts:
              if re.search(r'\bsrc\s*=', attrs, flags=re.I):
                  continue
              m = re.search(r'\btype\s*=\s*["\']([^"\']+)["\']', attrs, flags=re.I)
              typ = (m.group(1).strip().lower() if m else '')
              if typ and typ not in ('text/javascript', 'application/javascript', 'module'):
                  continue
              ext = '.mjs' if typ == 'module' else '.js'
              count += 1
              (out / f'inline-{count:02d}{ext}').write_text(body, encoding='utf-8')
          if count == 0:
              raise SystemExit('No inline JavaScript found')
          print(f'extracted {count} inline JavaScript blocks')
          PY
          shopt -s nullglob
          files=(/tmp/inline-js/*)
          test ${#files[@]} -gt 0
          for f in "${files[@]}"; do node --check "$f"; done
          echo "web main + inline JavaScript syntax PASS: $MAIN_SHA"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.1 docs-sync metadata patch
        run: bash android-v9.0.1-ai-social-release.sh

      - name: Verify preserved reminder and TTS engines
        run: |
          set -euo pipefail
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          ACT="$PKG/NotificationSettingsActivity.java"
          grep -F 'ReminderStore.importSchedule(this, "", "", "", "", val(u, "build"))' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, "")' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, "", "", TreatmentReminderStore.time(this), 0)' "$ACT"
          grep -F 'String visitAlerts = TreatmentReminderStore.alertsPacked(this)' "$ACT"
          grep -F 'String visitTime = TreatmentReminderStore.time(this)' "$ACT"
          grep -F 'ReminderStore.importSchedule(this, pendingRisk, pendingMeds, pendingEats, pendingBed, pendingBuild)' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, pendingHabits)' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, pendingVisit, visitAlerts, visitTime, pendingVisitInterval)' "$ACT"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify APK version permissions and package
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='895' versionName='9.0.1'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          cp "$APK" oneul-v9.0.1-test2.apk
          cp "$AAB" oneul-v9.0.1-test2.aab
          sha256sum oneul-v9.0.1-test2.apk oneul-v9.0.1-test2.aab | tee SHA256SUMS.txt

      - name: Upload release files artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.1-test2-release-files
          path: |
            oneul-v9.0.1-test2.apk
            oneul-v9.0.1-test2.aab
            SHA256SUMS.txt

      - name: Publish V9.0.1 test2 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v9.0.1-test2 --yes --cleanup-tag || true
          gh release create v9.0.1-test2 oneul-v9.0.1-test2.apk oneul-v9.0.1-test2.aab SHA256SUMS.txt \
            --target android-v9.0.1-docs-sync-release \
            --title '오늘 한 걸음 V9.0.1 사용설명서 동기화 테스트 릴리즈' \
            --notes 'V9.0.1 테스트 2 릴리즈입니다. 웹 main의 실제 하단 메뉴와 사용설명서를 일치시켜 소셜 탭을 반영했고 README에 V9.0.1 마음프로 역할·날짜/시간·모임조회·소셜 연결 변경사항을 현행화했습니다. 웹 main SHA는 040e2522903cc37d3b3d78f645984f868247e9e7이며 릴리즈 빌드에서 main의 사용설명서 문구와 인라인 JavaScript 문법을 검증합니다. Android 네이티브 알림/TTS 스택은 변경하지 않고 versionCode 895 / versionName 9.0.1만 적용합니다. DATA_SCHEMA=6, ohg.v1, ohg.social.v1을 유지합니다. 소셜 전용 서버 V9.0.1-social-2의 health는 정상 확인됐지만 자원 Apps Script v1.8의 SOCIAL_URL 전달 수정은 사용자 요청에 따라 보류 중이므로 소셜 E2E 연결은 아직 완료 상태로 간주하지 않습니다. 실기기 최종 확인 전 prerelease이며 추천 설치 버전은 승격하지 않습니다.' \
            --prerelease
