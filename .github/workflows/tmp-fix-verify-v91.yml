name: Temp V9.1 verify invariant update

on:
  push:
    branches:
      - v9.1-ux-consolidation
    paths:
      - .github/workflows/tmp-fix-verify-v91.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.1-ux-consolidation
          fetch-depth: 0
      - run: python .github/scripts/fix_verify_v91.py
      - run: node verify.js
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add verify.js
          git commit -m "V9.1: update UX regression invariants"
          git push origin HEAD:v9.1-ux-consolidation
