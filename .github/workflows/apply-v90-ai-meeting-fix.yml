name: Apply and validate V9.0 meeting and AI date fixes

on:
  push:
    branches: [v9.0-ai-meeting-fix]
    paths:
      - '.github/workflows/apply-v90-ai-meeting-fix.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0-ai-meeting-fix
          fetch-depth: 0

      - name: Apply focused V9.0 fixes
        run: |
          set -euo pipefail
          # Remove one accidental literal backslash-n left at the end of a Python source line.
          sed -i 's/\\n$//' scripts/apply_v90_ai_meeting_fix.py
          python3 -m py_compile scripts/apply_v90_ai_meeting_fix.py
          python3 scripts/apply_v90_ai_meeting_fix.py

      - name: Verify invariants and requested scope
        run: |
          set -euo pipefail
          grep -F "const BUILD='V9.0';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "function aiCalendarReply(text, baseDate)" index.html
          grep -F "function aiMeetingDateTarget(text, baseDate)" index.html
          grep -F "function aiMeetingKindQuery(text)" index.html
          grep -F "종료시간 정보는 없어 지금 실제로 진행 중인지는 확정할 수 없습니다" index.html
          grep -F "[앱 기준 현재시각:" index.html
          grep -F "currentTime:nowCtx" index.html
          grep -F "const V = 'ohg-v900-social-ai-meeting-fix';" sw.js
          grep -F "기기의 현재 날짜·시간·시간대" privacy.html
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          aa=s.index("{n:'AA 익명의 알코올중독자들'")
          na=s.index("{n:'NA 익명의 약물중독자들'")
          ga1=s.index("{n:'한국GA 단도박모임'")
          ga2=s.index("{n:'한국단도박모임'")
          smart=s.index("{n:'한국 SMART Recovery'")
          assert aa < na < ga1 < ga2 < smart, (aa,na,ga1,ga2,smart)
          assert "S.urges" not in s[s.index('function aiMeetingInfo'):s.index('function aiMeetingPayload')]
          print('group order and meeting data boundary PASS')
          PY

      - name: JavaScript syntax check
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
          open('/tmp/index-inline.js','w',encoding='utf-8').write('\n;\n'.join(blocks))
          PY
          node --check /tmp/index-inline.js
          node --check sw.js

      - name: Behavior contract for date and meeting parsing
        run: |
          set -euo pipefail
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          a=s.index('function aiAddLocalDays')
          b=s.index('function aiMeetingPayload',a)
          helper=s[a:b]
          pre="""
          const DAYN=['일','월','화','수','목','금','토'];
          const pad=n=>String(n).padStart(2,'0');
          const ymd=v=>{const d=new Date(v);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
          const S={res:{groups:[
            {n:'AA 광주',y:'목',h:'19:00',a:'광주',k:'알코올',d:'AA'},
            {n:'GA 광주',y:'목',h:'20:00',a:'광주',k:'도박',d:'GA'},
            {n:'AA 수요일',y:'수',h:'19:00',a:'광주',k:'알코올',d:'AA'}
          ]},area:'광주',types:['alcohol']};
          const FAMILY=[], GROUPS=[];
          const famMode=()=>false;
          const rowKind=r=>r.k||'';
          const myKinds=()=>['알코올'];
          const areasOf=r=>r.a?[r.a]:[];
          """
          test="""
          const base=new Date(2026,8,9,20,0,0,0);
          function ok(x,msg){if(!x)throw new Error(msg);}
          ok(aiCalendarReply('오늘은 며칠이야',base).includes('2026년 9월 9일 수요일'),'today date');
          ok(aiCalendarReply('내일이 무슨 요일이야',base).includes('2026년 9월 10일 목요일'),'tomorrow date');
          ok(aiMeetingDateTarget('목요일에 열리는 모임 있어?',base).day==='목','weekday target');
          ok(aiMeetingDateTarget('내일 열리는 모임 있어?',base).day==='목','tomorrow meeting');
          ok(aiMeetingKindQuery('AA 모임 어디야')==='알코올','AA kind');
          ok(aiMeetingKindQuery('GA 모임')==='도박','GA kind');
          ok(aiMeetingKindQuery('NA 모임')==='약물','NA kind');
          ok(aiMeetingKindQuery('SMART Recovery 모임')==='SMART','SMART kind');
          const future=aiMeetingSummary('광주','','','내일 AA 모임 있어?',base);
          ok(future.includes('9월 10일 목요일')&&future.includes('AA 광주')&&!future.includes('GA 광주'),'future filtered summary');
          const current=aiMeetingSummary('광주','','','지금 하고 있는 AA 모임이 어디야',base);
          ok(current.includes('종료시간 정보는 없어')&&current.includes('AA 수요일'),'current meeting caution');
          console.log('date/meeting behavior PASS');
          """
          open('/tmp/meeting-test.js','w',encoding='utf-8').write(pre+'\n'+helper+'\n'+test)
          PY
          node /tmp/meeting-test.js

      - name: Verify diff scope
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          allowed={'index.html','sw.js','privacy.html','README.md'}
          bad=[x for x in files if x not in allowed]
          if bad: raise SystemExit('unexpected modified files: '+', '.join(bad))
          print('changed scope PASS:', ', '.join(files))
          PY
          git diff --stat

      - name: Commit validated V9.0 fixes
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v90-ai-meeting-fix.yml scripts/apply_v90_ai_meeting_fix.py
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add -A
          git commit -m 'V9.0 모임 날짜 검색 · 마음프로 시간기준 보정'
          git push origin HEAD:v9.0-ai-meeting-fix
