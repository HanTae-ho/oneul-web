name: Apply V9.0.2 social comments

on:
  push:
    branches: [v9.0.2-social-comments]
    paths:
      - 'scripts/apply-v902-social-comments.py'
      - '.github/workflows/apply-v902-social-comments.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply V9.0.2 patch
        run: python scripts/apply-v902-social-comments.py
      - name: Check JavaScript syntax and invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          grep -F "const BUILD='V9.0.2';" index.html
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.2-social-1';" social-apps-script.gs
          grep -F 'function commentCreate_' social-apps-script.gs
          grep -F 'function commentReport_' social-apps-script.gs
          grep -F 'function SOCIAL_REVIEW_CHECK' social-apps-script.gs
      - name: Commit product changes only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-v902-social-comments.py .github/workflows/apply-v902-social-comments.yml
          git add index.html sw.js social-apps-script.gs README.md SOCIAL_SETUP.md
          git diff --cached --stat
          git commit -m 'V9.0.2 소셜 댓글·운영검토 확장'
          git push
