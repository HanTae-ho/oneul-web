name: Patch V9.0.18 practice grid

on:
  push:
    branches: [v9.0.18-practice-grid]
    paths:
      - '.github/workflows/patch-v9018-practice-grid.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.18-practice-grid
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify V9.0.18
        run: |
          set -euo pipefail
          python3 .github/scripts/patch-v9018.py
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks += [Path('meaning-feature.js').read_text(encoding='utf-8'),Path('meaning-check-feature.js').read_text(encoding='utf-8')]
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          start=s.index('<h2>실천하기</h2>')
          end=s.index('<div class="toolsec">',start)
          # first hit at current section wrapper is before h2, so search after h2
          end=s.index('<div class="toolsec">',start+len('<h2>실천하기</h2>'))
          sec=s[start:end]
          assert 'class="learnmini practice-mini"' in sec
          assert sec.count('class="minitool') == 7
          assert 'class="toolcard' not in sec
          assert 'class="go"' not in sec
          assert 'id="tool-meaning"' in sec and 'id="tool-meaning-check-direct"' in sec and 'id="tool-workbook"' in sec
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          node --check verify.js
          node --check verify-meaning.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
          node verify-meaning.js
          EXPECTED_APP_VERSION=V9.0.18 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';" social-apps-script.gs
          grep -F "verifiedVersion:'V9.0.15'" install.html
          grep -F 'class="learnmini practice-mini"' index.html
          grep -F '오늘 기록 있음 · 다시 보기' index.html
          grep -F '오늘 '+ index.html >/dev/null || true
          git diff --check
      - name: Commit final patch and remove temporary files
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-v9018.py .github/workflows/patch-v9018-practice-grid.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V9.0.18 compact practice tools into three-column grid'
          git push origin HEAD:v9.0.18-practice-grid
