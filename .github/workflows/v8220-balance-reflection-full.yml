name: V8.2.20 Balance Reflection Full Prompts

on:
  push:
    branches: [v8.2.20-smart-balance-pie]
    paths:
      - 'v8220-balance-reflection-full.py'
      - '.github/workflows/v8220-balance-reflection-full.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.20-smart-balance-pie
      - run: python v8220-balance-reflection-full.py
      - name: Verify
        run: |
          grep -q '번역본 돌아보기 질문 전체 보기' index.html
          grep -q '내가 살 날이 한 달 남았다면' index.html
          grep -q '내 시간의 얼마나 많은 부분이 다른 사람들을 돌보느라 사용되나요' index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit product file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V8.2.20 keep full translated balance reflection prompts collapsed'
          git push
