name: V8.2.2 final state fix

on:
  push:
    branches: [v8.2.2-urge-diary]
    paths:
      - 'v822-thought-fix.py'
      - '.github/workflows/v822-thought-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.2-urge-diary
          fetch-depth: 0
      - name: Apply thought-state fix
        run: python v822-thought-fix.py
      - name: Verify final JavaScript and state flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S|re.I)
          js=max(blocks,key=len)
          with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False,encoding='utf-8') as f:
              f.write(js); n=f.name
          subprocess.run(['node','--check',n],check=True)
          bad='queueUrgeDraft(); drawUrge();'
          if bad in s: raise SystemExit('stale redraw remains')
          needed=["b.classList.toggle('on',urge.thoughts.indexOf(t)>=0)",'queueUrgeDraft()',"S.urgeDraft",'drawUrgeDiary()']
          for x in needed:
              if x not in s: raise SystemExit('missing '+x)
          print('final state verification PASS')
          PY
      - name: Diff hygiene
        run: |
          git diff --check
          files=$(git diff --name-only | sort | tr '\n' ' ')
          test "$files" = "index.html "
      - name: Commit product fix
        run: |
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add index.html
          git commit -m 'V8.2.2 preserve urge thought selections before draft save'
          git push origin v8.2.2-urge-diary
