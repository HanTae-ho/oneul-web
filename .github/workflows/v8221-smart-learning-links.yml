name: V8.2.21 SMART Learning Links

on:
  push:
    branches: [v8.2.21-user-wording-cleanup]
    paths:
      - 'v8221-smart-learning-links.py'
      - '.github/workflows/v8221-smart-learning-links.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.21-user-wording-cleanup
      - name: Apply SMART learning link patch
        run: python v8221-smart-learning-links.py
      - name: Verify Point 1-4 learning links
        run: |
          grep -q '"type": "smart-hov"' learning-data.js
          grep -q '"type": "smart-three-questions"' learning-data.js
          grep -q '"type": "smart-change-plan"' learning-data.js
          grep -q '"type": "smart-cba"' learning-data.js
          grep -q '"type": "smart-deads"' learning-data.js
          grep -q '"type": "smart-disarm"' learning-data.js
          grep -q '"type": "urge-diary"' learning-data.js
          grep -q '"type": "smart-abc"' learning-data.js
          grep -q '"type": "smart-dibs"' learning-data.js
          grep -q '"type": "smart-thinking-styles"' learning-data.js
          grep -q '"type": "smart-problem-solving"' learning-data.js
          grep -q '"type": "smart-balance-pie"' learning-data.js
          grep -q "if(type === 'smart-balance-pie')" index.html
          grep -q "if(type === 'smart-problem-solving')" index.html
          grep -q "if(type === 'smart-thinking-styles')" index.html
          grep -q "if(type === 'smart-dibs')" index.html
          ! grep -q '번역본' index.html
          git diff --check
      - name: Syntax sanity
        run: |
          node --check learning-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check sw.js
      - name: Verify invariants
        run: |
          grep -q "const DATA_SCHEMA = 6;" index.html
          grep -q "kind:'problem-solving'" index.html
          grep -q "kind:'lifestyle-balance-pie'" index.html
          grep -q 'notify-schedule' index.html
          grep -q 'treatment' index.html
      - name: Commit product file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-data.js
          git commit -m 'V8.2.21 connect SMART learning Points 3 and 4 to tools'
          git push
