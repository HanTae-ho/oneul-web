name: Publish V8.2.35 test release

on:
  push:
    branches: [android-v8.2.35-family-conversation]
    paths:
      - '.github/workflows/publish-v8235-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.35 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34074518296 -n oneul-v8.2.35-family-conversation-apk -D dist-apk
          gh run download 34074518296 -n oneul-v8.2.35-family-conversation-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.35.apk
          cp dist-aab/*.aab oneul-v8.2.35.aab
          test -s oneul-v8.2.35.apk
          test -s oneul-v8.2.35.aab
      - name: Publish V8.2.35 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.35-test --yes --cleanup-tag || true
          gh release create v8.2.35-test oneul-v8.2.35.apk oneul-v8.2.35.aab \
            --target android-v8.2.35-family-conversation \
            --title '오늘 한 걸음 V8.2.35 가족 대화 준비 테스트' \
            --notes '가족모드에 대화 준비 최소 실천도구를 추가했습니다. 가족 안내의 말할 때는 그 사람이 아니라 일에 대해 글과 중독 이해하기 상단 바로가기에서 들어갈 수 있습니다. 이야기할 상황 → 지금 말할 때인지 → 사실 → 내 느낌·필요 → 구체적인 부탁 → 실제로 말할 한 문장 순서로 정리하며, 취해 있거나 감정이 격하면 지금은 미루기, 폭력·위협·안전 우려가 있으면 안전 먼저를 선택하고 기존 가족 위기 안내로 연결합니다. 기록은 기존 S.smartWorks에 family-conversation / family로 저장되며 보기·수정·삭제가 가능합니다. 가족의 말이 상대의 재사용을 직접 일으키는 것처럼 읽히던 단정적 문구도 완화했습니다. DATA_SCHEMA 6, 기존 family-boundary 기록, 가족 충동·재발 비기록 원칙, SMART/12단계, Local-first, Android 이완 TTS, 화면 OFF 지속 재생, 속도 선택, 정확알림 엔진과 부팅 후 재예약은 모두 유지했습니다.' \
            --prerelease
