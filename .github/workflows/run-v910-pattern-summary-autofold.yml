name: Run V9.0.10 recovery guidance patch

on:
  push:
    branches: [v9.0.10-pattern-summary-autofold]
    paths:
      - '.github/workflows/run-v910-pattern-summary-autofold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.10-pattern-summary-autofold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          t=Path('.github/workflows/tmp-v910-pattern-summary-autofold.yml').read_text(encoding='utf-8')
          mark="          python3 - <<'PY'\n"
          start=t.index(mark)+len(mark)
          end=t.index("\n          PY",start)
          code=textwrap.dedent(t[start:end])
          exec(compile(code,'v910-patch.py','exec'))
          PY
      - name: Verify V9.0.10 web runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/index-all.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          node verify.js
          EXPECTED_APP_VERSION=V9.0.10 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "recovery-pattern-info" index.html
          grep -F "recovery-summary-info" index.html
          git diff --check
      - name: Commit verified patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js latest-release.json verify.js
          git commit -m 'V9.0.10 auto-fold recovery pattern and summary guidance'
          git push origin HEAD:v9.0.10-pattern-summary-autofold
