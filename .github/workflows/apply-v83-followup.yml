name: Apply V8.3 recovery pattern follow-up

on:
  push:
    branches: [feature-v8.3-recovery-patterns]
    paths:
      - '.github/workflows/apply-v83-followup.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v8.3-recovery-patterns
      - name: Apply follow-up
        run: python3 .github/v83_followup.py
      - name: Verify risk-hour and recovery-practice coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const BUILD='V8.3';" in s
          assert "const KEY = 'ohg.v1';" in s
          assert 'const DATA_SCHEMA = 6;' in s
          part=s.split('function recPattern(){',1)[1].split('function recStatCore(){',1)[0]
          assert '설정한 위험시간과 충동' in part
          assert 'S.hours' in part
          assert '회복 실천이 기록된 날' in part
          assert 'S.habits' in part
          assert 'fetch(' not in part and 'save()' not in part and 'localStorage' not in part
          scripts=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): scripts.append(m.group(2))
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('V8.3 follow-up invariants PASS')
          PY
          node --check /tmp/inline.js
          git diff --check
      - name: Commit follow-up
        run: |
          rm -f .github/v83_followup.py .github/workflows/apply-v83-followup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md .github
          git diff --cached --check
          git commit -m 'V8.3 위험시간·회복실천 패턴 보완'
          git push origin HEAD:feature-v8.3-recovery-patterns
