name: Apply V8.2.55 help FAQ fixed

on:
  push:
    branches: [v8.2.55-help-faq-2]
    paths:
      - '.github/workflows/v8255-help-faq-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.55-help-faq-2
      - name: Correct temporary patch marker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.tmp_v8255_help_faq.py')
          s=p.read_text(encoding='utf-8')
          old="""css_old = \"\"\"  .acc-b{display:none;padding:2px 16px 16px}\\n  .acc.on .acc-b{display:block}\\n  @media (prefers-reduced-motion:reduce){ .acc-v{transition:none} }\"\"\""""
          new="""css_old = \"\"\"  .acc-b{display:none;padding:2px 16px 16px}\\n  .acc.on .acc-b{display:block}\\n  .acc-b h3{margin:0 0 10px;font-size:15px;font-weight:600}\\n  @media (prefers-reduced-motion:reduce){ .acc-v{transition:none} }\"\"\""""
          assert old in s
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Apply exact help FAQ patch
        run: python .tmp_v8255_help_faq.py
      - name: Verify versions and protected storage constants
        run: |
          grep -F "const BUILD = 'V8.2.55';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const APP_VERSION = 'V8.2.55';" sw.js
          grep -F "const V = 'ohg-v8255-help-faq';" sw.js
          grep -F 'id="p-guide"' index.html
          grep -F '<b>지원 및 안내</b>' index.html
          test "$(grep -o '<details class="faq">' index.html | wc -l)" -ge 16
      - name: Check JavaScript syntax
        run: |
          node --check sw.js
          node --check learning-data.js
          node --check qa-data.js
          node --check screening-data.js
          node --check workbook-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', h, flags=re.S|re.I)
          paths=[]
          for i,code in enumerate(blocks):
              if code.strip():
                  p=Path(f'/tmp/oneul-inline-{i}.js'); p.write_text(code,encoding='utf-8'); paths.append(str(p))
          print('\n'.join(paths))
          PY
          for f in /tmp/oneul-inline-*.js; do node --check "$f"; done
      - name: Diff guard
        run: |
          git diff --check
          test "$(git diff --name-only | grep -Ev '^(README.md|index.html|sw.js|.tmp_v8255_help_faq.py)$' | wc -l)" -eq 0
      - name: Commit app changes only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -- .tmp_v8255_help_faq.py
          git add README.md index.html sw.js
          git commit -m 'V8.2.55 도움말 자주 묻는 질문 추가'
          git push
