name: Apply V8.1.7 Home Schedule Polish

on:
  push:
    branches: [v8.1.7-home-schedule-polish]
    paths:
      - 'v817-home-polish-patch.py'
      - '.github/workflows/v817-home-polish.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.7-home-schedule-polish
      - name: Apply V8.1.7 patch
        run: python3 v817-home-polish-patch.py
      - name: Verify home polish and JavaScript
        run: |
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          assert "const BUILD = 'V8.1.7'" in s
          assert "const medLabel=/약$/.test" in s
          assert "label:slot.l+' 약'" not in s
          assert "오늘 실천 '+completed+' / '+actionable+' 완료" in s
          assert "homeLimit=5" in s
          assert "id=\"home-today-more\"" in s
          assert "x.kind==='sleep'?'sleep'" in s
          assert "sleep: '<path" in s
          assert "homeTodayExpanded" in s
          sw=pathlib.Path('sw.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'V8.1.7'" in sw
          assert "const V = 'ohg-v817-home-polish'" in sw
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' not in attrs.lower(): scripts.append(body)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          git diff --check
      - name: Verify scope
        run: |
          CHANGED=$(git diff --name-only)
          printf '%s\n' "$CHANGED"
          test "$CHANGED" = $'index.html\nsw.js'
      - name: Commit V8.1.7 web files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.1.7 polish home schedule display'
          git push
