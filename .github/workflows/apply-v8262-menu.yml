name: Apply V8.2.62 menu patch

on:
  push:
    branches: [v8.2.62-me-menu-back]
    paths:
      - 'apply-v8262-menu.py'
      - '.github/workflows/apply-v8262-menu.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.62-me-menu-back
          fetch-depth: 0
      - name: Apply minimal menu and privacy-back patch
        run: python apply-v8262-menu.py
      - name: Check inline JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' not in attrs.lower(): scripts.append(body)
          Path('/tmp/oneul-inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/oneul-inline.js
      - name: Verify changed scope
        run: |
          git diff --check
          git diff -- index.html privacy.html sw.js README.md
          grep -F "const BUILD = 'V8.2.62';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const APP_VERSION = 'V8.2.62';" sw.js
          grep -F "ohg-v8262-me-menu-back" sw.js
          grep -F '← 이전 화면으로' privacy.html
      - name: Commit patched app files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html privacy.html sw.js README.md
          git commit -m 'V8.2.62 move support items to My page and fix privacy back'
          git push origin HEAD:v8.2.62-me-menu-back
