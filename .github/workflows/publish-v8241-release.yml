name: Publish V8.2.41 test release

on:
  push:
    branches: [android-v8.2.41-practice-history]
    paths:
      - '.github/workflows/publish-v8241-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.41 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34112152471 -n oneul-v8.2.41-practice-history-apk -D dist-apk
          gh run download 34112152471 -n oneul-v8.2.41-practice-history-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.41.apk
          cp dist-aab/*.aab oneul-v8.2.41.aab
          test -s oneul-v8.2.41.apk
          test -s oneul-v8.2.41.aab
          sha256sum oneul-v8.2.41.apk oneul-v8.2.41.aab
      - name: Publish V8.2.41 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.41-test --yes --cleanup-tag || true
          gh release create v8.2.41-test oneul-v8.2.41.apk oneul-v8.2.41.aab \
            --target android-v8.2.41-practice-history \
            --title '오늘 한 걸음 V8.2.41 내 발자취 실천기록 정리 테스트' \
            --notes '내 발자취 > 실천기록을 과거 저장기록 조회 중심으로 정리했습니다. 12단계 새 작성 버튼을 발자취에서 제거하고 전체·12단계·SMART·가족도구 필터를 추가했습니다. SMART 저장기록의 tool/kind 식별을 모두 지원해 ABC, DIBS, 변화 계획 등이 실천 기록으로 뭉뚱그려 표시되던 문제를 수정했으며 실제 도구명, 작성·수정 시각, 가능한 경우 1줄 미리보기를 보여줍니다. 12단계 저장기록은 해당 기록을 바로 엽니다. DATA_SCHEMA=6과 기존 저장자료 형식은 유지합니다. Android 네이티브 코드는 변경하지 않고 versionCode 861 / versionName 8.2.41만 적용했으며 정확알림·화면 OFF 알림·부팅 재예약·이완 TTS를 보존했습니다.' \
            --prerelease
