name: Build and publish V9.0.5 Android prerelease

on:
  push:
    branches: [android-v9.0.5-update-release]
    paths:
      - 'android-v9.0.5-update-release.sh'
      - '.github/workflows/build-android-v905-update-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify exact V9.0.5 web main sync
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "80251486adf7abf0ed4730fff8bd774a2105caed"
          for f in README.md SOCIAL_SETUP.md icon-180.png icon-192.png icon-32.png icon-512.png index.html install.html latest-release.json learning-data.js legal.html manifest.json music-audio-data.js native.html privacy.html qa-data.js screening-data.js social-apps-script.gs sw.js test.js verify.js workbook-data.js; do
            git show FETCH_HEAD:"$f" > /tmp/main-file
            cmp -s "$f" /tmp/main-file || { echo "main sync mismatch: $f"; exit 1; }
          done
          echo 'web main 80251486 sync PASS'

      - name: Verify V9.0.5 web and social invariants
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          n=Path('native.html').read_text(encoding='utf-8')
          nb=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',n,re.S)
          Path('/tmp/native.js').write_text('\n'.join(nb),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/native.js
          node --check /tmp/social.js
          node --check sw.js
          node --check verify.js
          node --check test.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          grep -F "const BUILD='V9.0.5';" index.html
          grep -F "const APP_VERSION = 'V9.0.5';" sw.js
          grep -F "const V = 'ohg-v905-update-flow-r1';" sw.js
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.4-social-1';" social-apps-script.gs
          grep -F 'id="social-leave-confirm"' index.html
          ! grep -F 'social-leave-next' index.html
          ! grep -F 'social-leave-word' index.html
          grep -F '>초심 보기</button>' index.html
          grep -F 'id="me-package-update"' index.html
          grep -F 'latest-release.json' index.html
          grep -F 'ohg.native.version' native.html
          grep -F '"version": "V9.0.4"' latest-release.json
          node verify.js

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.5 package revision
        run: bash android-v9.0.5-update-release.sh

      - name: Verify preserved reminder and TTS engines
        run: |
          set -euo pipefail
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          ACT="$PKG/NotificationSettingsActivity.java"
          grep -F 'ReminderStore.importSchedule(this, "", "", "", "", val(u, "build"))' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, "")' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, "", "", TreatmentReminderStore.time(this), 0)' "$ACT"
          grep -F 'String visitAlerts = TreatmentReminderStore.alertsPacked(this)' "$ACT"
          grep -F 'String visitTime = TreatmentReminderStore.time(this)' "$ACT"
          grep -F 'ReminderStore.importSchedule(this, pendingRisk, pendingMeds, pendingEats, pendingBed, pendingBuild)' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, pendingHabits)' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, pendingVisit, visitAlerts, visitTime, pendingVisitInterval)' "$ACT"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify APK version permissions package and native marker
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='900' versionName='9.0.5'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          grep -R -Fq 'https://hantae-ho.github.io/oneul-web/native.html?appv=9.0.5' android-v8/app/src/main
          cp "$APK" oneul-v9.0.5.apk
          cp "$AAB" oneul-v9.0.5.aab
          sha256sum oneul-v9.0.5.apk oneul-v9.0.5.aab | tee SHA256SUMS.txt

      - name: Upload release files artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.5-release-files
          path: |
            oneul-v9.0.5.apk
            oneul-v9.0.5.aab
            SHA256SUMS.txt

      - name: Publish V9.0.5 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v9.0.5-test --yes --cleanup-tag || true
          gh release create v9.0.5-test oneul-v9.0.5.apk oneul-v9.0.5.aab SHA256SUMS.txt \
            --target android-v9.0.5-update-release \
            --title '오늘 한 걸음 V9.0.5 테스트 릴리즈' \
            --notes 'V9.0.5 테스트 릴리즈입니다. 소셜 탈퇴는 안내를 한 번 확인한 뒤 소셜 탈퇴 버튼을 누르면 바로 처리되도록 단순화했고, 기존 V9.0.4-social-1 서버의 탈퇴 닉네임 30일 보호는 그대로 유지합니다. 지금 위험해요 → 충동의 미래의 나에게 바로보기 문구는 초심 보기로 단순화했습니다. 나 → 설정 → 앱에서는 APK 업데이트와 화면·콘텐츠 캐시 새로고침을 분리했으며, Android 설치 버전과 latest-release.json의 최신 배포 버전을 비교해 새 APK가 있을 때만 최신 버전 받기를 표시합니다. Android는 기존 검증된 네이티브 알림/TTS 스택을 변경하지 않고 versionCode 900 / versionName 9.0.5만 적용하며 정확알림, 화면 OFF 알림, 부팅 후 재예약, 복약·외래·생활·습관 알림, silent reminder apply/clear, 마음프로 네이티브 음성, 이완 TTS 엔진을 빌드에서 정적 검증합니다. DATA_SCHEMA=6, ohg.v1, ohg.social.v1은 유지합니다. 웹 main SHA: 80251486adf7abf0ed4730fff8bd774a2105caed. 실기기 최종 확인 전이므로 prerelease를 유지합니다.' \
            --prerelease

      - name: Point main to latest Android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/latest-release.json <<'EOF'
          {
            "version": "V9.0.5",
            "versionCode": 900,
            "apk": "https://github.com/HanTae-ho/oneul-web/releases/download/v9.0.5-test/oneul-v9.0.5.apk",
            "release": "https://github.com/HanTae-ho/oneul-web/releases/tag/v9.0.5-test"
          }
          EOF
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/contents/latest-release.json?ref=main" --jq .sha)
          CONTENT=$(base64 -w0 /tmp/latest-release.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/latest-release.json" \
            -f message='Point latest Android release to V9.0.5' \
            -f content="$CONTENT" -f sha="$SHA" -f branch='main'
          gh api "repos/$GITHUB_REPOSITORY/contents/latest-release.json?ref=main" --jq .content | tr -d '\n' | base64 -d | tee /tmp/main-latest.json
          grep -F '"version": "V9.0.5"' /tmp/main-latest.json
          grep -F '"versionCode": 900' /tmp/main-latest.json
