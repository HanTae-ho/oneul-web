name: Patch V9.0.8 social UI

on:
  push:
    branches: [v9.0.8-social-ui]
    paths:
      - '.github/workflows/patch-v908-social.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.8-social-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover reviewed patch from original commit
        run: |
          set -euo pipefail
          git show c9f409b4a4872587427f3ef790a1402e63a5493e:.github/workflows/patch-v908-social.yml > /tmp/original-v908.yml
          python3 - <<'PY'
          from pathlib import Path
          src=Path('/tmp/original-v908.yml').read_text(encoding='utf-8')
          def body(name):
              marker='      - name: '+name+'\n'
              i=src.index(marker)
              r=src.index('        run: |\n',i)+len('        run: |\n')
              n=src.find('\n      - name: ',r)
              if n<0: n=len(src)
              lines=src[r:n].splitlines()
              return '\n'.join((x[10:] if x.startswith('          ') else x) for x in lines)+'\n'
          b64=''
          for line in src.splitlines():
              if line.strip().startswith('SOCIAL_GZ_B64:'):
                  b64=line.split(':',1)[1].strip();break
          if not b64: raise SystemExit('embedded social GS payload not found')
          apply=body('Apply minimal social patch')
          for name in ['socialRefresh','socialSupport','socialComments','socialCommentSubmit','socialCommentDelete']:
              old="s=replace_func(s,'"+name+"',\"\"\"async function "+name
              new="s=replace_func(s,'"+name+"',\"\"\"function "+name
              if old not in apply: raise SystemExit('async patch target missing: '+name)
              apply=apply.replace(old,new,1)
          Path('/tmp/social-gs.b64').write_text(b64,encoding='utf-8')
          Path('/tmp/apply-v908.sh').write_text(apply,encoding='utf-8')
          Path('/tmp/verify-v908.sh').write_text(body('Verify patched sources'),encoding='utf-8')
          PY
          export SOCIAL_GZ_B64="$(cat /tmp/social-gs.b64)"
          bash /tmp/apply-v908.sh
          python3 - <<'PY'
          from pathlib import Path
          p=Path('verify.js');s=p.read_text(encoding='utf-8')
          old='if(!index.includes("const BUILD=\'V9.0.7\';")) throw new Error(\'V9.0.6 BUILD 불일치\');'
          new='if(!index.includes("const BUILD=\'V9.0.8\';")) throw new Error(\'V9.0.8 BUILD 불일치\');'
          if old not in s: raise SystemExit('fixed BUILD regression target not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          bash /tmp/verify-v908.sh
      - name: Commit verified sources
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js latest-release.json social-apps-script.gs verify.js
          git diff --cached --check
          git commit -m '[v908-social-patched] Improve social response and counters'
          git push origin HEAD:v9.0.8-social-ui
