name: Patch V9.0.8 social UI

on:
  push:
    branches: [v9.0.8-social-ui]
    paths:
      - '.github/workflows/patch-v908-social.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[v908-social-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.8-social-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply minimal social patch
        env:
          SOCIAL_GZ_B64: 
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,base64,gzip,json

          def replace_once(s, old, new, label):
              if old not in s: raise SystemExit('missing '+label)
              if s.count(old)!=1: raise SystemExit('non-unique '+label+': '+str(s.count(old)))
              return s.replace(old,new,1)

          def replace_func(s,name,new):
              sig='function '+name+'('
              i=s.find(sig)
              if i<0: raise SystemExit('missing function '+name)
              b=s.find('{',i)
              depth=0; quote=None; esc=False; j=b
              while j<len(s):
                  c=s[j]
                  if esc: esc=False
                  elif quote:
                      if c=='\\': esc=True
                      elif c==quote: quote=None
                  else:
                      if c in "'\"`": quote=c
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return s[:i]+new+s[j+1:]
                  j+=1
              raise SystemExit('unterminated function '+name)

          # Exact user-supplied V9.0.7-social-1 server file, gzip+base64 encoded.
          Path('social-apps-script.gs').write_bytes(gzip.decompress(base64.b64decode(os.environ['SOCIAL_GZ_B64'])))

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=replace_once(s,"const BUILD='V9.0.7';","const BUILD='V9.0.8';",'BUILD')
          old_css='.social-comments-head{margin-bottom:10px}.social-comments-post{padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin-bottom:11px}'
          new_css='.social-comments-head{margin-bottom:10px}.social-comments-post{padding:11px 12px;border:2px solid var(--acc2);border-radius:12px;background:var(--accbg);margin-bottom:13px;box-shadow:0 1px 0 #00000008}.social-comments-label{display:inline-block;margin-bottom:5px;padding:2px 7px;border-radius:999px;background:var(--panel);border:1px solid var(--acc2);color:var(--acc);font-size:10.5px;font-weight:700;line-height:1.4}'
          s=replace_once(s,old_css,new_css,'comment original-post visual')

          anchor="let socialState={sort:'latest',items:[],loading:false,loaded:false,error:'',registering:false};"
          helpers="""let socialState={sort:'latest',items:[],loading:false,loaded:false,error:'',registering:false};
const SOCIAL_FEED_CACHE_KEY='ohg.social.feed.v1';
function socialFeedCacheLoad(sort){
  try{
    const p=SO.profile;if(!p)return [];
    const raw=localStorage.getItem(SOCIAL_FEED_CACHE_KEY);if(!raw)return [];
    const c=JSON.parse(raw);if(!c||String(c.userId)!==String(p.userId))return [];
    const slot=c.bySort&&c.bySort[sort];return slot&&Array.isArray(slot.items)?slot.items:[];
  }catch(_){return [];}
}
function socialFeedCacheSave(sort,items){
  try{
    const p=SO.profile;if(!p)return;
    let c={userId:p.userId,bySort:{}};
    const raw=localStorage.getItem(SOCIAL_FEED_CACHE_KEY);
    if(raw){try{const old=JSON.parse(raw);if(old&&String(old.userId)===String(p.userId)&&old.bySort)c=old;}catch(_){} }
    c.userId=p.userId;c.bySort=c.bySort||{};c.bySort[sort]={t:Date.now(),items:(Array.isArray(items)?items:[]).slice(0,60)};
    localStorage.setItem(SOCIAL_FEED_CACHE_KEY,JSON.stringify(c));
  }catch(_){}
}
function socialFeedCacheClear(){try{localStorage.removeItem(SOCIAL_FEED_CACHE_KEY);}catch(_){}}
"""
          s=replace_once(s,anchor,helpers,'social feed cache helpers')

          s=replace_func(s,'socialRefresh',"""async function socialRefresh(force,quiet){
  if(!SO.profile||socialState.loading) return;
  const endpoint=socialEndpoint();
  if(!endpoint){ socialState.error=''; socialState.items=[]; socialState.loaded=true; drawSocial(); return; }
  if(!socialState.items.length){
    const cached=socialFeedCacheLoad(socialState.sort);
    if(cached.length){socialState.items=cached;socialState.loaded=true;socialState.cacheShown=true;drawSocial();}
  }
  socialState.loading=true;if(!quiet)socialState.error='';if(force&&!socialState.items.length)socialState.loaded=false;drawSocial();
  try{
    if(SO.profile&&SO.profile.registeredUrl===endpoint){
      const pair=await Promise.all([socialRegister(),socialReadFeed()]);socialState.items=pair[1];
    }else{
      await socialRegister();socialState.items=await socialReadFeed();
    }
    socialState.loaded=true;socialState.cacheShown=false;socialFeedCacheSave(socialState.sort,socialState.items);
  }catch(e){if(!quiet)socialState.error=socialApiMessage(e);socialState.loaded=true;}
  finally{socialState.loading=false;drawSocial();}
}""")

          s=replace_once(s,"if(socialState.loading) html+='<div class=\"social-status cen\">새 글을 확인하는 중입니다.</div>';","if(socialState.loading) html+='<div class=\"social-status cen\">'+(socialState.cacheShown?'마지막 글을 먼저 보여드렸습니다 · 새 글 확인 중':'새 글을 확인하는 중입니다.')+'</div>';",'cached feed status')

          s=replace_func(s,'socialSupport',"""async function socialSupport(id){
  const x=socialFind(id);if(!x||x.mine)return;
  const was=!!x.supported,oldCount=Number(x.supportCount||0);x.supported=!was;x.supportCount=Math.max(0,oldCount+(x.supported?1:-1));drawSocial();socialFeedCacheSave(socialState.sort,socialState.items);
  try{
    const r=await socialWrite('supportToggle',Object.assign({},socialAuth(),{postId:id}));
    x.supported=!!r.supported;x.supportCount=Number(r.supportCount||0);drawSocial();socialFeedCacheSave(socialState.sort,socialState.items);
  }catch(e){x.supported=was;x.supportCount=oldCount;drawSocial();socialFeedCacheSave(socialState.sort,socialState.items);toast(socialApiMessage(e));}
}""")

          s=replace_func(s,'socialCommentHtml',"""function socialCommentHtml(c){
  const mine=!!c.mine||!!(SO.profile&&String(c.userId)===String(SO.profile.userId));
  return '<div class=\"social-comment\"><span class=\"social-avatar\" style=\"width:30px;height:30px;font-size:12px\">'+socialInitial(c.nickname)+'</span><div class=\"social-comment-main\"><div class=\"social-comment-head\"><b>'+esc(c.nickname||'익명')+'</b><span>'+esc(socialTime(c.createdAt))+'</span>'+(mine?'<span>· 내 댓글</span>':'')+(c.pending?'<span>· 보내는 중</span>':'')+'<button class=\"social-comment-more\" type=\"button\" data-social-comment-menu=\"'+esc(c.id)+'\" aria-label=\"댓글 메뉴\">'+socialSvg('more')+'</button></div><div class=\"social-comment-text\">'+esc(c.text||'')+'</div></div></div>';
}""")

          s=replace_func(s,'socialComments',"""async function socialComments(postId){
  const x=socialFind(postId);if(!x)return;
  socialCommentState={postId:String(postId),items:[],loading:true,error:''};
  modal('<h2>댓글</h2><div class=\"social-comments-post\"><span class=\"social-comments-label\">원글</span><b>'+esc(x.nickname||'익명')+'</b><p>'+esc(x.text||'')+'</p></div><div id=\"social-comment-list\"><div class=\"empty\">댓글을 불러오는 중입니다.</div></div><div class=\"social-comment-compose\"><textarea id=\"social-comment-text\" maxlength=\"300\" rows=\"3\" placeholder=\"회복을 돕는 말을 남겨보세요.\"></textarea><div class=\"social-char\" id=\"social-comment-char\">0 / 300</div><button class=\"btn\" id=\"social-comment-send\">댓글 남기기</button><button class=\"btn ghost\" onclick=\"closeModal()\" style=\"margin-top:8px\">닫기</button></div>');
  const ta=$('#social-comment-text'),ch=$('#social-comment-char');if(ta)ta.oninput=()=>ch.textContent=ta.value.length+' / 300';
  const send=$('#social-comment-send');if(send){send.disabled=true;send.onclick=()=>socialCommentSubmit(postId,String(ta&&ta.value||'').trim(),false);}
  await socialCommentsRefresh(postId);if(send)send.disabled=false;
}""")

          s=replace_func(s,'socialCommentSubmit',"""async function socialCommentSubmit(postId,text,confirmed){
  if(!text||text.length>300){toast('댓글은 1~300자로 작성해주세요.');return;}
  if(socialCrisisText(text)&&!confirmed){
    modal('<h2>지금 안전이 먼저입니다</h2><div class=\"note b\">댓글에 죽고 싶은 마음과 관련된 표현이 있습니다. 지금 당장 위험하다면 댓글의 답을 기다리지 말고 <b>109</b>, <b>112</b>, <b>119</b> 또는 가까운 응급의료기관에 바로 연결하세요.</div><a class=\"btn danger\" href=\"tel:109\">109 자살예방상담전화</a><button class=\"btn sec\" id=\"social-comment-crisis-help\" style=\"margin-top:8px\">지금 위험해요 열기</button><button class=\"btn ghost\" id=\"social-comment-crisis-send\" style=\"margin-top:8px\">그래도 댓글 남기기</button><button class=\"btn ghost\" onclick=\"closeModal()\" style=\"margin-top:8px\">그만두기</button>');
    $('#social-comment-crisis-help').onclick=()=>{closeModal();go('panic');};
    $('#social-comment-crisis-send').onclick=()=>socialCommentSubmit(postId,text,true);return;
  }
  const a=socialAuth(),x=socialFind(postId),oldCount=x?Number(x.commentCount||0):0,localId='local_'+Date.now();
  const local={id:localId,postId:String(postId),userId:a.userId,nickname:(SO.profile&&SO.profile.nickname)||'익명',text:text,createdAt:Date.now(),updatedAt:Date.now(),mine:true,pending:true};
  socialCommentState.items.push(local);if(x)x.commentCount=oldCount+1;
  const ta=$('#social-comment-text'),ch=$('#social-comment-char'),send=$('#social-comment-send');if(ta)ta.value='';if(ch)ch.textContent='0 / 300';if(send){send.disabled=true;send.textContent='남기는 중…';}
  socialCommentState.loading=false;socialCommentState.error='';socialRenderComments();drawSocial();socialFeedCacheSave(socialState.sort,socialState.items);
  try{
    const r=await socialWrite('commentCreate',Object.assign({},a,{postId:postId,text:text}));
    local.id=r.id||local.id;local.pending=false;if(x)x.commentCount=Number(r.commentCount!=null?r.commentCount:oldCount+1);
    socialProfileState.data=null;if(send){send.disabled=false;send.textContent='댓글 남기기';}socialRenderComments();drawSocial();socialFeedCacheSave(socialState.sort,socialState.items);toast('댓글을 남겼습니다.');setTimeout(()=>socialCommentsRefresh(postId,true),250);
  }catch(e){
    socialCommentState.items=socialCommentState.items.filter(c=>c!==local&&String(c.id)!==localId);if(x)x.commentCount=oldCount;if(ta)ta.value=text;if(ch)ch.textContent=text.length+' / 300';if(send){send.disabled=false;send.textContent='댓글 남기기';}socialRenderComments();drawSocial();socialFeedCacheSave(socialState.sort,socialState.items);toast(socialCommentApiMessage(e));
  }
}""")

          s=replace_func(s,'socialCommentDelete',"""async function socialCommentDelete(c){
  const postId=socialCommentState.postId;
  try{const r=await socialWrite('commentDelete',Object.assign({},socialAuth(),{commentId:c.id}));const x=socialFind(postId);if(x)x.commentCount=Number(r.commentCount!=null?r.commentCount:Math.max(0,Number(x.commentCount||1)-1));socialProfileState.data=null;socialFeedCacheSave(socialState.sort,socialState.items);toast('댓글을 삭제했습니다.');await socialComments(postId);}catch(e){toast(socialCommentApiMessage(e));}
}""")

          s=replace_once(s,"const x=socialFind(postId); if(x)x.commentCount=Number(r.commentCount||socialCommentState.items.length);\n    socialRenderComments(); drawSocial();","const x=socialFind(postId); if(x)x.commentCount=Number(r.commentCount!=null?r.commentCount:socialCommentState.items.length);\n    socialRenderComments(); drawSocial(); socialFeedCacheSave(socialState.sort,socialState.items);",'comment refresh cache')
          s=replace_once(s,"SO=socialBlank();socialSave();socialResetFeed();socialProfileState={tab:'posts',loading:false,data:null,error:''};","SO=socialBlank();socialSave();socialFeedCacheClear();socialResetFeed();socialProfileState={tab:'posts',loading:false,data:null,error:''};",'leave clears social feed cache')
          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js').read_text(encoding='utf-8')
          sw=replace_once(sw,"const APP_VERSION = 'V9.0.7';","const APP_VERSION = 'V9.0.8';",'sw APP_VERSION')
          sw=replace_once(sw,"const V = 'ohg-v907-version-parser-r1';","const V = 'ohg-v908-social-ui-r1';",'sw cache')
          Path('sw.js').write_text(sw,encoding='utf-8')

          Path('latest-release.json').write_text(json.dumps({
            'version':'V9.0.8','versionCode':903,
            'apk':'https://github.com/HanTae-ho/oneul-web/releases/download/v9.0.8-test/oneul-v9.0.8.apk',
            'release':'https://github.com/HanTae-ho/oneul-web/releases/tag/v9.0.8-test'
          },ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          v=Path('verify.js').read_text(encoding='utf-8')
          anchor="ok(/NICK_COOLDOWN/.test(index)&&/NICK_COOLDOWN/.test(read('social-apps-script.gs')),'앱·서버 닉네임 보호 오류 계약 일치');"
          extra=anchor+"\nok(/SOCIAL_FEED_CACHE_KEY='ohg\\.social\\.feed\\.v1'/.test(index)&&/function socialFeedCacheLoad\\(sort\\)/.test(index)&&/function socialFeedCacheSave\\(sort,items\\)/.test(index),'소셜 피드 기기 캐시 선표시');\nok(/social-comments-label/.test(index)&&/border:2px solid var\\(--acc2\\)/.test(index),'댓글 화면 원글 시각 구분');\nok(/pending:true/.test(index)&&/남기는 중/.test(index)&&/socialProfileState\\.data=null/.test(index),'댓글 optimistic UI 및 프로필 캐시 무효화');\nok(/AUTH_CACHE_SECONDS\\s*=\\s*120/.test(read('social-apps-script.gs'))&&/FEED_TAIL_ROWS\\s*=\\s*400/.test(read('social-apps-script.gs'))&&/SUPPORT_CACHE_SECONDS\\s*=\\s*600/.test(read('social-apps-script.gs')),'소셜 서버 V9.0.7 캐시/끝행 최적화');\nok(/function authCacheKey_\\(/.test(read('social-apps-script.gs'))&&/function commentCounts_\\(/.test(read('social-apps-script.gs'))&&/function profileActivity_\\(b\\)/.test(read('social-apps-script.gs')),'소셜 서버 인증·댓글수·프로필 캐시 경로');"
          v=replace_once(v,anchor,extra,'verify social checks')
          Path('verify.js').write_text(v,encoding='utf-8')
          PY
      - name: Verify patched sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          node verify.js
          EXPECTED_APP_VERSION=V9.0.8 node release-version-check.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';" social-apps-script.gs
          git diff --check
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js latest-release.json social-apps-script.gs verify.js
          git commit -m '[v908-social-patched] Improve social response and counters'
          git push origin HEAD:v9.0.8-social-ui
