name: V8.2.11 SMART Tools Hub

on:
  push:
    branches: [v8.2.11-smart-tools-hub]
    paths:
      - 'v8211-smart-tools-hub.py'
      - '.github/workflows/v8211-smart-tools-hub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.11-smart-tools-hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SMART tools hub patch
        run: python v8211-smart-tools-hub.py
      - name: Verify product changes
        run: |
          grep -q "const BUILD = 'V8.2.11'" index.html
          grep -q 'id="tool-smart-tools"' index.html
          grep -q 'id="p-smart-tools"' index.html
          grep -q 'function drawSmartTools' index.html
          grep -q 'SMART Recovery 설명 보기' index.html
          grep -q 'SMART 실천도구 열기' index.html
          grep -q "p === 'smart-tools'" index.html
          grep -q "appBack('smart-tools')" index.html
          grep -q 'Point 1 · 동기 부여 및 유지' index.html
          grep -q 'Point 2 · 충동에 대처하기' index.html
          grep -q 'Point 3 · 생각·감정·행동 관리하기' index.html
          grep -q 'Point 4 · 균형 잡힌 삶 살기' index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q "const APP_VERSION = 'V8.2.11'" sw.js
          grep -q "ohg-v8211-smart-tools-hub" sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.11 add SMART practice tools hub' || true
          git push
