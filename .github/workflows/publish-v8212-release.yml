name: Publish V8.2.12 test release

on:
  push:
    branches: [android-v8.2.12-capsule-disarm-link]
    paths:
      - '.github/workflows/publish-v8212-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.12 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34002065488 -n oneul-v8.2.12-capsule-disarm-link-apk -D dist-apk
          gh run download 34002065488 -n oneul-v8.2.12-capsule-disarm-link-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.12.apk
          cp dist-aab/*.aab oneul-v8.2.12.aab
          test -s oneul-v8.2.12.apk
          test -s oneul-v8.2.12.aab
      - name: Publish V8.2.12 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.12-test --yes --cleanup-tag || true
          gh release create v8.2.12-test oneul-v8.2.12.apk oneul-v8.2.12.aab \
            --target android-v8.2.12-capsule-disarm-link \
            --title '오늘 한 걸음 V8.2.12 미래의 나에게 ↔ DISARM 테스트' \
            --notes '미래의 나에게와 SMART Recovery DISARM을 양방향으로 연결했습니다. DISARM 화면에서는 저장된 초심 메시지가 있으면 초심 다시 보기, 없으면 미래의 나에게 남기기로 연결됩니다. 저장된 미래 메시지에서는 이 초심으로 DISARM 해보기를 통해 충동의 목소리와 내 선택을 분리하는 실천으로 이어갈 수 있습니다. DISARM에서 들어온 경우 메시지 저장·삭제 후에도 뒤로가기가 DISARM으로 돌아가도록 진입경로를 유지합니다. 위기 도움의 초심 다시 보기 화면은 기존처럼 읽기 중심으로 유지하여 교차링크를 숨기며, 가족모드에도 해당 연결을 노출하지 않습니다. 기존 timeCapsule·SMART 기록 구조, 충동일기, 12단계 및 Android 습관·생활·치료·외래 예약알림 엔진은 변경하지 않았고 DATA_SCHEMA는 6을 유지합니다.' \
            --prerelease
