name: Validate V8.2.69 release files

on:
  push:
    branches: [fix-v8.2.69-me-menu-cleanup]
    paths:
      - '.github/workflows/finalize-v8269-ui-smart.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check core invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert re.search(r"const\s+BUILD\s*=\s*['\"]V8\.2\.69['\"]",s)
          assert re.search(r"const\s+DATA_SCHEMA\s*=\s*6\b",s)
          assert re.search(r"const\s+KEY\s*=\s*['\"]ohg\.v1['\"]",s)
          assert 'nativeReminderIntent({apply:1})' in s
          assert 'nativeReminderIntent({clear:1})' in s
          assert './music-audio-data.js' in s
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert "const APP_VERSION = 'V8.2.69';" in sw
          assert "const V = 'ohg-v8269-me-smart';" in sw
          PY
      - name: Check user menu and SMART
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<section class="pg" id="p-my">'); b=s.index('</section>',a); sec=s[a:b]
          assert '<b>관리자</b>' not in sec
          assert sec.index('<b>내 발자취</b>') < sec.index('<b>내 정보 · 설정</b>') < sec.index('<b>지원 및 안내</b>') < sec.index('<b>앱에 바라는 점</b>')
          assert 'aria-expanded="false" onclick="reclaimToggle(this)"' in s
          assert 'function reclaimToggle(btn)' in s
          assert '한국 SMART Recovery' in s
          assert 'CBT 접근과 자기관리 기술을 활용하는 회복 자조모임' in s
          assert "w:'https://smartkr.org/'" in s
          assert '<section class="pg" id="p-admin">' in s
          PY
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          assert scripts
          for i,js in enumerate(scripts): Path(f'/tmp/inline-{i}.js').write_text(js,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          node --check music-audio-data.js
      - name: Check release-file whitespace
        run: git diff --check origin/main...HEAD -- index.html sw.js privacy.html legal.html README.md
