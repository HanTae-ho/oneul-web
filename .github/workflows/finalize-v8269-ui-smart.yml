name: Finalize V8.2.69 UI and SMART

on:
  push:
    branches: [fix-v8.2.69-me-menu-cleanup]
    paths:
      - '.github/workflows/finalize-v8269-ui-smart.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply minimal V8.2.69 web changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Version only; data schema/storage stay untouched.
          assert s.count("const BUILD='V8.2.68'")==1, 'BUILD anchor'
          s=s.replace("const BUILD='V8.2.68'", "const BUILD='V8.2.69'", 1)

          # SMART Recovery: use the existing two-line official-organization card renderer.
          na="""  {n:'NA 익명의 약물중독자들', d:'약물 · 지역별 모임 일정',\n   w:'https://nakr.org/'},\n"""
          smart="""  {n:'NA 익명의 약물중독자들', d:'약물 · 지역별 모임 일정',\n   w:'https://nakr.org/'},\n  {n:'한국 SMART Recovery', d:'CBT 접근과 자기관리 기술을 활용하는 회복 자조모임',\n   w:'https://smartkr.org/'},\n"""
          assert s.count(na)==1, 'GROUPS NA anchor'
          s=s.replace(na,smart,1)

          # Reclaimed summary becomes a closed accordion. Existing calculations/cards stay unchanged.
          css="  .reclaim-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:14px}\n"
          css_new=css+"  .reclaim-acc .acc-b{padding:2px 12px 12px}\n  .reclaim-acc .reclaim-wrap{border:0;margin:0;padding:0}\n"
          assert s.count(css)==1, 'reclaim CSS anchor'
          s=s.replace(css,css_new,1)

          helper="""function reclaimToggle(btn){
  const acc=btn&&btn.closest?btn.closest('.acc'):null;
  if(!acc) return;
  const open=!acc.classList.contains('on');
  acc.classList.toggle('on',open);
  btn.setAttribute('aria-expanded',open?'true':'false');
}
"""
          anchor='function drawReclaim(){'
          assert s.count(anchor)==1, 'drawReclaim anchor'
          s=s.replace(anchor,helper+anchor,1)

          f0=s.index('function drawReclaim(){')
          f1=s.index('function openReclaimSettings(){',f0)
          chunk=s[f0:f1]
          a0=chunk.index('  box.innerHTML=')
          a1=chunk.index("  const b=$('#rec-reclaim-settings')",a0)
          new_assign="""  const reclaimSummary=(type?('회복 '+dayValue):'회복일 설정 필요')+' · 회복 실천 '+habits+'회';
  box.innerHTML='<div class=\"acc reclaim-acc\"><button class=\"acc-h\" type=\"button\" aria-expanded=\"false\" onclick=\"reclaimToggle(this)\"><span class=\"acc-n\"><b>내가 되찾은 것</b><span>'+esc(reclaimSummary)+' · 눌러서 자세히 보기</span></span><svg class=\"acc-v\" viewBox=\"0 0 24 24\"><path d=\"M6.5 9.5l5.5 5.5 5.5-5.5\"/></svg></button><div class=\"acc-b\"><div class=\"reclaim-wrap\"><div class=\"reclaim-head\"><div><b>회복하면서 되찾은 것</b><span>손실이 아니라 회복하면서 내 삶에 다시 남은 것을 봅니다.</span></div><button type=\"button\" class=\"reclaim-set\" id=\"rec-reclaim-settings\">기준 설정</button></div><div class=\"reclaim-grid\">'+
    card('cal','회복일',dayValue,dayDesc,'',!type)+
    card('clock','되찾은 시간',timeValue,timeDesc,'',!timeReady)+
    card('wallet','지킨 비용',costValue,costDesc,'',gambling||!costReady)+
    card('sprout','회복 실천',habits+'회','내가 실천하고 기록한 회복 행동','habit',false)+
    '</div></div></div></div>';
"""
          chunk=chunk[:a0]+new_assign+chunk[a1:]
          s=s[:f0]+chunk+s[f1:]

          # Remove only the visible admin accordion from the general-user '나' page and reorder support/feedback.
          sec0=s.index('<section class="pg" id="p-my">')
          sec1=s.index('</section>',sec0)+len('</section>')
          sec=s[sec0:sec1]

          def acc_block(text,label):
              target=text.index('<b>'+label+'</b>')
              start=text.rfind('<div class="acc">',0,target)
              assert start>=0, label+' accordion start'
              token=re.compile(r'<div\b[^>]*>|</div>')
              depth=0
              end=None
              for m in token.finditer(text,start):
                  if m.group(0).startswith('</div'):
                      depth-=1
                      if depth==0:
                          end=m.end(); break
                  else:
                      depth+=1
              assert end is not None, label+' accordion end'
              return start,end,text[start:end]

          fs,fe,feedback=acc_block(sec,'앱에 바라는 점')
          ss,se,support=acc_block(sec,'지원 및 안내')
          ads,ade,admin=acc_block(sec,'관리자')
          blocks=sorted([(fs,fe),(ss,se),(ads,ade)],reverse=True)
          base=sec
          for a,b in blocks:
              base=base[:a]+base[b:]
          insert=base.rfind('</section>')
          sec_new=base[:insert].rstrip()+"\n\n"+support+"\n\n"+feedback+"\n"+base[insert:]
          s=s[:sec0]+sec_new+s[sec1:]

          # drawAdmin remains for the dormant admin page but must tolerate the removed user card.
          old="""function drawAdmin(){
  const b = $('#me-admin'); b.innerHTML = '';
  $('#tab-admin').classList.add('hide');
"""
          new="""function drawAdmin(){
  const b = $('#me-admin');
  $('#tab-admin').classList.add('hide');
  if(!b) return;
  b.innerHTML = '';
"""
          assert s.count(old)==1, 'drawAdmin null-safety anchor'
          s=s.replace(old,new,1)

          # Keep comments/documentation aligned with the simplified user navigation.
          s=s.replace('/* 관리자 화면은 내 정보에서만 엽니다. 하단 탭에는 표시하지 않습니다. */',
                      '/* 관리자 엔진은 유지하지만 일반 사용자 메뉴와 하단 탭에는 표시하지 않습니다. */',1)

          old="""<p style="margin-top:8px">당사자 모드의 <b>나</b> 화면에는 위에서부터 <b>내가 되찾은 것 → 내 발자취 → 내 정보 · 설정 → 앱에 바라는 점 → 지원 및 안내 → 관리자</b>가 배치됩니다. 가족·보호자 모드에서는 당사자의 회복성과를 대신 계산하지 않도록 <b>내가 되찾은 것</b>은 표시하지 않습니다.</p>
      <p style="margin-top:8px">관리자는 일반 사용 기능과 분리되어 있으며 기존 관리자 접근 방식은 그대로 유지됩니다.</p>"""
          new="""<p style="margin-top:8px">당사자 모드의 <b>나</b> 화면에는 위에서부터 <b>내가 되찾은 것 → 내 발자취 → 내 정보 · 설정 → 지원 및 안내 → 앱에 바라는 점</b>이 배치됩니다. <b>내가 되찾은 것</b>은 기본적으로 접혀 있어 내 발자취와 설정이 바로 보이며, 필요할 때 눌러 자세히 펼칩니다. 가족·보호자 모드에서는 당사자의 회복성과를 대신 계산하지 않도록 표시하지 않습니다.</p>"""
          assert s.count(old)==1, 'manual menu structure anchor'
          s=s.replace(old,new,1)

          old="""<p style="margin-top:8px"><b>앱에 바라는 점 · 지원 및 안내 · 관리자</b>는 <b>내 정보 · 설정</b> 안이 아니라 <b>나</b> 화면에서 바로 이용합니다. 관리자 기능의 기존 접근 방식은 그대로 유지됩니다.</p>"""
          new="""<p style="margin-top:8px"><b>지원 및 안내</b>와 <b>앱에 바라는 점</b>은 <b>내 정보 · 설정</b> 안이 아니라 <b>나</b> 화면에서 바로 이용하며, 앱에 바라는 점은 지원 및 안내 아래에 배치됩니다.</p>"""
          assert s.count(old)==1, 'manual section 12 anchor'
          s=s.replace(old,new,1)

          old='당사자 모드에서는 <b>나</b> 화면 상단의 <b>내가 되찾은 것</b>에서 회복일·되찾은 시간·지킨 비용·회복 실천을 한눈에 볼 수 있습니다.'
          new='당사자 모드에서는 <b>나</b> 화면 상단의 접힌 <b>내가 되찾은 것</b>을 눌러 회복일·되찾은 시간·지킨 비용·회복 실천을 한눈에 볼 수 있습니다.'
          assert s.count(old)==1, 'guide reclaimed anchor'
          s=s.replace(old,new,1)

          old='당사자 모드에서는 나 화면 상단의 <b>내가 되찾은 것</b>에서 회복일·되찾은 시간·지킨 비용·회복 실천을 확인하고, <b>나 → 내 발자취</b>에서 저장한 기록과 변화 흐름을 확인합니다.'
          new='당사자 모드에서는 나 화면 상단의 접힌 <b>내가 되찾은 것</b>을 필요할 때 펼쳐 회복일·되찾은 시간·지킨 비용·회복 실천을 확인하고, <b>나 → 내 발자취</b>에서 저장한 기록과 변화 흐름을 확인합니다.'
          assert s.count(old)==1, 'manual first-start reclaimed anchor'
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          # Service worker/version surfaces.
          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          assert s.count("const APP_VERSION = 'V8.2.68';")==1
          s=s.replace("const APP_VERSION = 'V8.2.68';","const APP_VERSION = 'V8.2.69';",1)
          assert s.count("const V = 'ohg-v8268-reminder-music-audited';")==1
          s=s.replace("const V = 'ohg-v8268-reminder-music-audited';","const V = 'ohg-v8269-me-smart';",1)
          p.write_text(s,encoding='utf-8')

          for name in ('privacy.html','legal.html'):
              p=Path(name); s=p.read_text(encoding='utf-8')
              assert s.count('<span class="ver">V8.2.68</span>')==1, name+' version badge'
              s=s.replace('<span class="ver">V8.2.68</span>','<span class="ver">V8.2.69</span>',1)
              p.write_text(s,encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          marker='## V8.2.68'
          assert marker in s, 'README V8.2.68 marker'
          note="""## V8.2.69 — 나 화면 단순화 · 한국 SMART Recovery 연결
- `나` 화면의 `내가 되찾은 것`을 기본 접힘 요약으로 바꿔 `내 발자취`와 `내 정보 · 설정`이 바로 보이도록 정리했습니다. 상세 회복일·되찾은 시간·지킨 비용·회복 실천 계산은 그대로 유지합니다.
- `지원 및 안내`를 `앱에 바라는 점`보다 먼저 배치하고, 일반 사용자 화면의 `관리자` 진입 카드는 제거했습니다. 내부 관리자 엔진은 삭제하지 않아 운영 기능에는 영향을 주지 않습니다.
- `자조모임 찾기 → 단체 공식 안내`에 `한국 SMART Recovery`를 추가하고 한국 사이트(https://smartkr.org/)로 연결합니다. 설명은 `CBT 접근과 자기관리 기술을 활용하는 회복 자조모임`으로 표시합니다.
- `DATA_SCHEMA=6`, 저장키 `ohg.v1`, 회복기록 구조, V8.2.68의 알림 동기화, Android 정확알림·화면 OFF·부팅 재예약·복약/외래/생활/습관 알림·마음프로 TTS·이완 TTS 엔진은 변경하지 않습니다.

"""
          s=s.replace(marker,note+marker,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate V8.2.69 scope and JavaScript
        run: |
          set -euo pipefail
          grep -F "const BUILD='V8.2.69'" index.html
          grep -F "const DATA_SCHEMA=6" index.html
          grep -F "const KEY='ohg.v1'" index.html
          grep -F 'apply=1' index.html
          grep -F 'clear=1' index.html
          grep -F './music-audio-data.js' index.html
          grep -F "한국 SMART Recovery" index.html
          grep -F "CBT 접근과 자기관리 기술을 활용하는 회복 자조모임" index.html
          grep -F "https://smartkr.org/" index.html
          grep -F "const APP_VERSION = 'V8.2.69';" sw.js
          grep -F "ohg-v8269-me-smart" sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.index('<section class="pg" id="p-my">'); b=s.index('</section>',a); sec=s[a:b]
          assert '<b>관리자</b>' not in sec
          assert sec.index('<b>내 발자취</b>') < sec.index('<b>내 정보 · 설정</b>') < sec.index('<b>지원 및 안내</b>') < sec.index('<b>앱에 바라는 점</b>')
          assert 'aria-expanded="false" onclick="reclaimToggle(this)"' in s
          assert 'function reclaimToggle(btn)' in s
          assert "const b = $('#me-admin');\n  $('#tab-admin').classList.add('hide');\n  if(!b) return;" in s
          assert '→ 관리자' not in s
          assert '앱에 바라는 점 · 지원 및 안내 · 관리자' not in s
          assert '<section class="pg" id="p-admin">' in s  # engine retained, user entry removed
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          assert scripts
          for i,js in enumerate(scripts): Path(f'/tmp/inline-{i}.js').write_text(js,encoding='utf-8')
          print('inline scripts',len(scripts))
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
          node --check music-audio-data.js
          git diff --check

      - name: Commit finalized web candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js privacy.html legal.html README.md
          git commit -m 'fix: finalize V8.2.69 menu cleanup and SMART link'
          git push
