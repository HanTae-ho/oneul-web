name: Patch V9.0.1 manual sync

on:
  push:
    branches: [docs-v9.0.1-manual-sync]
    paths:
      - '.github/workflows/patch-v901-manual-sync.yml'

permissions:
  contents: write

jobs:
  patch-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-v9.0.1-manual-sync
      - name: Patch in-app manual and README
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          idx = Path('index.html')
          text = idx.read_text(encoding='utf-8')
          old = '홈 · 회복도구 · 헬프 · 마음프로'
          new = '홈 · 회복도구 · 헬프 · 마음프로 · 소셜'
          n = text.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 manual menu string, found {n}')
          idx.write_text(text.replace(old, new, 1), encoding='utf-8')
          readme = Path('README.md')
          r = readme.read_text(encoding='utf-8')
          heading = '## V9.0.1 — 마음프로 역할·모임조회·소셜 연결 안내'
          if heading not in r:
              lines = [
                  heading,
                  '- 마음프로 AI 요청에 `family/self` 역할과 앱의 현재 날짜·시간·요일을 함께 전달합니다. 오늘·어제·내일·모레·특정 요일 모임 조회를 보정하고, 오늘 전체 일정과 현재 이후 이용 가능한 일정을 구분합니다.',
                  '- AA·GA·NA·SMART 모임을 구분하며, 일반 상담 문장을 모임 검색으로 오인하지 않도록 보정했습니다. 종료시간이 없는 모임은 현재 진행 중이라고 단정하지 않습니다.',
                  '- 소셜은 전용 `SOCIAL_URL`을 자원서버 `config`에서 읽어 연결합니다. 연결값이 없거나 유효하지 않으면 `소셜 서버 연결 준비 중`으로 표시하며, 개인 회복기록과 소셜 기록은 계속 분리합니다.',
                  '- 사용설명서의 하단 메뉴 구조를 실제 화면과 맞춰 `홈 · 회복도구 · 헬프 · 마음프로 · 소셜`로 현행화했습니다. 소셜 상세 사용 안내는 기존 도움말을 유지합니다.',
                  '- `DATA_SCHEMA=6`, `ohg.v1`, `ohg.social.v1`, Android 정확알림·화면 OFF·부팅 재예약·복약/외래/생활/습관 알림·마음프로 음성·이완 TTS 엔진은 변경하지 않습니다.',
                  '',
              ]
              readme.write_text('\n'.join(lines) + '\n' + r, encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('홈 · 회복도구 · 헬프 · 마음프로 · 소셜') >= 1
          assert 'DATA_SCHEMA=6' in s
          assert 'ohg.v1' in s
          assert 'ohg.social.v1' in s
          print('manual-sync checks passed')
          PY
          rm -f .github/workflows/patch-v901-manual-sync.yml
      - name: Commit documentation-only changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html README.md .github/workflows/patch-v901-manual-sync.yml
          git diff --cached --check
          git diff --cached --stat
          git diff --cached -- index.html README.md
          git commit -m 'docs: sync V9.0.1 user manual with social menu'
          git push origin HEAD:docs-v9.0.1-manual-sync
