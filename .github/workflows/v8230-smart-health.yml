name: Validate V8.2.30 SMART health hub

on:
  push:
    branches: [v8.2.30-smart-health]
    paths:
      - 'v8230-smart-health.py'
      - '.github/workflows/v8230-smart-health.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.30-smart-health
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V8.2.30 patch
        run: python v8230-smart-health.py
      - name: Validate health hub and preserved structure
        run: |
          grep -q "const BUILD = 'V8.2.30'" index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q 'id="p-smart-health"' index.html
          grep -q '건강 회복 · 생활 돌보기' index.html
          grep -q 'id="smart-health-food"' index.html
          grep -q 'id="smart-health-exercise"' index.html
          grep -q 'id="smart-health-sleep"' index.html
          grep -q 'id="smart-health-treatment"' index.html
          grep -q 'id="smart-health-procrastination"' index.html
          grep -q "food.onclick=()=>go('life-schedule')" index.html
          grep -q "ex.onclick=()=>go('habit')" index.html
          grep -q "sleep.onclick=()=>go('life-schedule')" index.html
          grep -q "tr.onclick=()=>go('treatment')" index.html
          grep -q "pro.onclick=()=>go('smart-goal')" index.html
          grep -q "recTab='body';go('rec')" index.html
          grep -q "tc.classList.toggle('hide',famMode())" index.html
          grep -q '가족도 자신의 생활과 건강을 돌봅니다' index.html
          grep -q "if(type === 'smart-health'){ go('smart-health'); return; }" index.html
          grep -q "if(p === 'smart-health') drawSmartHealth();" index.html
          grep -q "'smart-health':'건강 회복 · 생활 돌보기'" index.html
          grep -q '"type": "smart-health"' learning-data.js
          grep -q '"label": "건강 회복 · 생활 돌보기"' learning-data.js
          grep -q "const APP_VERSION = 'V8.2.30'" sw.js
          grep -q "ohg-v8230-smart-health" sw.js
          grep -q "const RELAX_TTS_RATE=.80" index.html
          grep -q "oneul://relax/" index.html
          grep -q "smartToolButton('SMART 목표 설정'" index.html
          grep -q "smartToolButton('이완 · 마음 가라앉히기'" index.html
          grep -q "smartToolButton('VACI · 활력 넘치는 창의적 관심사'" index.html
          grep -q '4초 들이쉬기 · 6초 내쉬기' index.html
      - name: JavaScript syntax checks
        run: |
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          parts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          open('/tmp/index-inline.js','w',encoding='utf-8').write('\n'.join(parts))
          PY
          node --check /tmp/index-inline.js
          node --check learning-data.js
          node --check sw.js
      - name: Validate diff scope
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          files=set(subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).split())
          assert files <= {'index.html','learning-data.js','sw.js'}, files
          PY
      - name: Commit validated product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.30 add SMART health recovery hub'
          git push
