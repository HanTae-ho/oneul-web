name: Fix V8.2.49 MindPro summary
on:
  push:
    branches: [v8.2.49-mindpro-guide-tts]
    paths: ['fix-v8249-summary.py','.github/workflows/fix-v8249-summary.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.49-mindpro-guide-tts
      - run: python3 fix-v8249-summary.py
      - run: |
          git diff --check
          python3 - <<'PY'
          import re,pathlib,subprocess
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for i,b in enumerate(re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)):
            p=pathlib.Path(f'/tmp/s{i}.js');p.write_text(b,encoding='utf-8');subprocess.run(['node','--check',str(p)],check=True)
          assert "const voice = nativeAndroidApp() ? ' · 마음프로 음성' : '';" in s
          PY
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Hide MindPro voice setting label outside Android' || exit 0
          git push origin HEAD:v8.2.49-mindpro-guide-tts
