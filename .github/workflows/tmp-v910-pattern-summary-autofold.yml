name: tmp-v910-pattern-summary-autofold
on:
  push:
    branches: [v9.0.10-pattern-summary-autofold]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.10-pattern-summary-autofold
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch V9.0.10
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          def one(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 match, got {n}')
              s=s.replace(old,new,1)

          one("const BUILD='V9.0.9';","const BUILD='V9.0.10';",'BUILD')

          old_pattern="""  w.appendChild(el('div','note','<b>내 기록에서 보이는 흐름</b><br>최근 90일의 기기 내 기록을 서로 연결해 반복된 사실만 보여드립니다. 관계 항목도 함께 기록되었다는 맥락만 보여주며 특정 사람이 원인이라고 판단하지 않습니다. 진단·위험도 점수·재발 예측이 아니며, 자가점검 점수는 이 계산에 섞지 않습니다. 다시 시작 전 회복기간은 저장된 전체 다시 시작 기록을 참고합니다.'));
"""
          new_pattern="""  const patternGuide=el('details','note info-fold');
          patternGuide.id='recovery-pattern-info';
          patternGuide.innerHTML='<summary>내 기록에서 보이는 흐름</summary><div class=\"info-fold-body\">최근 90일의 기기 내 기록을 서로 연결해 반복된 사실만 보여드립니다. 관계 항목도 함께 기록되었다는 맥락만 보여주며 특정 사람이 원인이라고 판단하지 않습니다. 진단·위험도 점수·재발 예측이 아니며, 자가점검 점수는 이 계산에 섞지 않습니다. 다시 시작 전 회복기간은 저장된 전체 다시 시작 기록을 참고합니다.</div>';
          w.appendChild(patternGuide);
"""
          one(old_pattern,new_pattern,'recovery pattern guide')

          one("  if(recTab === 'stat')    body.appendChild(recStat());\n","""  if(recTab === 'stat'){
            body.appendChild(recStat());
            if(recStatView==='pattern'&&!famMode()) autoFoldInfo('recovery-pattern-info','recovery-pattern',1100);
          }
""",'pattern autofold dispatch')

          old_summary="""    '<div class=\"note\"><b>기록 요약 안내</b><br>이 화면은 사용자가 직접 기록한 내용을 정리한 것이며 진단·위험도 점수·재발예측이 아닙니다. 자유기록 원문은 표시하지 않으며 서버나 마음프로로 자동 전송하지 않습니다.</div>'+\n"""
          new_summary="""    '<details class=\"note info-fold\" id=\"recovery-summary-info\"><summary>기록 요약 안내</summary><div class=\"info-fold-body\">이 화면은 사용자가 직접 기록한 내용을 정리한 것이며 진단·위험도 점수·재발예측이 아닙니다. 자유기록 원문은 표시하지 않으며 서버나 마음프로로 자동 전송하지 않습니다.</div></details>'+\n"""
          one(old_summary,new_summary,'recovery summary guide')

          one("""    '</div>';

          const pb=$('#summary-patterns');
""","""    '</div>';
          autoFoldInfo('recovery-summary-info','recovery-summary',1100);

          const pb=$('#summary-patterns');
""",'summary autofold call')

          p.write_text(s,encoding='utf-8')

          sw=Path('sw.js');t=sw.read_text(encoding='utf-8')
          if t.count("const APP_VERSION = 'V9.0.9';")!=1: raise SystemExit('sw APP_VERSION match')
          t=t.replace("const APP_VERSION = 'V9.0.9';","const APP_VERSION = 'V9.0.10';",1)
          if t.count("const V = 'ohg-v909-info-autofold-r1';")!=1: raise SystemExit('sw cache match')
          t=t.replace("const V = 'ohg-v909-info-autofold-r1';","const V = 'ohg-v9010-pattern-summary-fold-r1';",1)
          sw.write_text(t,encoding='utf-8')

          rel=Path('latest-release.json');j=json.loads(rel.read_text(encoding='utf-8'))
          if j.get('version')!='V9.0.9' or j.get('versionCode')!=904: raise SystemExit('latest-release baseline mismatch')
          j.update(version='V9.0.10',versionCode=905,apk='https://github.com/HanTae-ho/oneul-web/releases/download/v9.0.10-test/oneul-v9.0.10.apk',release='https://github.com/HanTae-ho/oneul-web/releases/tag/v9.0.10-test')
          rel.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          v=Path('verify.js');z=v.read_text(encoding='utf-8')
          if "const BUILD='V9.0.9';" not in z: raise SystemExit('verify BUILD baseline missing')
          z=z.replace("const BUILD='V9.0.9';","const BUILD='V9.0.10';",1)
          marker="ok(index.includes('emptyChecked')&&index.includes('소셜 피드를 확인하는 중입니다.')&&index.includes('await new Promise(resolve=>setTimeout(resolve,1000));'),'소셜 첫 빈 응답 1초 재확인');"
          if marker not in z: raise SystemExit('verify marker missing')
          add="""\nok(index.includes('recovery-pattern-info')&&index.includes("autoFoldInfo('recovery-pattern-info','recovery-pattern',1100)"),'내 회복패턴 안내 자동 폴딩');\nok(index.includes('recovery-summary-info')&&index.includes("autoFoldInfo('recovery-summary-info','recovery-summary',1100)"),'내 회복요약 안내 자동 폴딩');"""
          z=z.replace(marker,marker+add,1)
          v.write_text(z,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/index-all.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          node verify.js
          EXPECTED_APP_VERSION=V9.0.10 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "recovery-pattern-info" index.html
          grep -F "recovery-summary-info" index.html
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js latest-release.json verify.js
          git commit -m 'V9.0.10 auto-fold recovery pattern and summary guidance'
          git push origin HEAD:v9.0.10-pattern-summary-autofold
