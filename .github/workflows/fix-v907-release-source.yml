name: Fix V9.0.7 release source consistency

on:
  push:
    branches: [android-v9.0.7-source-consistency-fix]
    paths:
      - '.github/workflows/fix-v907-release-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-build-retag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-v9.0.7-source-consistency-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Synchronize exact corrected V9.0.7 web source from main
        run: |
          set -euo pipefail
          MAIN_SHA=7c5d33a204afac9b3cdc574c2f274d1cc76471ba
          git fetch origin "$MAIN_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_SHA"
          for f in index.html sw.js verify.js install.html latest-release.json native.html release-version-check.js .github/workflows/check-web-runtime.yml; do
            mkdir -p "$(dirname "$f")"
            git show "$MAIN_SHA:$f" > "$f"
          done
          EXPECTED_APP_VERSION=V9.0.7 node release-version-check.js
          git diff --check

      - name: Commit synchronized source before release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js verify.js install.html latest-release.json native.html release-version-check.js .github/workflows/check-web-runtime.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize V9.0.7 release source with corrected main'
            git push origin HEAD:android-v9.0.7-source-consistency-fix
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.7 Android revision and cross-check release source
        run: bash android-v9.0.7-version-parser-release.sh

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB for verification only
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify package and preserved native engines
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='902' versionName='9.0.7'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"
          cp "$APK" oneul-v9.0.7-sourcecheck.apk
          cp "$AAB" oneul-v9.0.7-sourcecheck.aab
          sha256sum oneul-v9.0.7-sourcecheck.apk oneul-v9.0.7-sourcecheck.aab > SOURCECHECK-SHA256.txt

      - name: Upload verification build artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.7-source-consistency-check
          path: |
            oneul-v9.0.7-sourcecheck.apk
            oneul-v9.0.7-sourcecheck.aab
            SOURCECHECK-SHA256.txt

      - name: Move existing prerelease source tag without replacing tested assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BEFORE=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v9.0.7-test" --jq '[.assets[].id]|sort|join(",")')
          test -n "$BEFORE"
          git tag -f v9.0.7-test "$SOURCE_SHA"
          git push origin refs/tags/v9.0.7-test --force
          AFTER=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v9.0.7-test" --jq '[.assets[].id]|sort|join(",")')
          test "$BEFORE" = "$AFTER"
          git show v9.0.7-test:index.html | grep -F "const BUILD='V9.0.7';"
          git show v9.0.7-test:sw.js | grep -F "const APP_VERSION = 'V9.0.7';"
          git show v9.0.7-test:sw.js | grep -F "const V = 'ohg-v907"
          git show v9.0.7-test:latest-release.json | grep -F '"version": "V9.0.7"'
          git show v9.0.7-test:index.html | grep -F "([vV]\\d+(?:\\.\\d+){1,2})"
          echo "V9.0.7 release source tag corrected at $SOURCE_SHA; existing release asset IDs preserved."
