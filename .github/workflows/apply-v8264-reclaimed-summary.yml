name: Apply V8.2.64 reclaimed summary

on:
  push:
    branches: [v8.2.64-reclaimed-summary]
    paths:
      - '.github/workflows/apply-v8264-reclaimed-summary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.64-reclaimed-summary
      - name: Apply reclaimed summary
        run: python3 .github/scripts/apply_v8264.py
      - name: Verify V8.2.64 scope and markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          s=Path('index.html').read_text()
          assert "const BUILD = 'V8.2.64';" in s
          assert "const DATA_SCHEMA = 6;" in s
          assert "const KEY = 'ohg.v1';" in s
          assert s.count('id="rec-reclaim"')==1
          assert s.count('id="rec-tab"')==1
          assert s.count('function drawReclaim(){')==1
          assert s.count('function openReclaimSettings(){')==1
          assert "drawReclaim();\n  /* 가족은 충동·재발" in s
          assert "clock:" in s and "wallet:" in s
          assert "도박 회복영역에서는 손실복구 사고를 자극하지 않도록" in s
          assert "reclaim: { kind:'', timeOn:0, timePerDay:0, costOn:0, costPerDay:0 }" in s
          start=s.index('/* V8.2.64 — 내 발자취')
          end=s.index('function recScreening(){')
          new_block=s[start:end]
          for glyph in ['🌱','⏱','💰','🕒','💵','📅']:
            assert glyph not in new_block
          for lib in ['font-awesome','material-icons','lucide','heroicons']:
            assert lib not in new_block.lower()
          class P(HTMLParser):
            def __init__(self): super().__init__(); self.ids=[]
            def handle_starttag(self,tag,attrs):
              d=dict(attrs)
              if 'id' in d:self.ids.append(d['id'])
          p=P(); p.feed(s)
          for x in ['rec-reclaim','rec-tab','rec-body']:
            assert p.ids.count(x)==1,(x,p.ids.count(x))
          print('V8.2.64 reclaimed summary markup/invariants: PASS')
          PY
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/inline.js').write_text('\n'.join(x for x in scripts if x.strip()))
          PY
          node --check /tmp/inline.js
      - name: Check diff scope
        run: |
          git diff --check
          files=$(git diff --name-only)
          echo "$files"
          test "$files" = $'README.md\nindex.html\nsw.js'
      - name: Commit target files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html sw.js
          git commit -m 'Add V8.2.64 reclaimed recovery summary'
          git push
