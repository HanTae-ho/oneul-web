name: Release Android V9.1.1

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'install.html'
      - 'latest-release.json'
      - '.github/workflows/release-android-v911.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-android-v9.1.1
  cancel-in-progress: false

jobs:
  build-verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify V9.1.1 web release metadata
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          node release-version-check.js
          grep -F "const BUILD='V9.1.1';" index.html
          grep -F "const APP_VERSION = 'V9.1.1';" sw.js
          grep -F "const V = 'ohg-v911-optional-recovery-smoking-r1';" sw.js
          grep -F '"version": "V9.1.1"' latest-release.json
          grep -F '"versionCode": 917' latest-release.json
          grep -F 'releases/download/v9.1.1/oneul-v9.1.1.apk' latest-release.json
          grep -F "verifiedVersion:'V9.1.1'" install.html
          echo "RELEASE_SOURCE_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --tags origin refs/tags/v9.1.1 >/dev/null 2>&1; then
            echo 'v9.1.1 tag already exists; refusing duplicate release' >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android SDK
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          command -v sdkmanager
          sdkmanager --version

      - name: Install pinned Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Restore pinned proven Android source tree
        env:
          ARCHIVE_SHA: c79a2957e47818550444abeb83e1fafafd9bd572
        run: |
          set -euo pipefail
          git fetch origin "$ARCHIVE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$ARCHIVE_SHA"
          test "$(git rev-parse "$ARCHIVE_SHA:android-v8-source.zip")" = "627c56a3a557cc2fc1be2e3d00b693b7e0aa99ab"
          test "$(git rev-parse "$ARCHIVE_SHA:android-v9.0.20-restore-practice-label-release.sh")" = "d611514a0c4bf784c64a3155fa81a925621ccc33"
          git checkout --detach "$ARCHIVE_SHA"
          chmod +x android-v*.sh
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8
          bash android-v9.0.20-restore-practice-label-release.sh

      - name: Advance Android metadata only to V9.1.1
        run: |
          set -euo pipefail
          GRADLE=android-v8/app/build.gradle
          sed -i "s/versionCode 915/versionCode 917/; s/versionName '9.0.20'/versionName '9.1.1'/" "$GRADLE"
          python3 - <<'PY'
          from pathlib import Path
          root=Path('android-v8/app/src/main')
          old='https://hantae-ho.github.io/oneul-web/native.html?appv=9.0.20'
          new='https://hantae-ho.github.io/oneul-web/native.html?appv=9.1.1'
          changed=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix.lower() not in {'.java','.xml'}:
                  continue
              s=p.read_text(encoding='utf-8')
              if old in s:
                  p.write_text(s.replace(old,new),encoding='utf-8')
                  changed.append(str(p))
          if not changed:
              raise SystemExit('V9.0.20 appv marker not found')
          print('updated appv marker:', *changed, sep='\n')
          PY
          grep -F "versionCode 917" "$GRADLE"
          grep -F "versionName '9.1.1'" "$GRADLE"
          grep -R -F 'native.html?appv=9.1.1' android-v8/app/src/main

      - name: Restore existing release signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"
          test -s "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create release signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STORE_PASSWORD"; test -n "$KEY_ALIAS"; test -n "$KEY_PASSWORD"
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed V9.1.1 APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify package, permissions and preserved native engines
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"; test -s "$AAB"
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"
          echo "BUILT_AAB=$AAB" >> "$GITHUB_ENV"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='917' versionName='9.1.1'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          grep -F 'handleSilentSync(getIntent())' "$PKG/NotificationSettingsActivity.java"
          grep -F '"1".equals(val(u, "clear"))' "$PKG/NotificationSettingsActivity.java"
          grep -F '"1".equals(val(u, "apply"))' "$PKG/NotificationSettingsActivity.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Verify signer continuity with V9.0.20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p published
          gh release download v9.0.20-test --pattern 'oneul-v9.0.20.apk' --dir published
          echo '711b68a3da5c5ac82f588b6756a6b8a2b214b1a7914790ee48645a4994a5f821  published/oneul-v9.0.20.apk' | sha256sum -c -
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$BUILT_APK" | tee /tmp/new-certs.txt
          "$APKSIGNER" verify --print-certs published/oneul-v9.0.20.apk | tee /tmp/old-certs.txt
          grep 'Signer #1 certificate SHA-256 digest:' /tmp/new-certs.txt | sed 's/.*digest: //' > /tmp/new.sha
          grep 'Signer #1 certificate SHA-256 digest:' /tmp/old-certs.txt | sed 's/.*digest: //' > /tmp/old.sha
          diff -u /tmp/old.sha /tmp/new.sha
          jarsigner -verify "$BUILT_AAB"
          echo 'V9.1.1 signer continuity PASS'

      - name: Prepare release assets and checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "$BUILT_APK" dist/oneul-v9.1.1.apk
          cp "$BUILT_AAB" dist/oneul-v9.1.1.aab
          (cd dist && sha256sum oneul-v9.1.1.apk oneul-v9.1.1.aab > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.1.1-verified
          path: dist/*
          if-no-files-found: error

      - name: Publish V9.1.1 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'EOF'
          ## 오늘 한 걸음 V9.1.1
          - 회복 시작일을 선택 입력으로 바꾸고, 시작일이 없으면 앱 기록 시작일부터의 기록 기간으로 구분해 표시합니다.
          - 금연 예정/금연 중을 주 회복영역과 분리한 선택형 건강실천으로 추가했습니다.
          - 나 화면을 내 정보 · 설정 → 내 발자취 → 내가 되찾은 것 순서로 정리했습니다.
          - 홈 오늘 일정은 지금 확인할 항목 중심으로 간결하게 표시하고, 전체보기에서 오늘 등록 일정을 확인할 수 있습니다.
          - FAQ·사용설명서·개인정보처리방침을 실제 동작과 맞췄습니다.
          - Android 네이티브 알림·부팅복원·치료알림·Relax/MindPro TTS 엔진은 검증된 기존 계보를 그대로 유지합니다.
          - Android: versionCode 917 / versionName 9.1.1
          EOF
          gh release create v9.1.1 dist/oneul-v9.1.1.apk dist/oneul-v9.1.1.aab dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SOURCE_SHA" \
            --title '오늘 한 걸음 V9.1.1' --notes-file /tmp/release-notes.md --latest

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v9.1.1 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url
          mkdir -p released
          gh release download v9.1.1 --repo "$GITHUB_REPOSITORY" --pattern 'oneul-v9.1.1.apk' --dir released
          sha256sum dist/oneul-v9.1.1.apk released/oneul-v9.1.1.apk
          test "$(sha256sum dist/oneul-v9.1.1.apk | awk '{print $1}')" = "$(sha256sum released/oneul-v9.1.1.apk | awk '{print $1}')"
          echo 'ANDROID_V9_1_0_RELEASE_PASS'
