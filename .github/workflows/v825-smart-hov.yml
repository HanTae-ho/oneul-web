name: V8.2.5 SMART HOV

on:
  push:
    branches: [v8.2.5-smart-hov]
    paths:
      - 'v825-smart-hov.py'
      - '.github/workflows/v825-smart-hov.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.5-smart-hov
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SMART HOV patch
        run: python v825-smart-hov.py
      - name: Verify product changes
        run: |
          grep -q "const BUILD = 'V8.2.5'" index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q "smartWorks: \[\]" index.html
          grep -q "id=\"p-smart-hov\"" index.html
          grep -q "function drawSmartHov" index.html
          grep -q "type === 'smart-hov'" index.html
          grep -q '"type": "smart-hov"' learning-data.js
          grep -q '"label": "HOV 가치의 계층 작성하기"' learning-data.js
          grep -q "const APP_VERSION = 'V8.2.5'" sw.js
          grep -q "ohg-v825-smart-hov" sw.js
          node --check learning-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html learning-data.js sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.5 add SMART Recovery HOV worksheet' || true
          git push
