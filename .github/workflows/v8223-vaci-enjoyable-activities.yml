name: V8.2.23 VACI Enjoyable Activities

on:
  push:
    branches: [v8.2.23-vaci-enjoyable-activities]
    paths:
      - 'v8223-vaci-enjoyable-activities.py'
      - '.github/workflows/v8223-vaci-enjoyable-activities.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.23-vaci-enjoyable-activities
          fetch-depth: 0
      - name: Apply V8.2.23 patch
        run: python v8223-vaci-enjoyable-activities.py
      - name: Verify VACI activity ideas and invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          w=Path('sw.js').read_text(encoding='utf-8')
          checks=[
            "const BUILD = 'V8.2.23';",
            'const DATA_SCHEMA = 6;',
            'SMART_VACI_IDEA_GROUPS',
            "name:'사회적인'",
            "name:'창의적인'",
            "name:'교육적인'",
            "name:'하고 싶은대로 하기'",
            "name:'레크리에이션'",
            '친구에게 전화하기','글쓰기','박물관·미술관 방문하기','따뜻한 물에서 휴식하기','산책하기',
            '즐거운 활동 아이디어 보기','선택한 활동 VACI에 추가','data-vaci-idea',
            "kind:'vaci'", "if(type === 'smart-vaci'){ go('smart-vaci'); return; }",
            "let learnState = { topic:'', returnSection:'' };"
          ]
          for x in checks:
            assert x in s, x
          assert '번역본' not in s
          assert 'SNS 사용하기' not in s
          assert '만찬(파티) 열기' not in s
          assert "const APP_VERSION = 'V8.2.23';" in w
          assert "const V = 'ohg-v8223-vaci-enjoyable-activities';" in w
          PY
      - name: JavaScript syntax sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.rfind('<script>'); b=s.find('</script>',a)
          assert a>=0 and b>a
          Path('/tmp/last-script.js').write_text(s[a+8:b],encoding='utf-8')
          PY
          node --check /tmp/last-script.js
      - name: Diff scope sanity
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.23 add enjoyable activity ideas to VACI'
          git push
