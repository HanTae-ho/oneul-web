name: Patch CI browser regression temp

on:
  push:
    branches: [ci-v9.0.20-network-noise]
    paths:
      - '.github/workflows/patch-test-temp.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci-v9.0.20-network-noise
      - name: Make browser regression deterministic
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('test.js')
          s=p.read_text(encoding='utf-8')
          old="""  const errs = [];
  pg.on('pageerror', e => errs.push('PAGEERROR: ' + e.message));
  pg.on('console', m => { if (m.type() === 'error') errs.push('CONSOLE: ' + m.text()); });
"""
          new="""  const errs = [];
  pg.on('pageerror', e => errs.push('PAGEERROR: ' + e.message));
  // 결정론적 회귀검사에서는 외부 서비스의 일시적 4xx를 JS 오류로 오인하지 않습니다.
  // 대신 localhost의 4xx/5xx는 별도로 실패 처리해 앱 자체의 누락 자원은 계속 잡습니다.
  pg.on('response', r => {
    try {
      const u = new URL(r.url());
      if ((u.hostname === 'localhost' || u.hostname === '127.0.0.1') && r.status() >= 400) {
        errs.push('LOCAL HTTP ' + r.status() + ': ' + u.pathname);
      }
    } catch (_) {}
  });
  pg.on('console', m => {
    if (m.type() !== 'error') return;
    const text = m.text();
    if (text.startsWith('Failed to load resource:')) return;
    errs.push('CONSOLE: ' + text);
  });
"""
          if old not in s:
            raise SystemExit('target console handler not found')
          s=s.replace(old,new,1)
          s=s.replace("assert(errs.length === 0, '브라우저 회귀검사 중 JavaScript pageerror가 없어야 함');","assert(errs.length === 0, '브라우저 회귀검사 중 로컬 HTTP·JavaScript 런타임 오류가 없어야 함');",1)
          p.write_text(s,encoding='utf-8')
          PY
          rm .github/workflows/patch-test-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test.js .github/workflows/patch-test-temp.yml
          git commit -m "test: isolate browser regression from external 4xx noise"
          git push origin HEAD:ci-v9.0.20-network-noise
