name: Publish V8.2.29 test release

on:
  push:
    branches: [android-v8.2.29-relax-rate]
    paths:
      - '.github/workflows/publish-v8229-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.29 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34037316538 -n oneul-v8.2.29-relax-rate-apk -D dist-apk
          gh run download 34037316538 -n oneul-v8.2.29-relax-rate-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.29.apk
          cp dist-aab/*.aab oneul-v8.2.29.aab
          test -s oneul-v8.2.29.apk
          test -s oneul-v8.2.29.aab
      - name: Publish V8.2.29 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.29-test --yes --cleanup-tag || true
          gh release create v8.2.29-test oneul-v8.2.29.apk oneul-v8.2.29.aab \
            --target android-v8.2.29-relax-rate \
            --title '오늘 한 걸음 V8.2.29 이완 말하기 속도 선택 테스트' \
            --notes '이완 화면의 중복 Android 안내 박스를 제거해 화면을 단순화했습니다. Android 네이티브 PMR·심상화·명상 음성 가이드에는 말하기 속도 선택을 추가했습니다: 느리게 0.7배, 차분하게 0.8배(기본), 조금 빠르게 0.9배, 보통 1.0배. 선택한 속도는 기기에 저장되어 세 가이드와 미리듣기에 공통 적용됩니다. 화면 OFF 지속재생, 한국어 음성 선택, 미리듣기, 일시정지·계속·종료는 유지했습니다. DATA_SCHEMA 6, 기존 TWA 구조, 습관·치료·외래 저장구조, 정확알림 엔진과 부팅 후 재예약 로직은 변경하지 않았습니다.' \
            --prerelease
