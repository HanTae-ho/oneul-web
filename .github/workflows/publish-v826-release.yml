name: Publish V8.2.6 test release

on:
  push:
    branches: [android-v8.2.6-smart-cba]
    paths:
      - '.github/workflows/publish-v826-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.6 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33941247889 -n oneul-v8.2.6-smart-cba-apk -D dist-apk
          gh run download 33941247889 -n oneul-v8.2.6-smart-cba-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.6.apk
          cp dist-aab/*.aab oneul-v8.2.6.aab
          test -s oneul-v8.2.6.apk
          test -s oneul-v8.2.6.aab
      - name: Publish V8.2.6 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.6-test --yes --cleanup-tag || true
          gh release create v8.2.6-test oneul-v8.2.6.apk oneul-v8.2.6.aab \
            --target android-v8.2.6-smart-cba \
            --title '오늘 한 걸음 V8.2.6 SMART Recovery CBA 테스트' \
            --notes 'SMART Recovery Point 1에 비용-편익 분석(CBA) 작성형 도구를 추가했습니다. 공식 명칭은 비용-편익 분석으로 유지하고, 작성 화면은 사용·실행할 때 좋은 점 / 치르는 대가 / 중단했을 때 좋은 점 / 중단했을 때 어려운 점의 네 영역으로 쉽게 풀었습니다. 각 항목은 단기·장기·둘 다로 표시할 수 있으며 네 영역을 모두 최소 한 가지 이상 작성해야 저장됩니다. 특히 중단의 어려움을 다음 대처 계획으로 연결할 수 있습니다. 기록은 기존 smartWorks에 기기 내부 저장되며 여러 시점의 CBA를 저장·보기·수정·삭제할 수 있습니다. 가족 모드에서는 상대의 중독행동을 평가하지 않고 확인하기·대신 수습하기 등 자신의 바꾸고 싶은 행동을 대상으로 사용합니다. 기존 HOV, 충동일기, 12단계 및 Android 예약알림 엔진은 변경하지 않았습니다.' \
            --prerelease
