name: Publish V8.1.3 test release

on:
  push:
    branches: [android-v8.1.3-schedule-hub]
    paths:
      - '.github/workflows/publish-v813-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.1.3 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33816208150 -n oneul-v8.1.3-schedule-hub-apk -D dist-apk
          gh run download 33816208150 -n oneul-v8.1.3-schedule-hub-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.1.3.apk
          cp dist-aab/*.aab oneul-v8.1.3.aab
          test -s oneul-v8.1.3.apk
          test -s oneul-v8.1.3.aab
      - name: Publish stable direct-download test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.1.3-test --yes --cleanup-tag || true
          gh release create v8.1.3-test oneul-v8.1.3.apk oneul-v8.1.3.aab \
            --target android-v8.1.3-schedule-hub \
            --title '오늘 한 걸음 V8.1.3 일정·알림 통합 테스트' \
            --notes '챙기기와 치료관리 진입을 일정·알림으로 통합했습니다. 생활 일정(위험시간·식사·잠), 치료 일정(복약·외래), 알림 설정을 한 흐름에서 관리합니다. V8.1.2의 네이티브 예약알림 및 외래 반복 예약 엔진은 그대로 유지합니다.' \
            --prerelease
