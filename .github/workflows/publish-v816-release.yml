name: Publish V8.1.6 test release

on:
  push:
    branches: [android-v8.1.6-home-today]
    paths:
      - '.github/workflows/publish-v816-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.1.6 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33823860258 -n oneul-v8.1.6-home-today-apk -D dist-apk
          gh run download 33823860258 -n oneul-v8.1.6-home-today-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.1.6.apk
          cp dist-aab/*.aab oneul-v8.1.6.aab
          test -s oneul-v8.1.6.apk
          test -s oneul-v8.1.6.aab
      - name: Publish V8.1.6 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.1.6-test --yes --cleanup-tag || true
          gh release create v8.1.6-test oneul-v8.1.6.apk oneul-v8.1.6.aab \
            --target android-v8.1.6-home-today \
            --title '오늘 한 걸음 V8.1.6 홈 오늘 일정 통합 테스트' \
            --notes '홈에 따로 표시되던 오늘의 습관·복약·식사·잠·외래를 하나의 오늘 일정 카드로 통합했습니다. 완료 가능한 항목은 한 카드에서 체크하고, 다음 외래는 다가오는 일정으로 확인합니다. V8.1.5의 습관·생활·치료 Android 예약알림 엔진과 외래 반복 예약 로직은 변경하지 않았습니다.' \
            --prerelease
