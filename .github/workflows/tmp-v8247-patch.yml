name: Apply V8.2.47 SMART direct-view patch

on:
  push:
    branches: [v8.2.47-smart-record-direct-view]
    paths:
      - 'tmp-v8247-patch.py'
      - '.github/workflows/tmp-v8247-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.47-smart-record-direct-view
      - name: Apply focused patch
        run: python3 tmp-v8247-patch.py
      - name: Validate changed web files
        run: |
          git diff --check
          node --check sw.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if re.search(r'\bsrc\s*=',m.group(1),re.I):
                  continue
              blocks.append(m.group(2))
          Path('/tmp/oneul-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/oneul-inline.js
          grep -Fq "const BUILD = 'V8.2.47';" index.html
          grep -Fq "const DATA_SCHEMA = 6;" index.html
          grep -Fq "const KEY = 'ohg.v1';" index.html
          grep -Fq "openSmartRecord(key,r)" index.html
          grep -Fq "openSmartHovRecord(r)" index.html
          grep -Fq "openSmartGoalView" index.html
          grep -Fq "const APP_VERSION = 'V8.2.47';" sw.js
      - name: Commit focused result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js README.md
          git commit -m 'V8.2.47 SMART saved records open directly'
          git push
