name: Apply V8.2.63 admin render fix

on:
  push:
    branches: [v8.2.63-admin-render-fix]
    paths:
      - '.github/workflows/apply-v8263-admin-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.63-admin-render-fix
      - name: Apply minimal admin render fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="  if(p === 'me')   drawMe();"
          new="  if(p === 'me')   drawMe();\n  if(p === 'my'){ drawFeedbackStatus(); drawAdmin(); }"
          assert old in s and new not in s
          s=s.replace(old,new,1)
          old2="function adminLogout(){\n  feedbackAdminKey = ''; fbAdmin.items = [];\n  S.admin = 0; save();\n  $('#tab-admin').classList.add('hide');\n  go('me');\n  toast('로그아웃했습니다.');\n}"
          new2="function adminLogout(){\n  feedbackAdminKey = ''; fbAdmin.items = [];\n  S.admin = 0; save();\n  $('#tab-admin').classList.add('hide');\n  go('my');\n  toast('로그아웃했습니다.');\n}"
          assert old2 in s
          s=s.replace(old2,new2,1)
          assert "const BUILD = 'V8.2.62';" in s
          s=s.replace("const BUILD = 'V8.2.62';","const BUILD = 'V8.2.63';",1)
          p.write_text(s)

          p=Path('sw.js'); s=p.read_text()
          assert "const APP_VERSION = 'V8.2.62';" in s
          assert "const V = 'ohg-v8262-me-menu-back';" in s
          s=s.replace("const APP_VERSION = 'V8.2.62';","const APP_VERSION = 'V8.2.63';",1)
          s=s.replace("const V = 'ohg-v8262-me-menu-back';","const V = 'ohg-v8263-admin-render-fix';",1)
          p.write_text(s)

          p=Path('privacy.html'); s=p.read_text()
          s=s.replace('V8.2.62','V8.2.63')
          p.write_text(s)

          p=Path('README.md'); s=p.read_text()
          note="""## V8.2.63 — 관리자 메뉴 렌더링 복구\n- V8.2.62에서 `관리자` 카드를 `나` 화면으로 옮긴 뒤 `drawAdmin()` 호출이 빠져 관리자 로그인 버튼이 비어 보이던 문제를 수정했습니다.\n- `나` 화면 진입 시 기존 `drawAdmin()`과 `drawFeedbackStatus()`만 호출하도록 연결했고, 관리자 로그아웃 후에는 새 위치인 `나` 화면으로 돌아갑니다.\n- `DATA_SCHEMA=6`, `ohg.v1`, 마음프로, 자원시트, 회복기록, Android 알림/TTS 엔진은 변경하지 않았습니다.\n\n"""
          assert not s.startswith('## V8.2.63')
          p.write_text(note+s)
          PY
      - name: Verify exact functional fix
        run: |
          grep -Fq "if(p === 'my'){ drawFeedbackStatus(); drawAdmin(); }" index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('id="me-admin"') == 1
          assert s.count('id="me-admin-m"') == 1
          assert s.count('id="me-feedback-text"') == 1
          assert "function adminLogout(){" in s
          block=s.split('function adminLogout(){',1)[1].split('\n}',1)[0]
          assert "go('my');" in block
          assert "go('me');" not in block
          assert "const BUILD = 'V8.2.63';" in s
          assert "const DATA_SCHEMA = 6" in s or "DATA_SCHEMA = 6" in s
          assert "const KEY = 'ohg.v1'" in s or "KEY = 'ohg.v1'" in s
          print('admin render + data invariants: PASS')
          PY
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          code='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/inline.js').write_text(code)
          PY
          node --check /tmp/inline.js
      - name: Commit target files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html privacy.html sw.js
          git commit -m 'Fix V8.2.63 admin menu rendering'
          git push
