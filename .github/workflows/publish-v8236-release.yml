name: Publish V8.2.36 test release

on:
  push:
    branches: [android-v8.2.36-family-return-plan]
    paths:
      - '.github/workflows/publish-v8236-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.36 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34076290242 -n oneul-v8.2.36-family-return-plan-apk -D dist-apk
          gh run download 34076290242 -n oneul-v8.2.36-family-return-plan-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.36.apk
          cp dist-aab/*.aab oneul-v8.2.36.aab
          test -s oneul-v8.2.36.apk
          test -s oneul-v8.2.36.aab
          sha256sum oneul-v8.2.36.apk oneul-v8.2.36.aab
      - name: Publish V8.2.36 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.36-test --yes --cleanup-tag || true
          gh release create v8.2.36-test oneul-v8.2.36.apk oneul-v8.2.36.aab \
            --target android-v8.2.36-family-return-plan \
            --title '오늘 한 걸음 V8.2.36 가족 다시 사용했을 때 대응계획 테스트' \
            --notes '가족모드에 다시 사용했을 때 내 대응계획을 추가했습니다. 상대의 재발일·횟수·사용량을 기록하는 기능이 아니라, 가족인 내가 미리 준비할 상황 → 먼저 확인할 안전 → 하지 않을 행동 → 대신 내가 할 행동 → 연락·지원 → 상황이 가라앉은 뒤 다음 행동을 정리합니다. 몸 상태·금단, 자해·자살·타해, 폭력·위협·아이 안전 또는 안전 여부가 불확실한 경우 기존 가족 위기 안내를 우선 연결합니다. 기록은 기존 S.smartWorks에 family-return-plan / family로 저장되며 보기·수정·삭제가 가능합니다. DATA_SCHEMA 6, 가족 충동·재발 비기록, 기존 경계·대화 준비, SMART/12단계, Local-first, Android 이완 TTS, 화면 OFF 지속 재생, 속도 선택, 정확알림 엔진과 부팅 후 재예약은 모두 유지했습니다.' \
            --prerelease
