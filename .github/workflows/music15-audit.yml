name: Music 15 and 18 audit
on:
  push:
    branches: [ops/external-connectivity-audit]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Probe replacement audio
        shell: bash
        run: |
          set -e
          UA='Mozilla/5.0 (TodayOneStep Music Audit)'
          probe() {
            name="$1"; url="$2"
            code=$(curl -L --fail --silent --show-error --connect-timeout 10 --max-time 45 --retry 1 --retry-all-errors -A "$UA" -H 'Range: bytes=0-1023' -o /dev/null -w '%{http_code}' "$url")
            echo "$name $code $url"
            test "$code" = "200" -o "$code" = "206"
          }
          probe ELGAR_ARMY 'https://upload.wikimedia.org/wikipedia/commons/8/8a/Pomp_and_Circumstance%2C_Op._39_-_No._1_-_United_States_Army_Band.mp3'
          probe ELGAR_ELGAR_1931_MP3 'https://upload.wikimedia.org/wikipedia/commons/transcoded/e/e4/Pomp_and_circumstances_No._1.ogg/Pomp_and_circumstances_No._1.ogg.mp3'
          probe BACH_USAF_MP3 'https://upload.wikimedia.org/wikipedia/commons/e/ec/Air_-_Air_Force_Strings_-_United_States_Air_Force_Band.mp3'
          probe BACH_USAF_OGG 'https://commons.wikimedia.org/wiki/Special:Redirect/file/Air.ogg'
