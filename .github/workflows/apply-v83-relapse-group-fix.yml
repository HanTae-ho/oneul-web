name: Apply V8.3 relapse pattern grouping fix

on:
  push:
    branches: [feature-v8.3-recovery-patterns]
    paths:
      - '.github/workflows/apply-v83-relapse-group-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-v8.3-recovery-patterns
      - name: Apply grouping fix
        run: python3 .github/v83_relapse_group_fix.py
      - name: Verify grouping and invariants
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "const BUILD='V8.3';" in s
          assert "const KEY = 'ohg.v1';" in s
          assert 'const DATA_SCHEMA = 6;' in s
          part=s.split('function recPattern(){',1)[1].split('function recStatCore(){',1)[0]
          assert 'const relapseGroups={};' in part
          assert "typeOf(type)" in part
          assert '설정한 위험시간과 충동' in part
          assert '회복 실천이 기록된 날' in part
          assert 'fetch(' not in part and 'save()' not in part and 'localStorage' not in part
          scripts=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): scripts.append(m.group(2))
          Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          print('V8.3 relapse grouping invariants PASS')
          PY
          node --check /tmp/inline.js
          git diff --check
      - name: Commit grouping fix
        run: |
          rm -f .github/v83_relapse_group_fix.py .github/workflows/apply-v83-relapse-group-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github
          git diff --cached --check
          git commit -m 'V8.3 다시 시작 패턴 회복영역별 분리'
          git push origin HEAD:feature-v8.3-recovery-patterns
