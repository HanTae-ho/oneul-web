name: Validate V8.2.37 family tools hub

on:
  push:
    branches: [v8.2.37-family-tools-hub]
    paths:
      - 'v8237-family-tools-hub.py'
      - '.github/workflows/v8237-family-tools-hub.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.37-family-tools-hub
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply V8.2.37 patch
        run: |
          python v8237-family-tools-hub.py
          # 아이콘 집합에 없는 임시 이름이 제품에 남지 않도록 기존 check 아이콘을 사용합니다.
          sed -i 's/data-ico="shield"/data-ico="check"/' index.html
      - name: Validate syntax and family invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          checks=[
            ("const BUILD = 'V8.2.37';",'build'),
            ("const DATA_SCHEMA = 6;",'schema6'),
            ('id="tool-family-tools"','tools entry'),
            ('id="p-family-tools"','family hub page'),
            ('상대를 감시하거나 바꾸기 위한 도구가 아닙니다.','hub principle'),
            ('data-family-tool="family-boundary"','boundary link'),
            ('data-family-tool="family-conversation"','conversation link'),
            ('data-family-tool="family-return-plan"','return plan link'),
            ('data-family-tool="smart-abc"','abc link'),
            ('data-family-tool="smart-cba"','cba link'),
            ('data-family-tool="smart-problem-solving"','problem solving link'),
            ('data-family-tool="smart-balance-pie"','balance link'),
            ('data-family-tool="smart-vaci"','vaci link'),
            ('data-family-tool="smart-relax"','relax link'),
            ('data-family-tool="smart-health"','health link'),
            ("'family-tools':'가족을 위한 도구'",'route back label'),
            ('가족은 상대의 충동을 기록하거나 관리하지 않고, 회복 과정을 이해하는 참고로 봅니다.','point2 family wording'),
            ('중독은 단순한 의지의 문제가 아닙니다.','clinical addiction wording'),
            ('회복은 삶을 다시 돌보는 과정입니다','clinical recovery wording'),
            ("{h:'다시 사용하는 일이 생겼을 때', a:'family-return-plan'",'reuse wording'),
            ('가족은 충동·재발을 기록하지 않습니다.','no family urge relapse'),
            ("tool:'family-boundary',role:'family'",'boundary storage preserved'),
            ("tool:'family-conversation',role:'family'",'conversation storage preserved'),
            ("tool:'family-return-plan',role:'family'",'return storage preserved'),
          ]
          for text,label in checks:
            assert text in s, label
          assert 'data-ico="shield"' not in s
          assert "const APP_VERSION = 'V8.2.37';" in sw
          assert "ohg-v8237-family-tools-hub" in sw
          # 새 허브는 탐색 전용: 허브 함수 자체가 새 저장소나 상대 재발 기록을 쓰지 않습니다.
          a=s.index('function drawFamilyTools()')
          b=s.index('/* ══════════ 가족 · 내 경계 정리',a)
          hub=s[a:b]
          assert 'S.' not in hub
          assert "go(b.dataset.familyTool)" in hub
          # 가족모드에서만 진입카드 노출
          assert "ft.classList.toggle('hide', !famMode())" in s
          # 신규/기존 가족 3개 페이지 모두 route-aware back
          for pid in ['family-return-plan','family-conversation','family-boundary']:
            p=s.index(f'id="p-{pid}"')
            q=s.index('</section>',p)
            block=s[p:q]
            assert 'data-smart-back' in block and 'data-back-default="fam"' in block
          # V8.2.35~37 가족 페이지에서 하단 회복도구 탭 강조 유지
          tab=s[s.index('let tabP ='):s.index("if(p === 'listen'",s.index('let tabP ='))]
          for p in ['family-tools','family-return-plan','family-conversation','family-boundary']:
            assert f"p === '{p}'" in tab
          # inline JS syntax check용 파일 생성
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          for i,js in enumerate(scripts):
            Path(f'/tmp/inline_{i}.js').write_text(js,encoding='utf-8')
          print('inline scripts',len(scripts))
          PY
          for f in /tmp/inline_*.js; do node --check "$f"; done
          node --check sw.js
      - name: Verify product scope
        run: |
          git diff --name-only
          python - <<'PY'
          import subprocess
          allowed={'README.md','index.html','sw.js'}
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= allowed, changed
          assert {'README.md','index.html','sw.js'} <= changed, changed
          PY
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html sw.js
          git commit -m 'V8.2.37 family tools hub and final family cleanup'
          git push origin HEAD:v8.2.37-family-tools-hub
