name: V8.2.14 Home Long Press Edit

on:
  push:
    branches: [v8.2.14-home-longpress-edit]
    paths:
      - 'v8214-home-longpress-edit.py'
      - '.github/workflows/v8214-home-longpress-edit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.14-home-longpress-edit
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V8.2.14 patch
        run: python v8214-home-longpress-edit.py
      - name: Verify home edit behavior
        run: |
          grep -q "const BUILD = 'V8.2.14'" index.html
          grep -q "const APP_VERSION = 'V8.2.14'" sw.js
          grep -q "ohg-v8214-home-longpress-edit" sw.js
          grep -q "data-today-done" index.html
          grep -q "길게 눌러 수정할 수 있어요" index.html
          grep -q "function removeTodayNamed" index.html
          grep -q "function completeToday" index.html
          grep -q "function undoToday" index.html
          grep -q "setTimeout(()=>{ hold=0; held=undoToday" index.html
          grep -q "복약 완료 기록을 취소할까요" index.html
          grep -q "S.eatLog=removeTodayNamed" index.html
          grep -q "S.medLog=removeTodayNamed" index.html
          grep -q "habitDoneOn(h,d)" index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1],encoding='utf-8')
          assert "if(b.dataset.todayDone==='1'){ toast('완료 기록은 길게 눌러 수정할 수 있어요.'); return; }" in s
          assert "hold=setTimeout(()=>{ hold=0; held=undoToday" in s
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit V8.2.14 product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.14 allow long-press correction in today schedule'
          git push
