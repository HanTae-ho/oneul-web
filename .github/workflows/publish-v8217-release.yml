name: Publish V8.2.17 test release

on:
  push:
    branches: [android-v8.2.17-smart-problem-solving]
    paths:
      - '.github/workflows/publish-v8217-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.17 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34009696201 -n oneul-v8.2.17-smart-problem-solving-apk -D dist-apk
          gh run download 34009696201 -n oneul-v8.2.17-smart-problem-solving-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.17.apk
          cp dist-aab/*.aab oneul-v8.2.17.aab
          test -s oneul-v8.2.17.apk
          test -s oneul-v8.2.17.aab
      - name: Publish V8.2.17 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.17-test --yes --cleanup-tag || true
          gh release create v8.2.17-test oneul-v8.2.17.apk oneul-v8.2.17.aab \
            --target android-v8.2.17-smart-problem-solving \
            --title '오늘 한 걸음 V8.2.17 SMART 문제 해결 테스트' \
            --notes 'SMART Recovery Point 3에 번역본 기반 문제 해결 5단계 도구를 추가했습니다. 문제를 언제·누가·무슨 일이·생각과 감정으로 구체적으로 정의하고, 가능한 전략을 여러 개 브레인스토밍한 뒤 각 전략의 실행 가능성·시도할 준비·좋은 점·가능한 위험·0~10점 평가를 기록할 수 있습니다. 이어 실제로 시도할 전략 하나를 선택하고 실행 방법, 시작 날짜, 장소, 필요한 도움과 자원, 실행 후 결과 점검까지 서면 계획으로 남깁니다. 기록은 기존 smartWorks에 기기 내부 저장되며 보기·수정·삭제가 가능합니다. 가족모드는 상대를 바꾸거나 통제하는 계획이 아니라 가족 자신의 상황·선택·경계를 중심으로 사용하도록 안내합니다. 기존 SMART 도구, 홈 오늘 일정 길게 눌러 수정, 12단계, Android 습관·생활·치료·외래 정확알림 엔진은 변경하지 않았습니다.' \
            --prerelease
