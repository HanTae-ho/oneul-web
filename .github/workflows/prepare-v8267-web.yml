name: Prepare V8.2.67 web release

on:
  push:
    branches: [release-v8.2.67-legal]
    paths:
      - '.github/workflows/prepare-v8267-web.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release-v8.2.67-legal
          fetch-depth: 0
      - name: Patch version and offline shell
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if s.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one match for {old!r}, got {s.count(old)}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('index.html', "const BUILD = 'V8.2.66';", "const BUILD = 'V8.2.67';")
          replace_once('sw.js', "const APP_VERSION = 'V8.2.66';", "const APP_VERSION = 'V8.2.67';")
          replace_once('sw.js', "const V = 'ohg-v8266-manual-reclaim-label';", "const V = 'ohg-v8267-legal';")
          replace_once('sw.js', "'./qa-data.js', './learning-data.js', './screening-data.js', './workbook-data.js', './privacy.html', './manifest.json',", "'./qa-data.js', './learning-data.js', './screening-data.js', './workbook-data.js', './privacy.html', './legal.html', './manifest.json',")
          for path in ('privacy.html','legal.html'):
              p=Path(path)
              s=p.read_text(encoding='utf-8')
              n=s.count('V8.2.66')
              if n < 1:
                  raise SystemExit(f'{path}: V8.2.66 not found')
              p.write_text(s.replace('V8.2.66','V8.2.67'), encoding='utf-8')
          PY
      - name: Verify invariants
        run: |
          grep -F "const BUILD = 'V8.2.67';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const APP_VERSION = 'V8.2.67';" sw.js
          grep -F "'./legal.html'" sw.js
          git diff --check
      - name: Remove one-time workflow and commit
        run: |
          git rm .github/workflows/prepare-v8267-web.yml
          git add index.html sw.js privacy.html legal.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V8.2.67 저작권 안내 릴리즈 버전 정리'
          git push origin HEAD:release-v8.2.67-legal
