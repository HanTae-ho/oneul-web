name: Publish V8.2.64 test release

on:
  push:
    branches: [android-v8.2.64-reclaimed-summary]
    paths:
      - '.github/workflows/publish-v8264-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.64 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34225380484 -n oneul-v8.2.64-reclaimed-apk -D dist-apk
          gh run download 34225380484 -n oneul-v8.2.64-reclaimed-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.64.apk
          cp dist-aab/*.aab oneul-v8.2.64.aab
          test -s oneul-v8.2.64.apk
          test -s oneul-v8.2.64.aab
          sha256sum oneul-v8.2.64.apk oneul-v8.2.64.aab | tee SHA256SUMS.txt
      - name: Publish V8.2.64 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.64-test --yes --cleanup-tag || true
          gh release create v8.2.64-test oneul-v8.2.64.apk oneul-v8.2.64.aab SHA256SUMS.txt \
            --target android-v8.2.64-reclaimed-summary \
            --title '오늘 한 걸음 V8.2.64 내가 되찾은 것 테스트' \
            --notes '내 발자취 상단에 내가 되찾은 것 요약을 추가했습니다. 회복일은 현재 회복 시작일 기준으로 자동 계산하고, 되찾은 시간과 지킨 비용은 사용자가 원할 때만 기준값을 입력하는 선택 기능입니다. 실천한 습관은 기존 습관 체크 기록을 합산합니다. 도박 회복영역은 손실복구 사고를 자극하지 않도록 금액·손실액 누적 계산을 제공하지 않습니다. 신규 아이콘은 기존 규칙대로 24×24 직접 SVG만 사용하며 이모지·외부 아이콘 라이브러리는 사용하지 않습니다. DATA_SCHEMA=6, ohg.v1, 기존 회복기록·마음프로·자원시트·관리자 기능은 유지됩니다. Android는 검증된 V8.2.63 네이티브 스택을 그대로 사용하고 versionCode 884 / versionName 8.2.64만 적용했습니다. 정확알림·화면 OFF 알림·부팅 재예약·복약/외래/생활/습관 알림·마음프로 네이티브 음성·이완 TTS는 유지됩니다. 웹 main SHA는 d4c541070a508aa9238775b88aafc61f342812e1 입니다.' \
            --prerelease
