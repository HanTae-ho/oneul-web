name: V8.2.22 VACI validation fix

on:
  push:
    branches: [v8.2.22-smart-vaci]
    paths:
      - 'v8222-vaci-validation-fix.py'
      - '.github/workflows/v8222-vaci-validation-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.22-smart-vaci
      - run: python v8222-vaci-validation-fix.py
      - name: Verify exact invalid-card targeting
        run: |
          grep -q "const bad=items.findIndex" index.html
          grep -q "render(bad);toast(!items\[bad\].name" index.html
          grep -q "const BUILD = 'V8.2.22';" index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          ! grep -q '번역본' index.html
      - name: JavaScript syntax sanity
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          Path('/tmp/index-inline.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check learning-data.js
          git diff --check
      - name: Commit product fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V8.2.22 fix VACI validation focus'
          git push origin HEAD:v8.2.22-smart-vaci
