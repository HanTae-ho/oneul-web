name: Apply V8.1.5 Habits Web

on:
  push:
    branches: [v8.1.5-habits]
    paths:
      - 'v815-habits-web-patch.py'
      - '.github/workflows/v815-habits-web.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.5-habits
      - name: Apply V8.1.5 web patch
        run: python3 v815-habits-web-patch.py
      - name: Verify structure and JavaScript
        run: |
          grep -q 'id="p-habit"' index.html
          grep -q 'id="p-habit-edit"' index.html
          grep -q '모임 백일작전' index.html
          grep -q 'habitNotifyPack' index.html
          grep -q "const BUILD = 'V8.1.5'" index.html
          grep -q "const APP_VERSION = 'V8.1.5'" sw.js
          grep -q "const V = 'ohg-v815-habits'" sw.js
          ! grep -q '<h3>치료 일정 사용</h3>' index.html
          ! grep -q 'id="treat-native-note"' index.html
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for x in ['habit-my','habit-templates','habit-edit-body','home-habits','me-hours','me-eats','me-sleep-on','me-sleep','me-notify','me-notify-st']:
              assert s.count('id="'+x+'"')==1,(x,s.count('id="'+x+'"'))
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' not in attrs.lower(): scripts.append(body)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          git diff --check
      - name: Commit V8.1.5 web files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.1.5 add editable habits and simplify treatment alerts'
          git push
