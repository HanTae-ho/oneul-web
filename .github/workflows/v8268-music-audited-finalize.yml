name: Finalize V8.2.68 audited music set
on:
  push:
    branches: [fix-v8.2.68-reminder-music-audit]
    paths: ['.github/workflows/v8268-music-audited-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited 30-track set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,re
          b64=''
          Path('music-audio-data.js').write_bytes(gzip.decompress(base64.b64decode(b64)))

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if './music-audio-data.js' not in s:
              anchor='<script src="./workbook-data.js"></script>'
              assert s.count(anchor)==1
              s=s.replace(anchor, anchor+'\n<script src="./music-audio-data.js"></script>',1)

          anchor='function listenAudioCandidates(x){\n'
          assert s.count(anchor)==1
          inject='''function listenAuditedItem(x){\n  return window.MUSIC_AUDIO_AUDITED && window.MUSIC_AUDIO_AUDITED[String(x && x.n)] || null;\n}\nfunction listenDisplayTitle(x){\n  const a=listenAuditedItem(x); return a && a.title ? a.title : x.c;\n}\nfunction listenDisplayCredit(x){\n  const a=listenAuditedItem(x); return a && a.credit && a.credit !== '—' ? a.credit : '';\n}\nfunction listenAudioCandidates(x){\n  const audited=listenAuditedItem(x);\n  if(audited && Array.isArray(audited.candidates) && audited.candidates.length){\n    const out=[];\n    audited.candidates.forEach(c=>{\n      const u=String(c && c.u || '').trim();\n      if(!/^https?:\\/\\//i.test(u) || out.some(a=>a.u===u)) return;\n      out.push({u:u,l:String(c.l||'').trim(),s:String(c.s||'').trim()});\n    });\n    if(out.length) return out;\n  }\n'''
          s=s.replace(anchor,inject,1)
          old="""'<div class=\"song\"><b>들어볼 곡</b>' + esc(x.c) +\n    (x.a ? '<span>추천 연주 예시 · ' + esc(x.a) + '</span>' : '') +"""
          new="""'<div class=\"song\"><b>들어볼 곡</b>' + esc(listenDisplayTitle(x)) +\n    (listenDisplayCredit(x) ? '<span>현재 재생 연주 · ' + esc(listenDisplayCredit(x)) + '</span>' : '') +"""
          assert s.count(old)==1
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('sw.js'); s=p.read_text(encoding='utf-8')
          if "'./music-audio-data.js'" not in s:
              s=s.replace("'./qa-data.js', './learning-data.js', './screening-data.js', './workbook-data.js', './privacy.html'", "'./qa-data.js', './learning-data.js', './screening-data.js', './workbook-data.js', './music-audio-data.js', './privacy.html'",1)
          s=s.replace("const V = 'ohg-v8268-reminder-music';","const V = 'ohg-v8268-reminder-music-audited';",1)
          p.write_text(s,encoding='utf-8')

          p=Path('legal.html'); s=p.read_text(encoding='utf-8')
          table_re=r'<table class="lictable"><thead><tr><th>번호</th><th>실제 재생 파일의 연주·제작 크레딧</th><th>라이선스</th></tr></thead><tbody>[\s\S]*?</tbody></table>'
          table='''<table class="lictable"><thead><tr><th>번호</th><th>실제 재생 파일의 연주·제작 크레딧</th><th>라이선스</th></tr></thead><tbody>\n<tr><td>6</td><td><a href="https://commons.wikimedia.org/wiki/File:Chopin_op10_No_12.ogg" target="_blank" rel="noopener">원본 파일 페이지의 연주자 표기 참조</a></td><td>CC BY-SA 3.0 DE</td></tr>\n<tr><td>8</td><td><a href="https://commons.wikimedia.org/wiki/File:Maurice_Ravel_-_Th%C3%A9r%C3%A8se_Dussaut_-_Pavane_pour_une_infante_d%C3%A9funte.ogg" target="_blank" rel="noopener">Thérèse Dussaut (피아노)</a></td><td>CC BY-SA 2.0</td></tr>\n<tr><td>10</td><td><a href="https://commons.wikimedia.org/wiki/File:Divertimento_in_F_major%2C_K._138_%28125c%29_-_1st_movement.oga" target="_blank" rel="noopener">츠무기 오케스트라 / 지휘 이노우에 다카시</a></td><td>CC BY 3.0</td></tr>\n<tr><td>16</td><td><a href="https://commons.wikimedia.org/wiki/File:Ravel%27s_Jeux_d%27eau%2C_M._30_-_Anna_Sutyagina.ogg" target="_blank" rel="noopener">Anna Sutyagina (피아노)</a></td><td>CC BY 3.0</td></tr>\n<tr><td>19</td><td><a href="https://commons.wikimedia.org/wiki/File:JOHN_MICHEL_CELLO-DVORAK_CELLO_CONCERTO_in_B_Minor_2nd.ogg" target="_blank" rel="noopener">John Michel (첼로)</a></td><td>CC BY-SA 3.0</td></tr>\n<tr><td>20</td><td><a href="https://commons.wikimedia.org/wiki/File:Jesu%2C_Joy_of_Man%27s_Desiring.ogg" target="_blank" rel="noopener">원본 파일 페이지의 연주자 표기 참조</a></td><td>CC BY-SA 2.5</td></tr>\n<tr><td>21</td><td><a href="https://commons.wikimedia.org/wiki/File:Schubert_-_Arpeggione_Sonata_-_1._Allegro_Moderato.ogg" target="_blank" rel="noopener">원본 파일 페이지의 연주자 표기 참조</a></td><td>CC BY-SA 2.0</td></tr>\n<tr><td>25</td><td><a href="https://commons.wikimedia.org/wiki/File:Bach_-_Flute_Sonata_E_flat_Maj_-_2._Siciliana.ogg" target="_blank" rel="noopener">Alex Murray (트라베르소), Martha Goldstein (하프시코드)</a></td><td>CC BY-SA 2.0</td></tr>\n<tr><td>26</td><td><a href="https://commons.wikimedia.org/wiki/File:Franz_Liszt_-_Consolation_No._3%2C_Lento_placido.ogg" target="_blank" rel="noopener">원본 파일 페이지의 연주자 표기 참조</a></td><td>CC BY-SA 4.0</td></tr>\n<tr><td>28</td><td><a href="https://commons.wikimedia.org/wiki/File:Harpsichord_Concerto_no._5_in_F_minor%2C_BWV_1056_-_II._Largo.ogg" target="_blank" rel="noopener">Michel Rondeau</a></td><td>CC BY-SA 3.0</td></tr>\n</tbody></table>'''
          s,n=re.subn(table_re,table,s,count=1)
          assert n==1
          s=s.replace('앱은 위 파일을 편집·변형하거나 자체 음원으로 재배포하지 않고 Wikimedia Commons의 원본 직접재생 주소를 연결합니다. 운영 자원시트의 <code>direct_audio</code> 항목만 재생하며, 권리 또는 직접 URL이 보류된 10·11·13·17·22·23·24·27·29번은 자동재생에서 제외합니다.', '앱은 위 파일을 편집·변형하거나 자체 음원으로 재배포하지 않고 Wikimedia Commons의 원본 직접재생 주소를 연결합니다. 2026년 9월 9일 검증한 30곡 저작권 안전 목록을 앱의 우선 재생목록으로 사용하며, 20곡은 Public Domain/CC0, 10곡은 CC BY/BY-SA 계열입니다. MP3 변환본이 실패하면 동일 녹음의 Commons 원본 파일을 대체 후보로 시도합니다.')
          p.write_text(s,encoding='utf-8')

          p=Path('README.md'); s=p.read_text(encoding='utf-8')
          s=re.sub(r'^- 운영 자원시트 `\[음악\]`의 30행.*$', '- 2026-09-09 저작권 안전 최종본 30곡을 앱 내 감사목록으로 반영했습니다. 30곡 모두 MP3 직접재생 주소와 동일 녹음의 Commons 원본 파일을 보관하며, 오래된 자원시트보다 이 감사목록을 우선합니다.', s, count=1, flags=re.M)
          s=re.sub(r'^- 듣는 글의 기존 연주자 표기는.*$', '- 30곡 구성은 Public Domain/CC0 20곡 + CC BY/BY-SA 10곡입니다. 곡 자체 교체는 10·11·13·17·23·24·27·29번 8곡, 22번은 Set Chopin Free의 Frank Levy 녹음으로 같은 곡의 연주만 교체했습니다. 13번은 포레 대신 슈베르트 D.958 II · Paul Pitman · Musopen Public Domain으로 확정했습니다.', s, count=1, flags=re.M)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify syntax and audited set
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check music-audio-data.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
          Path('/tmp/index-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          assert './music-audio-data.js' in s
          assert 'listenAuditedItem' in s and 'listenDisplayCredit' in s
          assert '현재 재생 연주' in s
          assert "const DATA_SCHEMA = 6;" in s and "const KEY = 'ohg.v1';" in s
          assert 'Faur%C3%A9_-_Requiem' not in Path('music-audio-data.js').read_text(encoding='utf-8')
          assert 'Schubert_-_Piano_Sonata_No._19_in_C_minor%2C_D958_-_II._Adagio_%28Paul_Pitman%29' in Path('music-audio-data.js').read_text(encoding='utf-8')
          assert '<td>10</td>' in Path('legal.html').read_text(encoding='utf-8')
          assert '20곡은 Public Domain/CC0, 10곡은 CC BY/BY-SA' in Path('legal.html').read_text(encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node - <<'NODE'
          global.window={}; require('./music-audio-data.js');
          const d=window.MUSIC_AUDIO_AUDITED;
          if(Object.keys(d).length!==30) throw new Error('audited count != 30');
          if(!d['13'].title.includes('D.958') || !d['13'].candidates[0].u.includes('Paul_Pitman')) throw new Error('track 13 mismatch');
          for(let i=1;i<=30;i++){
            const x=d[String(i)];
            if(!x || !x.candidates || x.candidates.length<1) throw new Error('missing '+i);
            if(!x.candidates[0].u.includes('upload.wikimedia.org')) throw new Error('non-Commons primary '+i);
          }
          console.log('audited 30-track validation PASS');
          NODE
      - name: Commit final files and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v8268-music-audited-finalize.yml .github/workflows/v8268-web-patch.yml .github/workflows/v8268-resource-inspect.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html music-audio-data.js sw.js legal.html README.md .github/workflows
          git commit -m 'fix: apply audited 30-track copyright-safe music set'
          git push
