name: Apply and validate V9.0 social stage 1

on:
  push:
    branches: [v9.0-social-stage1]
    paths:
      - '.github/workflows/apply-v90-social-stage1.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0-social-stage1
          fetch-depth: 0

      - name: Apply V9.0 frontend and backend patches
        run: |
          python3 scripts/apply_v90_social.py
          python3 scripts/fix_v90_backend.py

      - name: Verify V9.0 invariants
        run: |
          set -euo pipefail
          grep -F "const BUILD='V9.0';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_SCHEMA = 1;" index.html
          grep -F 'data-t="social"' index.html
          grep -F 'id="p-social"' index.html
          grep -F '오늘의 한 걸음 나누기' index.html
          grep -F '내가 작성한 글만 수정할 수 있습니다.' index.html
          grep -F 'SOCIAL_URL' SOCIAL_SETUP.md
          grep -F "const SOCIAL_VERSION = 'V9.0-social-1';" social-apps-script.gs
          grep -F "error:'NICK_TAKEN'" social-apps-script.gs
          grep -F "const APP_VERSION = 'V9.0';" sw.js
          grep -F "const V = 'ohg-v900-social-stage1';" sw.js
          grep -F "verifiedVersion:'V8.5'" install.html
          grep -F 'oneul-v8.5.apk' install.html
          ! grep -F "const BUILD='V8.5';" index.html

      - name: Verify recovery and social data separation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          a=s.index('const SOCIAL_REPORT_REASONS')
          b=s.index('/* ══════════ 모임 찾기 ══════════',a)
          block=s[a:b]
          forbidden=['S.urges','S.halts','S.relapses','S.screenings','S.meds','S.medLog','S.aiChat','S.dates','S.types']
          for bad in forbidden:
              if bad in block: raise SystemExit('social reads recovery data: '+bad)
          for need in ["localStorage.setItem(SOCIAL_KEY",'function socialEndpoint()','function socialWrite(','function socialReadFeed(','function socialBlock(','function socialReport(']:
              if need not in s: raise SystemExit('missing social invariant: '+need)
          if "localStorage.setItem(KEY, JSON.stringify(SO))" in s:
              raise SystemExit('social state written to recovery KEY')
          print('social/recovery separation PASS')
          PY
          grep -F "tokenHash" social-apps-script.gs
          grep -F "function auth_(userId,token)" social-apps-script.gs
          grep -F "if(str_(r.userId)!==me.userId) return {ok:false,error:'OWNER'};" social-apps-script.gs
          ! grep -Eq 'S\.(urges|halts|relapses|screenings|meds|dates|types)' social-apps-script.gs

      - name: JavaScript and Apps Script syntax checks
        run: |
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
              if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
          open('/tmp/index-inline.js','w',encoding='utf-8').write('\n;\n'.join(blocks))
          PY
          node --check /tmp/index-inline.js
          cp social-apps-script.gs /tmp/social-apps-script.js
          node --check /tmp/social-apps-script.js
          node --check sw.js

      - name: Verify changed scope and whitespace
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          git status --short
          python3 - <<'PY'
          import subprocess
          files=subprocess.check_output(['git','diff','--name-only','HEAD'],text=True).splitlines()
          allowed={'index.html','sw.js','privacy.html','legal.html','README.md','social-apps-script.gs'}
          unexpected=[x for x in files if x not in allowed]
          if unexpected: raise SystemExit('unexpected modified files: '+', '.join(unexpected))
          print('changed scope PASS:', ', '.join(files))
          PY

      - name: Commit validated V9.0 result
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v90-social-stage1.yml scripts/apply_v90_social.py scripts/fix_v90_backend.py
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add index.html sw.js privacy.html legal.html README.md social-apps-script.gs SOCIAL_SETUP.md \
            .github/workflows/apply-v90-social-stage1.yml scripts/apply_v90_social.py scripts/fix_v90_backend.py
          git commit -m 'V9.0 소셜 1단계 · 익명 오늘의 한 걸음'
          git push origin HEAD:v9.0-social-stage1
