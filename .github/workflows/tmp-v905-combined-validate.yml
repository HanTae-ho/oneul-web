name: Validate V9.0.5 combined update

on:
  push:
    branches: [v9.0.5-combined-update]
    paths:
      - 'scripts/apply-v905-combined.py'
      - '.github/workflows/tmp-v905-combined-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V9.0.5 patch
        run: python scripts/apply-v905-combined.py
      - name: Extract scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          n=Path('native.html').read_text(encoding='utf-8')
          nb=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',n,re.S)
          Path('/tmp/native.js').write_text('\n'.join(nb),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          print('index scripts',len(blocks),'native scripts',len(nb))
          PY
      - name: Syntax and undefined-reference checks
        run: |
          node --check /tmp/index-all.js
          node --check /tmp/native.js
          node --check sw.js
          node --check /tmp/social.js
          node --check verify.js
          node --check test.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
      - name: V9.0.5 invariants
        run: |
          set -euo pipefail
          grep -F "const BUILD='V9.0.5';" index.html
          grep -F "const APP_VERSION = 'V9.0.5';" sw.js
          grep -F "const V = 'ohg-v905-update-flow-r1';" sw.js
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.4-social-1';" social-apps-script.gs
          grep -F 'id="social-leave-confirm"' index.html
          ! grep -F 'social-leave-next' index.html
          ! grep -F 'social-leave-word' index.html
          grep -F '>초심 보기</button>' index.html
          grep -F 'id="me-package-update"' index.html
          grep -F '최신 버전 받기' index.html
          grep -F 'latest-release.json' index.html
          grep -F "sessionStorage.setItem('ohg.native.version','V'+raw)" native.html
          grep -F 'appv' native.html
          grep -F 'latest-release.json' sw.js
          grep -F '"version": "V9.0.4"' latest-release.json
          grep -F '"versionCode": 899' latest-release.json
          ! grep -F '탈퇴는 두 번 확인하며' index.html
          ! grep -F 'HALTS.find' index.html
          node verify.js
      - name: Browser regression
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: node test.js
      - name: Commit validated product files
        run: |
          set -euo pipefail
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add index.html native.html sw.js latest-release.json README.md verify.js
          git commit -m 'V9.0.5 탈퇴 단순화·초심 보기·앱 업데이트 안내'
          git push
