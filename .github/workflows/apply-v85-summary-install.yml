name: Apply and validate V8.5 recovery summary and install page

on:
  push:
    branches: [v8.5-recovery-summary-install]
    paths:
      - '.github/workflows/apply-v85-summary-install.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.5-recovery-summary-install
          fetch-depth: 0

      - name: Apply V8.5 patch
        run: |
          python3 scripts/apply_v85_summary_install.py
          python3 scripts/cleanup_v85.py

      - name: Verify V8.5 invariants
        run: |
          set -euo pipefail
          grep -F "const BUILD='V8.5';" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F '최근 4주 내 회복요약' index.html
          grep -F '상담할 때 보여주기' index.html
          grep -F '인쇄 · PDF 저장' index.html
          grep -F "new URL('./install.html'" index.html
          grep -F "verifiedVersion:'V8.4'" install.html
          grep -F 'oneul-v8.4.apk' install.html
          grep -F "const APP_VERSION = 'V8.5';" sw.js
          grep -F "'./install.html'" sw.js
          ! grep -F "const BUILD='V8.4';" index.html

      - name: Verify summary stays local and read-only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          s=open('index.html',encoding='utf-8').read()
          a=s.index('function recoverySummaryWindow()')
          b=s.index('function recPattern(){',a)
          block=s[a:b]
          for bad in ['fetch(', 'aiRequest', 'S.aiChat.push', 'localStorage.setItem']:
              if bad in block: raise SystemExit('unexpected summary side effect: '+bad)
          for need in ['S.urges','S.halts','S.sleepLog','S.habits','S.screenings','S.relapses','recPattern()']:
              if need not in block: raise SystemExit('summary source missing: '+need)
          print('summary local/read-only PASS')
          PY
          grep -F 'nativeReminderIntent({apply:1})' index.html
          grep -F 'nativeReminderIntent({clear:1})' index.html

      - name: JavaScript syntax check
        run: |
          python3 - <<'PY'
          import re
          for fn,out in [('index.html','/tmp/index-inline.js'),('install.html','/tmp/install-inline.js')]:
              s=open(fn,encoding='utf-8').read()
              blocks=[]
              for m in re.finditer(r'<script([^>]*)>([\s\S]*?)</script>',s,re.I):
                  if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
              open(out,'w',encoding='utf-8').write('\n;\n'.join(blocks))
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/install-inline.js

      - name: Diff check
        run: |
          git diff --check
          git diff --stat
          git status --short

      - name: Commit validated V8.5 result
        run: |
          set -euo pipefail
          rm .github/workflows/apply-v85-summary-install.yml scripts/apply_v85_summary_install.py scripts/cleanup_v85.py
          git config user.name 'HanTae-ho'
          git config user.email '64190685+HanTae-ho@users.noreply.github.com'
          git add index.html install.html sw.js privacy.html legal.html README.md .github/workflows/apply-v85-summary-install.yml scripts/apply_v85_summary_install.py scripts/cleanup_v85.py
          git commit -m 'V8.5 내 회복요약 · 고정 설치 안내'
          git push origin HEAD:v8.5-recovery-summary-install
