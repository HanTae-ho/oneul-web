name: Apply V8.1.8 Pre Social Cleanup

on:
  push:
    branches: [v8.1.8-pre-social-cleanup]
    paths:
      - 'v818-pre-social-cleanup.py'
      - '.github/workflows/v818-pre-social-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.8-pre-social-cleanup
      - name: Apply V8.1.8 cleanup
        run: python v818-pre-social-cleanup.py
      - name: Verify JavaScript syntax and data boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          blocks=[b for b in blocks if b.strip()]
          assert blocks, 'inline script not found'
          for i,b in enumerate(blocks):
              Path(f'/tmp/app-{i}.js').write_text(b,encoding='utf-8')
          assert "const DATA_SCHEMA = 2;" in s
          assert "dataSchema: DATA_SCHEMA" in s
          assert "s.dataSchema = DATA_SCHEMA;" in s
          assert "소셜의 닉네임·게시글·댓글·인증정보는 이 KEY/S에 넣지 않고" in s
          assert "내 정보에서 복약과 식사·잠" not in s
          assert "내 정보에서 이 시간을 위험 시간대로" not in s
          assert "내정보에서는 회복 영역·시작일·지역·일정·알림 설정" not in s
          assert "회복도구 → 일정·알림" in s
          print('inline scripts',len(blocks))
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
          grep -q "const APP_VERSION = 'V8.1.8'" sw.js
          grep -q "ohg-v818-pre-social" sw.js
      - name: Verify limited scope
        run: |
          git diff -- index.html sw.js
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit V8.1.8 web files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.1.8 pre-social data and copy cleanup'
          git push
