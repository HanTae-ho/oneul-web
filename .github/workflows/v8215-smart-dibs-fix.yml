name: V8.2.15 SMART DIBS Fix

on:
  push:
    branches: [v8.2.15-smart-dibs]
    paths:
      - 'v8215-smart-dibs-prep.py'
      - '.github/workflows/v8215-smart-dibs-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.15-smart-dibs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Point 3 line
        run: python v8215-smart-dibs-prep.py
      - name: Apply DIBS patch
        run: python v8215-smart-dibs.py
      - name: Verify
        run: |
          grep -q "const BUILD = 'V8.2.15'" index.html
          grep -q 'id="p-smart-dibs"' index.html
          grep -q 'function drawSmartDibs' index.html
          grep -q "kind:'dibs'" index.html
          grep -q "p === 'smart-dibs'" index.html
          grep -q "DIBS · 생각 반박하기" index.html
          grep -q "const APP_VERSION = 'V8.2.15'" sw.js
          grep -q "ohg-v8215-smart-dibs" sw.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.15 add SMART DIBS worksheet'
          git push
