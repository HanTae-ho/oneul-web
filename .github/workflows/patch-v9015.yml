name: Patch V9.0.15 meaning linked urge view

on:
  push:
    branches: [v9.0.15-meaning-linked-urge-view]
    paths:
      - '.github/workflows/patch-v9015.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.15-meaning-linked-urge-view
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply patch
        run: python3 .github/scripts/patch_v9015.py
      - name: Validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks.append(Path('meaning-feature.js').read_text(encoding='utf-8'))
          Path('/tmp/app.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/app.js
          node --check meaning-feature.js
          node --check verify-meaning.js
          node --check verify.js
          node --check sw.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/app.js
          node verify.js
          node verify-meaning.js
          EXPECTED_APP_VERSION=V9.0.15 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';" social-apps-script.gs
          grep -F "verifiedVersion:'V9.0.7'" install.html
          grep -F "function wbUrgesForDate(d)" meaning-feature.js
          grep -F "오늘 기록 보기" meaning-feature.js
          grep -F "기록에서 보인 힘" meaning-feature.js
          grep -F "기록에서 지킨 가치" meaning-feature.js
          git diff --check
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html meaning-feature.js verify-meaning.js verify.js sw.js latest-release.json
          git commit -m 'V9.0.15 link urge records and add record view'
          git push origin HEAD:v9.0.15-meaning-linked-urge-view
