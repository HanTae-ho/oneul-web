name: Apply V9.0.3 social profile

on:
  push:
    branches: [v9.0.3-social-profile-speed]
    paths:
      - 'scripts/apply-v903-social.py'
      - 'scripts/apply-v903-app.py'
      - '.github/workflows/apply-v903-social-profile.yml'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V9.0.3 patches
        run: |
          python scripts/apply-v903-social.py
          python scripts/apply-v903-app.py

      - name: Syntax and undefined-reference checks
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          node --check verify.js
          node --check test.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js

      - name: Fixed V9.0.3 invariants
        run: |
          set -euo pipefail
          grep -F "const BUILD='V9.0.3';" index.html
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const APP_VERSION = 'V9.0.3';" sw.js
          grep -F "const V = 'ohg-v903-social-profile-r1';" sw.js
          grep -F "const SOCIAL_VERSION = 'V9.0.3-social-1';" social-apps-script.gs
          grep -F 'function profileActivity_' social-apps-script.gs
          grep -F 'function feedPublicSnapshot_' social-apps-script.gs
          grep -F "if(p === 'social-profile') drawSocialProfile();" index.html
          grep -F '닉네임은 가입 후 고정됩니다' index.html
          ! grep -F "w.onclick=()=>go('workbook-list');" index.html
          ! grep -F 'HALTS.find' index.html

      - name: Browser regression
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
          node test.js

      - name: Commit verified product changes only
        run: |
          set -euo pipefail
          rm -f shot-*.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-v903-social.py scripts/apply-v903-app.py .github/workflows/apply-v903-social-profile.yml
          git add index.html sw.js social-apps-script.gs README.md SOCIAL_SETUP.md test.js verify.js
          git diff --cached --stat
          git commit -m 'V9.0.3 내 소셜 프로필·피드 최적화·12단계 점검 일원화'
          git push
