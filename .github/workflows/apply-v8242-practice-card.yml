name: Apply V8.2.42 Practice Card Polish

on:
  push:
    branches: [v8.2.42-practice-card-polish]
    paths:
      - '.github/patch-v8242-practice-card.py'
      - '.github/workflows/apply-v8242-practice-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.42-practice-card-polish
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/patch-v8242-practice-card.py
      - name: Verify diff and versions
        run: |
          git diff --check
          grep -q "const BUILD = 'V8.2.42';" index.html
          grep -q "const APP_VERSION = 'V8.2.42';" sw.js
          grep -q "ohg-v8242-practice-card-polish" sw.js
          grep -q "const DATA_SCHEMA = 6;" index.html
          grep -q "const KEY = 'ohg.v1';" index.html
          grep -q "우선 가치" index.html
          grep -q "떠오른 생각" index.html
          grep -q "변화 목표" index.html
          grep -q "균형 잡힌 생각" index.html
          grep -q "내가 지킬 경계" index.html
          grep -q "aria-pressed" index.html
      - name: Verify inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I)
          inline=[b for b in blocks if b.strip()]
          Path('/tmp/inline.js').write_text('\n'.join(inline),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check sw.js
      - name: Commit verified app changes and remove temporary files
        run: |
          rm -f .github/patch-v8242-practice-card.py .github/workflows/apply-v8242-practice-card.yml
          git config user.name "HanTae-ho"
          git config user.email "64190685+HanTae-ho@users.noreply.github.com"
          git add README.md index.html sw.js
          git rm --cached -f .github/patch-v8242-practice-card.py .github/workflows/apply-v8242-practice-card.yml 2>/dev/null || true
          git add -u
          git commit -m "V8.2.42 실천기록 카드 표시 개선"
          git push origin HEAD:v8.2.42-practice-card-polish
