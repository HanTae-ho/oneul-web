name: V8.2.3 SMART Recovery learning

on:
  push:
    branches: [v8.2.3-smart-recovery-learn]
    paths:
      - 'v823-smart-learning.py'
      - '.github/workflows/v823-smart-learning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.3-smart-recovery-learn
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SMART learning patch
        run: python v823-smart-learning.py
      - name: Verify learning data syntax and content
        run: |
          node --check learning-data.js
          grep -q '"id": "smart-recovery"' learning-data.js
          grep -q 'Point 1 · 동기 부여 및 유지' learning-data.js
          grep -q 'Point 2 · 충동에 대처하기' learning-data.js
          grep -q 'Point 3 · 생각·감정·행동 관리하기' learning-data.js
          grep -q 'Point 4 · 균형 잡힌 삶 살기' learning-data.js
          grep -q "type === 'urge-diary'" index.html
          grep -q "const BUILD = 'V8.2.3'" index.html
          grep -q "const APP_VERSION = 'V8.2.3'" sw.js
      - name: Verify main inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          if not blocks:
              raise SystemExit('no inline script')
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
      - name: Diff hygiene
        run: |
          git diff --check
          git diff --name-only | sort
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html learning-data.js sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.3 add SMART Recovery learning' || true
          git push
