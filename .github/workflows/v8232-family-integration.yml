name: Validate V8.2.32 family integration

on:
  push:
    branches: [v8.2.32-family-integration-links]
    paths:
      - 'v8232-family-integration.py'
      - '.github/workflows/v8232-family-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.32-family-integration-links
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V8.2.32 patch
        run: python v8232-family-integration.py
      - name: Validate syntax and invariants
        run: |
          python - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=[]
          for m in re.finditer(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' not in m.group(1).lower(): blocks.append(m.group(2))
          pathlib.Path('/tmp/index-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          node --check learning-data.js
          node --check sw.js
          grep -F "const BUILD = 'V8.2.32';" index.html
          grep -F "const APP_VERSION = 'V8.2.32';" sw.js
          grep -F "ohg-v8232-family-integration-links" sw.js
          grep -F "가족모드에서는 내 삶과 내 반응을 중심으로 사용합니다." index.html
          grep -F "Point 2의 충동대응·충동일지는 충동을 직접 경험하는 당사자의 도구입니다." index.html
          grep -F '"id": "smart-point2"' learning-data.js
          grep -F '"actions": []' learning-data.js
          grep -F "당사자의 충동을 이해하기 위한 참고 영역이며, 가족이 상대의 충동을 기록하거나 관리하지 않습니다." learning-data.js
          grep -F "a:'smart-cba', al:'내 행동 CBA로 살펴보기'" index.html
          grep -F "a:'smart-balance-pie', al:'내 삶의 균형 살펴보기'" index.html
          grep -F "a:'family-meet', al:'가족 모임 찾아보기'" index.html
          grep -F "function familyGuideRun(action)" index.html
          grep -F "DEADS·DISARM·충동일기는 충동을 직접 경험하는 당사자를 위한 도구입니다." index.html
          grep -F "가족은 충동·재발을 기록하지 않습니다" index.html
          grep -F "DATA_SCHEMA = 6" index.html
          grep -F "relaxNativeOpen" index.html
          git diff --check
      - name: Verify scope
        run: |
          CHANGED=$(git diff --name-only | sort)
          echo "$CHANGED"
          test "$CHANGED" = $'README.md\nindex.html\nlearning-data.js\nsw.js'
      - name: Commit product files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html learning-data.js sw.js
          git commit -m 'V8.2.32 가족모드 통합 정합성 및 기존 도구 연결'
          git push
