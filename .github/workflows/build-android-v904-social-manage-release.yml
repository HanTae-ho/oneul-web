name: Build and publish V9.0.4 Android prerelease

on:
  push:
    branches: [android-v9.0.4-social-manage-release2]
    paths:
      - 'android-v9.0.4-social-manage-release.sh'
      - '.github/workflows/build-android-v904-social-manage-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify exact web main sync
        run: |
          set -euo pipefail
          git fetch --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "32f0dc6717044154eba097ecb23271ca8c29d373"
          for f in README.md SOCIAL_SETUP.md icon-180.png icon-192.png icon-32.png icon-512.png index.html install.html learning-data.js legal.html manifest.json music-audio-data.js native.html privacy.html qa-data.js screening-data.js social-apps-script.gs sw.js test.js verify.js workbook-data.js; do
            git show FETCH_HEAD:"$f" > /tmp/main-file
            cmp -s "$f" /tmp/main-file || { echo "main sync mismatch: $f"; exit 1; }
          done
          echo 'web main 32f0dc6 sync PASS'

      - name: Verify V9.0.4 web and social
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          node --check verify.js
          node --check test.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          grep -F "const BUILD='V9.0.4';" index.html
          grep -F "const APP_VERSION = 'V9.0.4';" sw.js
          grep -F "const V = 'ohg-v904-social-manage-r1';" sw.js
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          ! grep -F 'HALTS.find' index.html
          grep -F 'id="social-profile-manage"' index.html
          grep -F 'function socialProfileManageMenu()' index.html
          ! grep -F 'card social-profile-danger' index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.4-social-1';" social-apps-script.gs
          grep -F 'NICK_REUSE_COOLDOWN_MS = 30 * 24 * 60 * 60 * 1000' social-apps-script.gs
          grep -F "error:'NICK_COOLDOWN'" social-apps-script.gs
          grep -F 'function profileActivity_' social-apps-script.gs
          node verify.js

      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8

      - name: Apply V9.0.4 package revision
        run: bash android-v9.0.4-social-manage-release.sh

      - name: Verify preserved reminder and TTS engines
        run: |
          set -euo pipefail
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          ACT="$PKG/NotificationSettingsActivity.java"
          grep -F 'ReminderStore.importSchedule(this, "", "", "", "", val(u, "build"))' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, "")' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, "", "", TreatmentReminderStore.time(this), 0)' "$ACT"
          grep -F 'String visitAlerts = TreatmentReminderStore.alertsPacked(this)' "$ACT"
          grep -F 'String visitTime = TreatmentReminderStore.time(this)' "$ACT"
          grep -F 'ReminderStore.importSchedule(this, pendingRisk, pendingMeds, pendingEats, pendingBed, pendingBuild)' "$ACT"
          grep -F 'HabitReminderStore.importSchedule(this, pendingHabits)' "$ACT"
          grep -F 'TreatmentReminderStore.importSchedule(this, pendingVisit, visitAlerts, visitTime, pendingVisitInterval)' "$ACT"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"

      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease

      - name: Verify APK version permissions and package
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"
          test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='899' versionName='9.0.4'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          cp "$APK" oneul-v9.0.4.apk
          cp "$AAB" oneul-v9.0.4.aab
          sha256sum oneul-v9.0.4.apk oneul-v9.0.4.aab | tee SHA256SUMS.txt

      - name: Upload release files artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneul-v9.0.4-release-files
          path: |
            oneul-v9.0.4.apk
            oneul-v9.0.4.aab
            SHA256SUMS.txt

      - name: Publish V9.0.4 test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v9.0.4-test --yes --cleanup-tag || true
          gh release create v9.0.4-test oneul-v9.0.4.apk oneul-v9.0.4.aab SHA256SUMS.txt \
            --target android-v9.0.4-social-manage-release2 \
            --title '오늘 한 걸음 V9.0.4 소셜 관리 테스트 릴리즈' \
            --notes 'V9.0.4 테스트 릴리즈입니다. 내 소셜 프로필 제목 오른쪽 ⋮에 차단 사용자 관리와 소셜 탈퇴를 통합하고, 평상시 화면의 닉네임 고정 안내·차단 사용자 카드·큰 탈퇴 카드를 제거해 활동 목록 중심으로 단순화했습니다. 탈퇴는 두 번 확인하며 사용하던 닉네임은 30일 동안 본인과 다른 사용자 모두 재사용할 수 없습니다. 30일 이후 다시 사용할 수 있습니다. 소셜 서버 소스는 V9.0.4-social-1입니다. 개인 회복기록 DATA_SCHEMA=6 / ohg.v1, 소셜 로컬 키 ohg.social.v1은 유지합니다. Android는 기존 검증된 네이티브 알림/TTS 스택을 변경하지 않고 versionCode 899 / versionName 9.0.4만 적용하며 정확알림, 화면 OFF 알림, 부팅 후 재예약, 복약·외래·생활·습관 알림, silent reminder apply/clear, 마음프로 네이티브 음성, 이완 TTS 엔진을 빌드에서 정적 검증합니다. 웹 main SHA: 32f0dc6717044154eba097ecb23271ca8c29d373. Google Apps Script 실제 V9.0.4-social-1 배포는 GitHub 릴리즈와 별도이며, 실기기 최종 확인 전이므로 prerelease를 유지합니다.' \
            --prerelease
