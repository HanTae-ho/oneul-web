name: Apply V8.2.0 Future Self Text

on:
  push:
    branches: [v8.2.0-future-self-text]
    paths:
      - 'v820-future-self-text.py'
      - '.github/workflows/v820-future-self-text.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.0-future-self-text
      - name: Apply V8.2.0 future-self text patch
        run: python v820-future-self-text.py
      - name: Verify JavaScript and future-self flow
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=[b for b in re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s) if b.strip()]
          assert blocks
          for i,b in enumerate(blocks): Path(f'/tmp/app-{i}.js').write_text(b,encoding='utf-8')
          checks=[
            "const BUILD = 'V8.2.0';",
            'const DATA_SCHEMA = 3;',
            'timeCapsule:',
            'id="p-capsule"',
            'id="tool-capsule"',
            'id="go-capsule-panic"',
            "function capsuleHas()",
            "function drawCapsule()",
            "openCapsule('tools',false)",
            "openCapsule('panic',false)",
            "cp.classList.toggle('hide', famMode() || !capsuleHas())",
            "p === 'capsule'",
            "if(p === 'capsule') drawCapsule();",
            'maxlength="800"'
          ]
          for x in checks: assert x in s, x
          assert '음성' not in s[s.index('<!-- ══════════ 미래의 나에게 V8.2.0'):s.index('<!-- ══════════ 자가점검 V7.1')]
          PY
          for f in /tmp/app-*.js; do node --check "$f"; done
          grep -q "const APP_VERSION = 'V8.2.0'" sw.js
          grep -q "ohg-v820-future-self" sw.js
      - name: Verify limited scope
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html sw.js "
      - name: Commit V8.2.0 web files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.0 add future-self text time capsule'
          git push
