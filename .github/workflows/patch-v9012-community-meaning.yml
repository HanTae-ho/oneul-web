name: Patch V9.0.12 community and meaning UI

on:
  push:
    branches: [v9.0.12-community-meaning-ui]
    paths:
      - '.github/workflows/patch-v9012-community-meaning.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.12-community-meaning-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped patch
        run: python3 patch-v9012-community-meaning.py
      - name: Validate runtime and invariants
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks.append(Path('meaning-feature.js').read_text(encoding='utf-8'))
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social-apps-script.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check meaning-data.js
          node --check meaning-feature.js
          node --check verify-meaning.js
          node --check verify.js
          node --check sw.js
          node --check /tmp/social-apps-script.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
          EXPECTED_APP_VERSION=V9.0.12 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const TABBED = ['home','tools','help','ai','social'];" index.html
          grep -F 'data-mn-view="today"' index.html
          grep -F 'data-mn-view="history"' index.html
          grep -F "{k:'recoveryWill', l:'회복하려는 마음'}" meaning-data.js
          grep -F "{k:'help', l:'도움받을 사람'}" meaning-data.js
          grep -F '>커뮤니티</button>' index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';" social-apps-script.gs
          grep -F "verifiedVersion:'V9.0.7'" install.html
          git diff --check
      - name: Commit validated patch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html meaning-data.js meaning-feature.js verify-meaning.js verify.js sw.js latest-release.json
          git commit -m 'V9.0.12 community label and meaning tabs'
          git push origin HEAD:v9.0.12-community-meaning-ui
