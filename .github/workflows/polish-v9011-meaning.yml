name: Polish V9.0.11 meaning flow

on:
  push:
    branches: [v9.0.11-meaning-refined]
    paths:
      - '.github/workflows/polish-v9011-meaning.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.11-meaning-refined
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final UX consistency fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          old="  } else if(night.kept === 0){"
          new="  } else if(night.kept === 0 && niAfter !== 'meaning'){"
          if s.count(old)!=1: raise SystemExit('night meaning priority anchor mismatch')
          s=s.replace(old,new,1)
          old='<p style="margin-top:8px"><b>실천하기</b> — 12단계 점검, 회복 실천도구, 충동일기, 미래의 나에게 등을 사용합니다. 가족·보호자 모드에서는 가족을 위한 도구 중심으로 구성이 달라집니다.</p>'
          new='<p style="margin-top:8px"><b>실천하기</b> — 의미 돌아보기, 12단계 점검, 회복 실천도구, 충동일기, 미래의 나에게 등을 사용합니다. 가족·보호자 모드에서는 가족을 위한 도구 중심으로 구성이 달라집니다.</p>'
          if s.count(old)!=1: raise SystemExit('manual meaning anchor mismatch')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          q=Path('verify-meaning.js'); v=q.read_text(encoding='utf-8')
          anchor="ok(/\\$\\('#ni-meaning'\\)\\.style\\.display = fam \\? 'none' : ''/.test(index),'가족모드 하루마무리 우회 버튼 숨김');"
          extra="\nok(/night\\.kept === 0 && niAfter !== 'meaning'/.test(index),'당사자가 의미 돌아보기를 선택하면 재발 안내보다 해당 진입을 우선');"
          if extra.strip() not in v:
            if v.count(anchor)!=1: raise SystemExit('verify night priority anchor mismatch')
            v=v.replace(anchor,anchor+extra,1)
          q.write_text(v,encoding='utf-8')
          PY
      - name: Validate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks.append(Path('meaning-feature.js').read_text(encoding='utf-8'))
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check verify-meaning.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
          EXPECTED_APP_VERSION=V9.0.11 node release-version-check.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html verify-meaning.js
          git commit -m 'Polish meaning reflection entry flow and manual'
          git push origin HEAD:v9.0.11-meaning-refined
