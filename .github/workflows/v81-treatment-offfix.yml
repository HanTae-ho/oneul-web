name: V8.1 Treatment Off Sync Fix

on:
  push:
    branches: [v8.1-treatment-management]
    paths:
      - 'tools/fix_v81_treatment_off.py'
      - '.github/workflows/v81-treatment-offfix.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1-treatment-management
          fetch-depth: 0
      - run: python3 tools/fix_v81_treatment_off.py
      - name: Validate
        run: |
          grep -q 'Android 예약알림에도 반영' index.html
          grep -q '위험한 시간대 · 식사 · 잠 · 알림' index.html
          python3 - <<'PY'
          import re,pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.S|re.I)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          git diff --check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix V8.1 treatment off reminder sync"
          git push origin HEAD:v8.1-treatment-management
