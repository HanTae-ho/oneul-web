name: Apply V8.1.4 Recovery Tools

on:
  push:
    branches: [v8.1.4-tools-practice]
    paths:
      - 'v814-tools-practice-patch.py'
      - '.github/workflows/v814-tools-practice.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.4-tools-practice
      - name: Apply recovery tools and schedule hub patch
        run: python3 v814-tools-practice-patch.py
      - name: Verify UI structure and JavaScript syntax
        run: |
          grep -q '오늘의 실천' index.html
          grep -q 'id="p-schedule"' index.html
          grep -q 'id="p-life-schedule"' index.html
          grep -q 'id="p-notify-schedule"' index.html
          grep -q "const BUILD = 'V8.1.4'" index.html
          grep -q "const APP_VERSION = 'V8.1.4'" sw.js
          grep -q "const V = 'ohg-v814-tools-practice'" sw.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          for x in ['me-hours','me-eats','me-sleep-on','me-sleep','me-notify','me-notify-st']:
              assert s.count('id="'+x+'"') == 1, (x, s.count('id="'+x+'"'))
          scripts=[]
          for attrs,body in re.findall(r'<script([^>]*)>(.*?)</script>',s,re.S|re.I):
              if 'src=' not in attrs.lower(): scripts.append(body)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
      - name: Commit patched web files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git diff --cached --check
          git commit -m 'V8.1.4 reorganize recovery tools and schedule hub'
          git push
