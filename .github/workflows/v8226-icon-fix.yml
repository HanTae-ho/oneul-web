name: Validate V8.2.26 icon fix

on:
  push:
    branches: [v8.2.26-relaxation]
    paths:
      - 'v8226-icon-fix.py'
      - '.github/workflows/v8226-icon-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.26-relaxation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply icon fix
        run: python v8226-icon-fix.py
      - name: Validate icon and JS
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert "smartToolButton('이완 · 마음 가라앉히기','알아차림 → PMR · 심상화 · 명상 중 하나 사용하기','smart-relax','sprout')" in s
          assert "smart-relax','wave'" not in s
          # sprout must actually be a key in ICO, not just referenced elsewhere.
          m=re.search(r'const ICO\s*=\s*\{(.*?)\n\};',s,re.S)
          assert m and re.search(r'\bsprout\s*:',m.group(1)), 'sprout icon key missing from ICO'
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(x for x in scripts if x.strip()),encoding='utf-8')
          PY
          node --check /tmp/index-inline.js
          git diff --check
          test "$(git diff --name-only)" = "index.html"
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use existing SVG icon for V8.2.26 relaxation tool'
          git push origin HEAD:v8.2.26-relaxation
