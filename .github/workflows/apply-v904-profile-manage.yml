name: Apply V9.0.4 profile management

on:
  push:
    branches: [v9.0.4-profile-manage-nick-cooldown]
    paths:
      - 'scripts/apply-v904-profile-manage.py'
      - '.github/workflows/apply-v904-profile-manage.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V9.0.4 patch
        run: python scripts/apply-v904-profile-manage.py
      - name: Extract browser scripts
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
      - name: Syntax and undefined-reference checks
        run: |
          set -euo pipefail
          node --check /tmp/index-all.js
          node --check /tmp/social.js
          node --check sw.js
          node --check verify.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
      - name: V9.0.4 invariants
        run: |
          set -euo pipefail
          grep -F "const BUILD='V9.0.4';" index.html
          grep -F "const APP_VERSION = 'V9.0.4';" sw.js
          grep -F "const V = 'ohg-v904-social-manage-r1';" sw.js
          grep -F 'const DATA_SCHEMA = 6;' index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F 'id="social-profile-manage"' index.html
          grep -F 'function socialProfileManageMenu()' index.html
          grep -F "const SOCIAL_VERSION = 'V9.0.4-social-1';" social-apps-script.gs
          grep -F 'NICK_REUSE_COOLDOWN_MS = 30 * 24 * 60 * 60 * 1000' social-apps-script.gs
          grep -F "error:'NICK_COOLDOWN'" social-apps-script.gs
          ! grep -F 'card social-profile-danger' index.html
      - name: Commit product changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js social-apps-script.gs README.md SOCIAL_SETUP.md verify.js
          git diff --cached --stat
          git commit -m 'V9.0.4 소셜 관리 단순화·닉네임 30일 보호'
          git push
