name: V8.2.12 Future Self DISARM Link

on:
  push:
    branches: [v8.2.12-capsule-disarm-link]
    paths:
      - 'v8212-capsule-disarm-link.py'
      - '.github/workflows/v8212-capsule-disarm-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.12-capsule-disarm-link
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V8.2.12 patch
        run: python v8212-capsule-disarm-link.py
      - name: Verify V8.2.12
        run: |
          grep -q "const BUILD = 'V8.2.12'" index.html
          grep -q "const APP_VERSION = 'V8.2.12'" sw.js
          grep -q "ohg-v8212-capsule-disarm-link" sw.js
          grep -q 'id="smart-disarm-capsule"' index.html
          grep -q 'id="capsule-disarm-link"' index.html
          grep -q "openCapsule('smart-disarm',false)" index.html
          grep -q "capsuleFrom==='smart-disarm'" index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          assert 'capsule-disarm-link' in s
          assert 'smart-disarm-capsule-open' in s
          assert "capsuleFrom=from==='panic'?'panic':(from==='smart-disarm'?'smart-disarm':'tools');" in s
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Commit V8.2.12 product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'V8.2.12 link Future Self and DISARM'
          git push
