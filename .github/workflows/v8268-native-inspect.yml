name: V8.2.68 native reminder inspect
on:
  push:
    branches: [android-v8.2.68-reminder-sync]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate current Android source and inspect reminder stores
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/android-v8.2.67-legal-release.sh"
          PKG="$GITHUB_WORKSPACE/android-v8/app/src/main/java/io/github/hantae_ho/twa"
          echo '=== ReminderStore ==='
          cat "$PKG/ReminderStore.java"
          echo '=== NotificationSettings relevant ==='
          grep -n -E 'onCreate|loadIncoming|importSchedule|pendingRisk|pendingHabits|pendingVisit|saveAndReturn|setEnabled|enabledSwitch' "$PKG/NotificationSettingsActivity.java" || true
          echo '=== HabitReminderStore ==='
          sed -n '1,180p' "$PKG/HabitReminderStore.java"
          echo '=== TreatmentReminderStore ==='
          sed -n '1,180p' "$PKG/TreatmentReminderStore.java"
