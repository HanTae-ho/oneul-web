name: Patch V9.0.16 meaning check
on:
  push:
    branches:
      - v9.0.16-meaning-check
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.0.16-meaning-check
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify V9.0.16
        run: |
          python3 .github/scripts/patch-v9016.py
          sed -i "s/const BUILD='V9.0.15';/const BUILD='V9.0.16';/g; s/V9.0.15 BUILD 불일치/V9.0.16 BUILD 불일치/g" verify.js
          node --check meaning-feature.js
          node --check meaning-check-feature.js
          node verify-meaning.js
          node verify.js
          git diff --check
      - name: Commit final patch and remove temporary files
        run: |
          rm .github/workflows/patch-v9016-meaning-check.yml
          rm .github/scripts/patch-v9016.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "V9.0.16 add meaning recovery quick check"
          git push origin HEAD:v9.0.16-meaning-check
