name: Apply V8.1.3 Schedule Hub

on:
  push:
    branches: [v8.1.3-schedule-hub]
    paths:
      - 'v813-schedule-hub-patch.py'
      - '.github/workflows/v813-schedule-hub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.1.3-schedule-hub
      - name: Apply schedule hub patch
        run: python3 v813-schedule-hub-patch.py
      - name: Verify scope and markers
        run: |
          git diff --check
          grep -F "<b>일정·알림</b>" index.html
          grep -F "복약·외래 일정 설정" index.html
          grep -F "const BUILD = 'V8.1.3';" index.html
          grep -F "const APP_VERSION = 'V8.1.3';" sw.js
          grep -F "const V = 'ohg-v813-schedulehub';" sw.js
          ! grep -F "<b>치료관리</b><span>복약 · 처방일수 · 외래 일정 · 치료 알림</span>" index.html
          grep -F "treat: null" index.html
          grep -F "function treatmentCfg()" index.html
          grep -F "openNativeReminderSettings" index.html
      - name: Commit patched web files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js README.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
          else
            git commit -m "V8.1.3 unify schedule and reminder menu"
            git push origin HEAD:v8.1.3-schedule-hub
          fi
