name: Build V9.0.17 meaning check UX prerelease

on:
  push:
    branches: [android-v9.0.17-meaning-check-ux-release]
    paths:
      - '.github/workflows/release-v9017-meaning-check-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: android-v9.0.17-meaning-check-ux-release
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Synchronize exact V9.0.17 source from merged main
        run: |
          set -euo pipefail
          MAIN_SHA=9b881fc6b849ef8ebda6a08b46036f86de94b7de
          git fetch origin "$MAIN_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$MAIN_SHA"
          for f in index.html sw.js verify.js verify-meaning.js meaning-data.js meaning-feature.js meaning-check-feature.js workbook-data.js install.html latest-release.json native.html release-version-check.js social-apps-script.gs .github/workflows/check-web-runtime.yml; do
            mkdir -p "$(dirname "$f")"
            git show "$MAIN_SHA:$f" > "$f"
          done
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)
          blocks.append(Path('meaning-feature.js').read_text(encoding='utf-8'))
          blocks.append(Path('meaning-check-feature.js').read_text(encoding='utf-8'))
          Path('/tmp/index-all.js').write_text('\n'.join(blocks),encoding='utf-8')
          Path('/tmp/social-apps-script.js').write_text(Path('social-apps-script.gs').read_text(encoding='utf-8'),encoding='utf-8')
          PY
          node --check /tmp/index-all.js
          node --check sw.js
          node --check meaning-data.js
          node --check meaning-feature.js
          node --check meaning-check-feature.js
          node --check verify-meaning.js
          node --check /tmp/social-apps-script.js
          npx --yes eslint@8.57.1 --no-eslintrc --env browser,es2022 --parser-options '{"ecmaVersion":2022,"sourceType":"script"}' --rule 'no-undef:error' /tmp/index-all.js
          node verify.js
          node verify-meaning.js
          EXPECTED_APP_VERSION=V9.0.17 node release-version-check.js
          grep -F "const DATA_SCHEMA = 6;" index.html
          grep -F "const KEY = 'ohg.v1';" index.html
          grep -F "const SOCIAL_KEY = 'ohg.social.v1';" index.html
          grep -F "const TABBED = ['home','tools','help','ai','social'];" index.html
          grep -F '>커뮤니티</button>' index.html
          grep -F 'id="tool-meaning-check-direct"' index.html
          grep -F 'function openMeaningCheckDirect()' meaning-check-feature.js
          grep -F '점검 기록' meaning-check-feature.js
          grep -F '결과 저장 완료' meaning-check-feature.js
          grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';" social-apps-script.gs
          grep -F "verifiedVersion:'V9.0.15'" install.html
          git diff --check
      - name: Commit synchronized source before release tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js verify.js verify-meaning.js meaning-data.js meaning-feature.js meaning-check-feature.js workbook-data.js install.html latest-release.json native.html release-version-check.js social-apps-script.gs .github/workflows/check-web-runtime.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Synchronize V9.0.17 release source with merged main'
            git push origin HEAD:android-v9.0.17-meaning-check-ux-release
          fi
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Extract Android source
        run: |
          rm -rf android-v8
          mkdir android-v8
          unzip -q android-v8-source.zip -d android-v8
      - name: Apply V9.0.17 Android package revision and cross-check
        run: bash android-v9.0.17-meaning-check-ux-release.sh
      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/android-v8/signing.keystore"
      - name: Create signing properties
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat > android-v8/keystore.properties <<EOF
          storeFile=$GITHUB_WORKSPACE/android-v8/signing.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
      - name: Build signed V9.0.17 APK and AAB
        run: gradle -p android-v8 :app:assembleRelease :app:bundleRelease
      - name: Verify package and preserved native engines
        run: |
          set -euo pipefail
          APK=$(find android-v8/app/build/outputs/apk/release -name '*.apk' -type f | head -1)
          AAB=$(find android-v8/app/build/outputs/bundle/release -name '*.aab' -type f | head -1)
          test -s "$APK"; test -s "$AAB"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee /tmp/badging.txt
          grep -F "package: name='io.github.hantae_ho.twa' versionCode='912' versionName='9.0.17'" /tmp/badging.txt
          "$AAPT" dump permissions "$APK" | tee /tmp/permissions.txt
          grep -F 'android.permission.SCHEDULE_EXACT_ALARM' /tmp/permissions.txt
          grep -F 'android.permission.WAKE_LOCK' /tmp/permissions.txt
          grep -F 'android.permission.POST_NOTIFICATIONS' /tmp/permissions.txt
          grep -F 'android.permission.RECEIVE_BOOT_COMPLETED' /tmp/permissions.txt
          ! grep -Eq 'android.permission.(RECORD_AUDIO|CAMERA|READ_CONTACTS|WRITE_CONTACTS|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)' /tmp/permissions.txt
          PKG=android-v8/app/src/main/java/io/github/hantae_ho/twa
          grep -F 'handleSilentSync(getIntent())' "$PKG/NotificationSettingsActivity.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/ReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/HabitReminderScheduler.java"
          grep -F 'setExactAndAllowWhileIdle' "$PKG/TreatmentReminderScheduler.java"
          grep -F 'scheduleNextForOffset' "$PKG/TreatmentAlarmReceiver.java"
          grep -F 'PowerManager.PARTIAL_WAKE_LOCK' "$PKG/RelaxTtsActivity.java"
          grep -F 'TextToSpeech.QUEUE_FLUSH' "$PKG/MindProVoiceService.java"
          cp "$APK" oneul-v9.0.17.apk
          cp "$AAB" oneul-v9.0.17.aab
          sha256sum oneul-v9.0.17.apk oneul-v9.0.17.aab > SHA256SUMS.txt
      - name: Create V9.0.17 prerelease at exact synchronized source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v9.0.17-test >/dev/null 2>&1; then exit 1; fi
          git tag v9.0.17-test "$SOURCE_SHA"
          git push origin refs/tags/v9.0.17-test
          gh release create v9.0.17-test oneul-v9.0.17.apk oneul-v9.0.17.aab SHA256SUMS.txt \
            --title '오늘 한 걸음 V9.0.17 테스트 릴리즈' --prerelease \
            --notes 'V9.0.17은 의미회복 간편점검의 저장·진입·조회 UX를 단순화합니다. 회복도구 실천하기에 의미점검 바로하기를 추가해 오늘 의미기록 팝업을 거치지 않고 직접 점검할 수 있고, 의미점검 안을 점검하기/점검 기록으로 분리했습니다. 작성 중 답변은 임시저장, 완료결과는 결과 저장으로 구분하며 저장 직후 완료 상태를 명확히 표시합니다. 점검 기록에서 날짜별 총점과 4개 영역 및 이전 결과와의 변화를 다시 볼 수 있고, 같은 날 재점검 시 새 결과를 저장할 때 오늘 완료결과 하나만 교체합니다. 10문항·0~4점·4개 영역 계산은 유지됩니다. DATA_SCHEMA=6, ohg.v1, ohg.social.v1, 소셜 Apps Script 및 Android 정확알림·화면 OFF 알림·부팅 재예약·치료/습관 알림·마음프로 음성·이완 TTS 엔진은 유지됩니다. Android는 versionCode 912 / versionName 9.0.17입니다. 실기기 확인 전 prerelease이며 설치 권장판은 V9.0.15로 유지합니다.'
      - name: Verify release source and asset names
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-list -n 1 v9.0.17-test)" = "$SOURCE_SHA"
          git show v9.0.17-test:index.html | grep -F "const BUILD='V9.0.17';"
          git show v9.0.17-test:index.html | grep -F 'id="tool-meaning-check-direct"'
          git show v9.0.17-test:meaning-check-feature.js | grep -F 'function openMeaningCheckDirect()'
          git show v9.0.17-test:meaning-check-feature.js | grep -F '점검 기록'
          git show v9.0.17-test:meaning-check-feature.js | grep -F '결과 저장 완료'
          git show v9.0.17-test:sw.js | grep -F "const APP_VERSION = 'V9.0.17';"
          git show v9.0.17-test:latest-release.json | grep -F '"version": "V9.0.17"'
          git show v9.0.17-test:social-apps-script.gs | grep -F "const SOCIAL_VERSION = 'V9.0.7-social-1';"
          git show v9.0.17-test:install.html | grep -F "verifiedVersion:'V9.0.15'"
          gh release view v9.0.17-test --json isPrerelease,assets --jq '.isPrerelease == true and ([.assets[].name] | sort) == (["SHA256SUMS.txt","oneul-v9.0.17.aab","oneul-v9.0.17.apk"] | sort)' | grep -F true
          echo "V9.0.17 prerelease completed at source $SOURCE_SHA"
