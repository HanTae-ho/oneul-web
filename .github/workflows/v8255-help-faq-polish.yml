name: Polish V8.2.55 help FAQ

on:
  push:
    branches: [v8.2.55-help-faq-2]
    paths:
      - '.github/workflows/v8255-help-faq-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.55-help-faq-2
      - name: Restore existing accordion heading style and move admin comment
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""  .acc-b{display:none;padding:2px 16px 16px}\n  .acc.on .acc-b{display:block}\n\n  /* ── 도움말 · 자주 묻는 질문 ── */"""
          new="""  .acc-b{display:none;padding:2px 16px 16px}\n  .acc.on .acc-b{display:block}\n  .acc-b h3{margin:0 0 10px;font-size:15px;font-weight:600}\n\n  /* ── 도움말 · 자주 묻는 질문 ── */"""
          assert s.count(old)==1
          s=s.replace(old,new,1)

          comment="""  <!-- 목록을 고치는 사람(팀장님)만 들어갑니다. 자물쇠는 화면을 정리하기 위한 것이지\n       목록을 지키는 것이 아닙니다 — 목록을 지키는 것은 구글 계정입니다. -->\n"""
          support_start="""  <div class=\"acc\">\n    <button class=\"acc-h\">\n      <span class=\"acc-n\"><b>지원 및 안내</b>"""
          assert s.count(comment)==1
          assert s.count(support_start)==1
          s=s.replace(comment+support_start, support_start, 1)
          admin_start="""  <div class=\"acc\">\n    <button class=\"acc-h\">\n      <span class=\"acc-n\"><b>관리자</b>"""
          assert s.count(admin_start)==1
          s=s.replace(admin_start, comment+admin_start, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: |
          grep -F '.acc-b h3{margin:0 0 10px;font-size:15px;font-weight:600}' index.html
          git diff --check
          python - <<'PY'
          from pathlib import Path
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          for i,code in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',h,flags=re.S|re.I)):
              if code.strip(): Path(f'/tmp/inline-{i}.js').write_text(code,encoding='utf-8')
          PY
          for f in /tmp/inline-*.js; do node --check "$f"; done
      - name: Commit polish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'V8.2.55 도움말 UI 회귀 보정'
          git push
