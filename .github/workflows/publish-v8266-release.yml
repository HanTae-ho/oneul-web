name: Publish V8.2.66 test release

on:
  push:
    branches: [android-v8.2.66-manual-reclaim-label]
    paths:
      - '.github/workflows/publish-v8266-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.66 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34231600695 -n oneul-v8.2.66-manual-reclaim-label-apk -D dist-apk
          gh run download 34231600695 -n oneul-v8.2.66-manual-reclaim-label-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.66.apk
          cp dist-aab/*.aab oneul-v8.2.66.aab
          test -s oneul-v8.2.66.apk
          test -s oneul-v8.2.66.aab
          sha256sum oneul-v8.2.66.apk oneul-v8.2.66.aab | tee SHA256SUMS.txt
      - name: Publish V8.2.66 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.66-test --yes --cleanup-tag || true
          gh release create v8.2.66-test oneul-v8.2.66.apk oneul-v8.2.66.aab SHA256SUMS.txt \
            --target android-v8.2.66-manual-reclaim-label \
            --title '오늘 한 걸음 V8.2.66 사용설명서 현행화 · 회복 실천 테스트' \
            --notes '현재 나 메뉴 구조에 맞춰 도움말과 사용설명서 경로를 현행화하고, 내가 되찾은 것의 실천한 습관 명칭을 회복 실천으로 변경했습니다. 설명은 내가 실천하고 기록한 회복 행동으로 정리했습니다. 되찾은 시간·지킨 비용 계산식과 기준 설정, 도박 회복영역의 금액 누적 계산 차단, 24×24 직접 SVG 아이콘, DATA_SCHEMA=6, ohg.v1은 그대로 유지합니다. 관리자·마음프로·자원시트·기존 회복기록 구조는 변경하지 않았습니다. Android는 검증된 V8.2.65 네이티브 스택을 그대로 사용하고 versionCode 886 / versionName 8.2.66만 적용했습니다. 정확알림·화면 OFF 알림·부팅 재예약·복약/외래/생활/습관 알림·마음프로 네이티브 음성·이완 TTS는 유지됩니다. 웹 main SHA는 6b030239c2280cec46616fb8060899c6a48c4062 입니다.' \
            --prerelease
