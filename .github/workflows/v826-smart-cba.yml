name: V8.2.6 SMART CBA

on:
  push:
    branches: [v8.2.6-smart-cba]
    paths:
      - 'v826-smart-cba.py'
      - '.github/workflows/v826-smart-cba.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.6-smart-cba
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply SMART CBA patch
        run: python v826-smart-cba.py
      - name: Verify product changes
        run: |
          grep -q "const BUILD = 'V8.2.6'" index.html
          grep -q "const DATA_SCHEMA = 6" index.html
          grep -q "id=\"p-smart-cba\"" index.html
          grep -q "function drawSmartCba" index.html
          grep -q "SMART_CBA_GROUPS" index.html
          grep -q "네 영역을 모두" index.html
          grep -q "단기·장기" index.html
          grep -q "type === 'smart-cba'" index.html
          grep -q '"type": "smart-cba"' learning-data.js
          grep -q 'CBA 비용-편익 분석 작성하기' learning-data.js
          grep -q "const APP_VERSION = 'V8.2.6'" sw.js
          grep -q "ohg-v826-smart-cba" sw.js
          node --check learning-data.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/oneul-main.js').write_text(blocks[-1], encoding='utf-8')
          PY
          node --check /tmp/oneul-main.js
          git diff --check
      - name: Verify scope
        run: |
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "index.html learning-data.js sw.js "
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html learning-data.js sw.js
          git commit -m 'V8.2.6 add SMART Recovery CBA worksheet' || true
          git push
