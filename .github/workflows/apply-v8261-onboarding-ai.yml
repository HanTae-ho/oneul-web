name: Apply V8.2.61 onboarding AI setting
on:
  push:
    branches: [v8.2.61-onboarding-ai-setting]
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.61-onboarding-ai-setting
          fetch-depth: 0
      - name: Patch and verify
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          def once(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1, got {c}')
              s=s.replace(old,new,1)

          once("const BUILD = 'V8.2.60';", "const BUILD = 'V8.2.61';", 'BUILD')
          once("  aiChat: [], aiClient: '', aiConsent: 0, aiAutoRead: 0, /* AI 대화·음성 기본설정은 이 기기에만 저장 */",
               "  aiChat: [], aiClient: '', aiConsent: 0, aiEnabled: 1, aiAutoRead: 0, /* AI 대화·음성 기본설정은 이 기기에만 저장 */", 'aiEnabled default')

          once('  <button class="btn" id="ob-go">시작하기</button>', '''  <div class="card" id="ob-privacy-ai">
    <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer">
      <input type="checkbox" id="ob-privacy" style="width:18px;height:18px;flex:none;margin:3px 0 0;padding:0">
      <span><a href="./privacy.html" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="color:var(--acc);font-weight:700">개인정보처리방침</a>을 확인했습니다. <span class="tiny" style="color:var(--bad);font-weight:700">필수</span></span>
    </label>
    <div class="sep"></div>
    <label style="display:flex;align-items:flex-start;gap:9px;cursor:pointer">
      <input type="checkbox" id="ob-ai-use" checked style="width:18px;height:18px;flex:none;margin:3px 0 0;padding:0">
      <span><b>마음프로 AI 사용</b><span class="tiny" style="display:block;margin-top:3px">마음프로에 입력한 내용은 AI 답변이 필요한 경우 외부 AI 서비스에서 처리될 수 있습니다. 기기에 저장된 회복기록은 자동으로 전송되지 않습니다.</span></span>
    </label>
  </div>

  <button class="btn" id="ob-go">시작하기</button>''', 'onboarding controls')

          once('''  S.types = obTypes.slice();
  S.dates = {};''', '''  if(!$('#ob-privacy').checked){
    toast('개인정보처리방침을 확인해 주세요.');
    return;
  }
  S.aiEnabled = $('#ob-ai-use').checked ? 1 : 0;
  S.types = obTypes.slice();
  S.dates = {};''', 'onboarding save')

          once('''      <p class="muted" style="margin:0">앱 기능은 기기에서 먼저 처리하고, <b>내가 직접 적은 일반 대화만</b> AI로 보냅니다. 개인 회복기록은 자동 전송하지 않습니다.</p>
      <div class="sp" style="align-items:center;margin-top:9px;gap:8px">
        <p class="tiny" id="ai-consent-state" style="margin:0;flex:1"></p>
        <button class="tiny hide" id="ai-consent-revoke" type="button" style="color:var(--acc);font-weight:600">동의 철회</button>
      </div>
''', '', 'remove MindPro consent display')

          pat=r"const AI_CONSENT_VERSION = 1;\nfunction drawAIConsentState\(\)\{.*?\n\}\nfunction aiAdd\(role, text, local\)\{"
          s2,n=re.subn(pat, 'function aiAdd(role, text, local){', s, count=1, flags=re.S)
          if n!=1: raise SystemExit(f'remove consent functions: {n}')
          s=s2

          once("  if(!isLocal && !aiEnsureExternalConsent(text, topic)) return;", '''  if(!isLocal && Number(S.aiEnabled || 0) !== 1){
    aiAdd('assistant','마음프로 AI 사용이 꺼져 있어 이 요청에는 AI 답변을 사용할 수 없습니다. 내 정보 · 설정 → 앱에서 마음프로 AI 사용을 켤 수 있습니다.', true);
    drawAI();
    return;
  }''', 'AI enabled gate')

          once("const aiConsentRevoke=$('#ai-consent-revoke'); if(aiConsentRevoke) aiConsentRevoke.onclick=aiWithdrawExternalConsent;\ndrawAIConsentState();\n", '', 'remove consent bind')

          once('''      <div class="opts" id="me-theme">
        <button class="opt" data-theme="light">밝게</button>
        <button class="opt" data-theme="dark">어둡게</button>
      </div>

      <div id="me-ai-voice" class="hide">''', '''      <div class="opts" id="me-theme">
        <button class="opt" data-theme="light">밝게</button>
        <button class="opt" data-theme="dark">어둡게</button>
      </div>

      <div class="sep"></div>
      <h3>마음프로 AI</h3>
      <p class="muted" style="margin:-4px 0 11px">AI 답변이 필요한 경우 마음프로에 직접 입력한 내용과 최근 대화 일부가 외부 AI 서비스에서 처리될 수 있습니다. 기기에 저장된 회복기록은 자동으로 전송되지 않습니다.</p>
      <div class="opts" id="me-ai-use">
        <button class="opt" data-ai-use="1">사용</button>
        <button class="opt" data-ai-use="0">사용 안 함</button>
      </div>

      <div id="me-ai-voice" class="hide">''', 'settings AI control')

          once('''function drawThemeSetting(){
  $$('#me-theme [data-theme]').forEach(b => {
    const k = b.dataset.theme;
    const on = (k === 'dark') ? S.theme === 'dark' : S.theme !== 'dark';
    b.classList.toggle('on', on);
  });
}
''', '''function drawThemeSetting(){
  $$('#me-theme [data-theme]').forEach(b => {
    const k = b.dataset.theme;
    const on = (k === 'dark') ? S.theme === 'dark' : S.theme !== 'dark';
    b.classList.toggle('on', on);
  });
}
function drawAIUseSetting(){
  $$('#me-ai-use [data-ai-use]').forEach(b => b.classList.toggle('on', Number(b.dataset.aiUse) === (Number(S.aiEnabled || 0) === 1 ? 1 : 0)));
}
''', 'draw AI setting')

          once('''$('#me-theme').addEventListener('click', e => {
  const b = e.target.closest('[data-theme]');
  if(!b) return;
  S.theme = b.dataset.theme === 'dark' ? 'dark' : '';
  applyTheme(); save(); drawThemeSetting();
});''', '''$('#me-theme').addEventListener('click', e => {
  const b = e.target.closest('[data-theme]');
  if(!b) return;
  S.theme = b.dataset.theme === 'dark' ? 'dark' : '';
  applyTheme(); save(); drawThemeSetting();
});
$('#me-ai-use').addEventListener('click', e => {
  const b = e.target.closest('[data-ai-use]');
  if(!b) return;
  S.aiEnabled = Number(b.dataset.aiUse) === 1 ? 1 : 0;
  save(); drawAIUseSetting();
  toast(S.aiEnabled ? '마음프로 AI를 사용합니다.' : '마음프로 AI 사용을 껐습니다. 앱의 로컬 기능은 그대로 사용할 수 있습니다.');
});''', 'AI setting handler')

          once('''function drawMe(){
  const fam = famMode();
  drawThemeSetting();
  drawAiVoiceSetting();''', '''function drawMe(){
  const fam = famMode();
  drawThemeSetting();
  drawAIUseSetting();
  drawAiVoiceSetting();''', 'drawMe AI setting')

          s=s.replace('<span id="acc-app-s">자원 목록 · 화면 설정 · 앱 새로고침 · 앱 설치</span>', '<span id="acc-app-s">자원 목록 · 화면 설정 · 마음프로 AI · 앱 새로고침 · 앱 설치</span>', 1)
          s=s.replace("'자원 목록 · 화면 설정' + voice + ' · 앱 새로고침 · 앱 설치", "'자원 목록 · 화면 설정 · 마음프로 AI' + voice + ' · 앱 새로고침 · 앱 설치'")
          s=s.replace('일반 대화에서 사용자가 직접 전송한 문장은 AI 답변 생성을 위해 서버로 전송됩니다.', 'AI 답변이 필요한 경우 사용자가 직접 입력한 내용과 최근 대화 일부가 서버로 전송될 수 있습니다. 마음프로 AI 사용은 내 정보 · 설정 → 앱에서 언제든 켜거나 끌 수 있습니다.')
          s=s.replace('앱</b>에서는 자원 목록 새로 받기, 화면 밝기, 앱 새로고침·설치와 Android 마음프로 음성 설정을 관리합니다.', '앱</b>에서는 자원 목록 새로 받기, 화면 밝기, 마음프로 AI 사용 여부, 앱 새로고침·설치와 Android 마음프로 음성 설정을 관리합니다.')
          s=s.replace('/* 여기까지 온 일반 대화만 AI 서버로 보냅니다. 자원 후보나 회복기록은 붙이지 않습니다. */', '/* 여기까지 온 요청 중 AI 답변이 필요한 내용만 서버로 보냅니다. 자원 후보나 회복기록은 붙이지 않습니다. */')
          s=s.replace('★ 개인 회복기록은 자동 전송하지 않고, 일반 AI 대화에서 현재 문장과 최근 일반 대화 문맥만 AI 서버로 전송합니다.', '★ 개인 회복기록은 자동 전송하지 않고, AI 답변이 필요한 경우 현재 문장과 최근 AI 대화 문맥만 서버로 전송합니다.')
          p.write_text(s,encoding='utf-8')

          p=Path('privacy.html'); q=p.read_text(encoding='utf-8')
          q=q.replace('V8.2.60','V8.2.61')
          old='<p><b>마음프로</b><br>일반 AI 대화를 처음 전송하기 전에 전송 항목과 외부 처리를 안내하고 사용자의 명시적 동의를 받습니다. 동의한 경우에만 익명형 기기 식별값, 현재 메시지, 대화 주제, 앱 버전, 최근 일반 AI 대화 최대 8개가 Google Apps Script를 거쳐 OpenAI API로 전송됩니다.</p>'
          new='<p><b>마음프로</b><br>마음프로 AI 사용은 최초 설정에서 기본적으로 켜져 있으며 사용자가 해제하거나 나중에 설정에서 언제든 켜고 끌 수 있습니다. AI 답변이 필요한 경우 익명형 기기 식별값, 현재 메시지, 대화 주제, 앱 버전, 최근 AI 대화 최대 8개가 Google Apps Script를 거쳐 OpenAI API로 전송됩니다.</p>'
          if old not in q: raise SystemExit('privacy MindPro paragraph not found')
          q=q.replace(old,new,1)
          q=q.replace('마음프로 일반 대화의 AI 답변 생성','마음프로 AI 답변 생성')
          q=q.replace('위치 권한, 마음프로, 의견 보내기는 사용자가 선택할 수 있으며, 마음프로 AI 외부 전송 동의는 마음프로 안내에서 철회할 수 있습니다.', '위치 권한과 의견 보내기는 사용자가 선택할 수 있으며, 마음프로 AI 사용은 최초 설정과 ‘내 정보 · 설정 → 앱’에서 언제든 끄거나 다시 켤 수 있습니다.')
          p.write_text(q,encoding='utf-8')

          p=Path('sw.js'); w=p.read_text(encoding='utf-8')
          w=w.replace("const APP_VERSION = 'V8.2.60';", "const APP_VERSION = 'V8.2.61';")
          w=w.replace("const V = 'ohg-v8260-mindpro-consent';", "const V = 'ohg-v8261-onboarding-ai';")
          p.write_text(w,encoding='utf-8')

          p=Path('test.js'); t=p.read_text(encoding='utf-8')
          old="  await shot('2-onboard');\n  await pg.click('#ob-go');"
          new="  assert(await pg.isChecked('#ob-ai-use'), '최초 설정에서 마음프로 AI 사용은 기본 ON');\n  await pg.check('#ob-privacy');\n  await shot('2-onboard');\n  await pg.click('#ob-go');"
          if old not in t: raise SystemExit('test onboarding insertion point not found')
          t=t.replace(old,new,1)
          p.write_text(t,encoding='utf-8')

          p=Path('README.md'); r=p.read_text(encoding='utf-8')
          head='''## V8.2.61 — 최초 설정 개인정보 확인 · 마음프로 AI 기본 사용 설정
- 최초 설정의 `시작하기` 바로 위에 개인정보처리방침 확인 체크와 마음프로 AI 사용 설정을 배치했습니다. 개인정보처리방침 확인은 필수이며, 마음프로 AI는 기본 ON이지만 사용자가 해제할 수 있습니다.
- 마음프로 안에서 일반/로컬 대화를 사용자가 구분하지 않도록 하고, 기존 `동의하고 계속 / 취소` 전송 팝업과 동의 상태·철회 표시를 제거했습니다.
- 마음프로 AI 사용 여부는 `내 정보 · 설정 → 앱`에서 언제든 켜거나 끌 수 있습니다. AI를 꺼도 타이머·도움글·모임·센터·병원·헬프콜·기록 등 로컬 기능은 계속 사용할 수 있습니다.
- 서버 전송 구조는 변경하지 않습니다. AI 답변이 필요한 경우 기존처럼 익명형 clientId·현재 메시지·주제·앱 버전·최근 AI 대화 최대 8개를 전송하며, 저장된 회복기록은 자동 첨부하지 않습니다.
- `DATA_SCHEMA=6`, `ohg.v1`, 기존 회복기록 형식과 Android 정확알림·화면 OFF 알림·부팅 재예약·네이티브 TTS·이완 TTS는 변경하지 않습니다.

'''
          if r.startswith('## V8.2.60'):
              r=head+r
          else:
              raise SystemExit('README top version unexpected')
          p.write_text(r,encoding='utf-8')
          PY

          # Guardrails: agreed scope and protected invariants
          grep -q "const BUILD = 'V8.2.61';" index.html
          grep -q "const KEY = 'ohg.v1';" index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          grep -q 'id="ob-privacy"' index.html
          grep -q 'id="ob-ai-use" checked' index.html
          grep -q 'id="me-ai-use"' index.html
          ! grep -q 'aiEnsureExternalConsent' index.html
          ! grep -q 'ai-consent-yes' index.html
          ! grep -q 'ai-consent-revoke' index.html
          grep -q 'history: prior.map' index.html
          grep -q 'clientId: aiClientId()' index.html
          grep -q 'slice(-8)' index.html
          grep -q "const APP_VERSION = 'V8.2.61';" sw.js
          grep -q "const V = 'ohg-v8261-onboarding-ai';" sw.js
          grep -q '마음프로 AI 사용은 최초 설정에서 기본적으로 켜져' privacy.html
          grep -q '최초 설정에서 마음프로 AI 사용은 기본 ON' test.js

          # Inline JavaScript syntax check
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check sw.js
          git diff --check
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Changed: $changed"
          test "$changed" = "README.md index.html privacy.html sw.js test.js "

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-v8261-onboarding-ai.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html privacy.html sw.js test.js .github/workflows/apply-v8261-onboarding-ai.yml
          git commit -m 'V8.2.61 최초 설정 개인정보 확인 · 마음프로 AI 기본 사용'
          git push origin HEAD:v8.2.61-onboarding-ai-setting
