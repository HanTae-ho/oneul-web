name: Apply V8.2.61
on: [push]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.61-onboarding-ai-setting
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/apply_v8261.py
      - name: Fix app summary strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          fixes=[
            ("' · 앱 새로고침 · 앱 설치'<br><span", "' · 앱 새로고침 · 앱 설치<br><span"),
            ("' · 앱 새로고침 · 앱 설치'';", "' · 앱 새로고침 · 앱 설치';")
          ]
          for bad,good in fixes:
              if bad not in s: raise SystemExit('expected temporary summary-string pattern not found: '+bad)
              s=s.replace(bad,good,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        shell: bash
        run: |
          grep -q "const BUILD = 'V8.2.61';" index.html
          grep -q "const KEY = 'ohg.v1';" index.html
          grep -q "const DATA_SCHEMA = 6;" index.html
          grep -q 'id="ob-privacy"' index.html
          grep -q 'id="ob-ai-use" checked' index.html
          grep -q 'id="me-ai-use"' index.html
          ! grep -q 'aiEnsureExternalConsent' index.html
          ! grep -q 'ai-consent-yes' index.html
          ! grep -q 'ai-consent-revoke' index.html
          grep -q 'history: prior.map' index.html
          grep -q 'clientId: aiClientId()' index.html
          grep -q 'slice(-8)' index.html
          grep -q "const APP_VERSION = 'V8.2.61';" sw.js
          grep -q "const V = 'ohg-v8261-onboarding-ai';" sw.js
          grep -q '마음프로 AI 사용은 최초 설정에서 기본적으로 켜져' privacy.html
          grep -q '최초 설정에서 마음프로 AI 사용은 기본 ON' test.js
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path('index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          pathlib.Path('/tmp/inline.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/inline.js
          node --check sw.js
          git diff --check
          changed=$(git diff --name-only | sort | tr '\n' ' ')
          echo "Changed: $changed"
          test "$changed" = "README.md index.html privacy.html sw.js test.js "
      - name: Commit result
        shell: bash
        run: |
          rm -f .github/apply_v8261.py .github/workflows/apply-v8261-onboarding-ai.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'V8.2.61 최초 설정 개인정보 확인 · 마음프로 AI 기본 사용'
          git push origin HEAD:v8.2.61-onboarding-ai-setting
