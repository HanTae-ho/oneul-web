name: Apply V8.2.40 copy cleanup

on:
  push:
    branches:
      - v8.2.40-copy-cleanup
    paths:
      - .github/workflows/v8240-copy-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8.2.40-copy-cleanup

      - name: Apply copy cleanup
        run: python tools/v8240_copy_cleanup.py

      - name: Validate diff and versions
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq "const BUILD = 'V8.2.40';" index.html
          grep -Fq "const DATA_SCHEMA = 6;" index.html
          grep -Fq "const KEY = 'ohg.v1';" index.html
          grep -Fq "const APP_VERSION = 'V8.2.40';" sw.js
          grep -Fq "const V = 'ohg-v8240-copy-cleanup';" sw.js
          ! grep -Fq '기존 저장방식은 그대로 두고 최근 기록부터 한곳에서 보여줍니다' index.html
          ! grep -Fq '가족 12단계 점검, 가족 모임, 긴급 도움은 각각 기존' index.html
          ! grep -Fq '가족·보호자 모드에서는 당사자 대신 중독 선별검사를 작성하지 않습니다' index.html
          ! grep -Fq '누르면 펼쳐집니다. 한 번에 하나씩 열립니다.' index.html
          grep -Fq '상대를 감시하거나 바꾸기 위한 도구가 아닙니다.' index.html
          grep -Fq '자가점검은 진단이 아닙니다.' index.html
          grep -Fq '위험 신호가 있으면 계획보다 안전이 먼저입니다' index.html
          grep -Fq 'SMART 전체 도구 더 보기' index.html

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          html=Path('index.html').read_text(encoding='utf-8')
          parts=[]
          for attrs, body in re.findall(r'<script([^>]*)>(.*?)</script>', html, re.S|re.I):
              if 'src=' not in attrs.lower():
                  parts.append(body)
          Path('/tmp/oneul-inline.js').write_text('\n'.join(parts), encoding='utf-8')
          PY
          node --check /tmp/oneul-inline.js
          node --check sw.js

      - name: Commit verified app files only
        shell: bash
        run: |
          set -euo pipefail
          rm -f tools/v8240_copy_cleanup.py .github/workflows/v8240-copy-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md index.html sw.js tools/v8240_copy_cleanup.py .github/workflows/v8240-copy-cleanup.yml
          git commit -m 'V8.2.40 사용자 문구 다이어트'
          git push origin HEAD:v8.2.40-copy-cleanup
