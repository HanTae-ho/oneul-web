name: Publish V8.2.56 test release

on:
  push:
    branches: [android-v8.2.56-user-manual]
    paths:
      - '.github/workflows/publish-v8256-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.56 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34188172076 -n oneul-v8.2.56-user-manual-apk -D dist-apk
          gh run download 34188172076 -n oneul-v8.2.56-user-manual-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.56.apk
          cp dist-aab/*.aab oneul-v8.2.56.aab
          test -s oneul-v8.2.56.apk
          test -s oneul-v8.2.56.aab
          sha256sum oneul-v8.2.56.apk oneul-v8.2.56.aab
      - name: Publish V8.2.56 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.56-test --yes --cleanup-tag || true
          gh release create v8.2.56-test oneul-v8.2.56.apk oneul-v8.2.56.aab \
            --target android-v8.2.56-user-manual \
            --title '오늘 한 걸음 V8.2.56 사용설명서 테스트' \
            --notes '내 정보 · 설정 → 지원 및 안내에 사용자용 사용설명서를 추가했습니다. 사용설명서는 처음 시작하기, 화면 구조, 홈, 회복도구, 일정·알림, 12단계·회복 실천도구, 자가점검, 내 발자취, 헬프·위기, 마음프로, 가족·보호자, 설정·백업, Android 알림·음성, 기록 보관을 현재 앱의 실제 메뉴 흐름에 맞춰 안내합니다. 개인정보처리방침은 이번 버전에 포함하지 않았으며 다음 단계에서 실제 데이터 흐름을 검증한 뒤 별도로 작성합니다. Android는 V8.2.55에서 검증한 네이티브 TTS·정확알림·화면 OFF 알림·부팅 재예약·복약/외래/생활/습관 알림·이완 TTS 스택을 그대로 사용하고 versionCode 876 / versionName 8.2.56만 적용했습니다. 웹 기준 main SHA는 3c13e2275323743331467f266e2e07adfd825a40 입니다.' \
            --prerelease
