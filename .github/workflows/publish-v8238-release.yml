name: Publish V8.2.38 test release

on:
  push:
    branches: [android-v8.2.38-usability-consolidation]
    paths:
      - '.github/workflows/publish-v8238-release.yml'

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified V8.2.38 artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 34084490194 -n oneul-v8.2.38-usability-consolidation-apk -D dist-apk
          gh run download 34084490194 -n oneul-v8.2.38-usability-consolidation-aab -D dist-aab
          cp dist-apk/*.apk oneul-v8.2.38.apk
          cp dist-aab/*.aab oneul-v8.2.38.aab
          test -s oneul-v8.2.38.apk
          test -s oneul-v8.2.38.aab
          sha256sum oneul-v8.2.38.apk oneul-v8.2.38.aab
      - name: Publish V8.2.38 test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v8.2.38-test --yes --cleanup-tag || true
          gh release create v8.2.38-test oneul-v8.2.38.apk oneul-v8.2.38.aab \
            --target android-v8.2.38-usability-consolidation \
            --title '오늘 한 걸음 V8.2.38 정리 · 통합 · 사용성 1차 테스트' \
            --notes '새 기능을 추가하지 않고 기존 기능을 더 쉽게 찾도록 정리했습니다. SMART 실천도구는 18개 버튼을 한 화면에 모두 노출하지 않고 4개 Point를 먼저 보여준 뒤 필요한 Point 하나만 펼치도록 했습니다. 기존 SMART 도구와 저장기록은 모두 유지됩니다. 가족을 위한 도구는 내 경계 정리·대화 준비·다시 사용했을 때 내 대응계획 3개를 바로 보이게 유지하고, ABC·CBA·문제 해결 5단계 및 삶의 균형·VACI·이완·건강 회복은 필요할 때 펼치는 보조 묶음으로 정리했습니다. 회복도구의 단계별 점검 표기는 12단계 점검으로 명확히 했습니다. 홈·일정·알림·저장구조·DATA_SCHEMA 6·가족 충동/재발 비기록·SMART/12단계 내용 자체는 변경하지 않았으며, Android 이완 TTS·화면 OFF 지속 재생·속도 선택·정확알림 엔진과 부팅 후 재예약도 그대로 유지했습니다.' \
            --prerelease
