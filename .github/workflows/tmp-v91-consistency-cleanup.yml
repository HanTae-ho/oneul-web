name: Temp V9.1 consistency cleanup

on:
  push:
    branches:
      - v9.1-ux-consolidation
    paths:
      - .github/workflows/tmp-v91-consistency-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v9.1-ux-consolidation
          fetch-depth: 0
      - run: python .github/scripts/apply_v91_consistency_cleanup.py
      - run: node verify.js
      - run: git diff --check
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html privacy.html README.md verify.js
          git commit -m "V9.1: align community terminology and changelog"
          git push origin HEAD:v9.1-ux-consolidation
