<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1f6f8a">
  <title>오늘 한 걸음</title>
</head>
<body>
<script>
(function(){
  try {
    sessionStorage.setItem('ohg.native.app', '1');
    const q=new URLSearchParams(location.search||'');
    const raw=String(q.get('appv')||'').trim();
    if(/^\d+\.\d+\.\d+$/.test(raw)) sessionStorage.setItem('ohg.native.version','V'+raw);
  } catch(e) {}
  location.replace('./index.html?native=1');
})();
</script>
<noscript><a href="./index.html">오늘 한 걸음 열기</a></noscript>
</body>
</html>
